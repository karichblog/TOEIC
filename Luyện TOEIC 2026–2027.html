 âm thanh là thường: loại theo âm trước, rồi kiểm tra nghĩa."}]}, {"part": 2, "q": "Let's offer a free sample with every online order.", "sp": ["W", "M"], "vocab": [["free sample", "hàng mẫu miễn phí"], ["increase costs", "tăng chi phí"]], "qs": [{"opts": ["Every Thursday.", "That might increase our costs.", "I ordered it online."], "a": "B", "type": "L2-stmt", "vi": "Hãy tặng mẫu miễn phí kèm mỗi đơn online. → Việc đó có thể làm tăng chi phí.", "ex": "Gợi ý dạng 'Let's...' → (B) phản đối nhẹ kèm lý do.", "elim": "(A) lặp 'every'. (C) lặp 'order', 'online'.", "tip": "Đáp án phản đối/lo ngại vẫn là phản hồi hợp lý; không chỉ có 'Good idea' mới đúng."}]}, {"part": 2, "q": "How did the product demonstration go?", "sp": ["M", "W"], "vocab": [["product demonstration", "buổi trình diễn sản phẩm"]], "qs": [{"opts": ["By train.", "At two o'clock.", "Better than we expected."], "a": "C", "type": "L2-wh", "vi": "Buổi trình diễn sản phẩm diễn ra thế nào? → Tốt hơn chúng tôi mong đợi.", "ex": "'How did ... go?' hỏi kết quả → (C).", "elim": "(A) trả lời How (phương tiện). (B) trả lời When.", "tip": "How có nhiều nghĩa: How did it go (kết quả), How do you get (phương tiện), How long/often/much."}]}, {"part": 2, "q": "Should we print the flyers in color or black and white?", "sp": ["W", "M"], "vocab": [["flyer", "tờ rơi"], ["within budget", "trong ngân sách"]], "qs": [{"opts": ["Color, if it's within budget.", "Yes, print them.", "I painted it black."], "a": "A", "type": "L2-choice", "vi": "In tờ rơi màu hay đen trắng? → In màu, nếu nằm trong ngân sách.", "ex": "Chọn một lựa chọn kèm điều kiện (A).", "elim": "(B) Yes cho câu lựa chọn. (C) lặp 'black'.", "tip": "Chọn 1 + điều kiện (if/as long as) là dạng đáp án đúng phổ biến."}]}, {"part": 2, "q": "Sales figures for October are lower than last year.", "sp": ["M", "W"], "vocab": [["sales figures", "số liệu doanh số"], ["holiday season", "mùa lễ hội"]], "qs": [{"opts": ["In the lower drawer.", "The holiday season should help.", "Last year's conference."], "a": "B", "type": "L2-stmt", "vi": "Doanh số tháng 10 thấp hơn năm ngoái. → Mùa lễ hội sẽ giúp cải thiện.", "ex": "Phản hồi lạc quan về tin xấu (B).", "elim": "(A) lặp 'lower'. (C) lặp 'last year'.", "tip": "Hai đáp án sai đều lặp từ → đáp án còn lại thường đúng dù nghe 'không liên quan' lúc đầu."}]}, {"part": 3, "convo": [["M", "Hello, I'm organizing a product launch for about two hundred guests next month. Do you have a ballroom available on November twentieth?"], ["W", "Let me check. Our Grand Ballroom is already booked that day, but the Crystal Hall is free. It holds up to two hundred fifty people."], ["M", "That works. We'll also need a stage and a sound system for the presentation."], ["W", "Both are included. Would you like me to send you a catering menu as well?"], ["M", "Yes, please. I'd like to share it with my manager before we decide."]], "vocab": [["ballroom", "phòng tiệc lớn"], ["hold up to", "chứa tối đa"], ["catering", "dịch vụ ăn uống"]], "qs": [{"q": "What is the man organizing?", "opts": ["A wedding", "A product launch", "A training session", "A concert"], "a": "B", "type": "L34-main", "vi": "Người đàn ông đang tổ chức gì? → Một buổi ra mắt sản phẩm.", "ex": "'organizing a product launch'.", "elim": "Các sự kiện khác không được nhắc.", "tip": "Câu đầu của người gọi = mục đích."}, {"q": "What does the woman say about the Grand Ballroom?", "opts": ["It is too small.", "It is being renovated.", "It has no sound system.", "It has already been reserved."], "a": "D", "type": "L34-detail", "vi": "Người phụ nữ nói gì về Grand Ballroom? → Đã được đặt rồi.", "ex": "'already booked that day' → reserved.", "elim": "(A) sức chứa 250 là của Crystal Hall.", "tip": "booked = reserved = taken."}, {"q": "Why does the man want a menu?", "opts": ["To show it to his manager", "To compare prices with another hotel", "To choose a vegetarian option", "To print it for guests"], "a": "A", "type": "L34-detail", "vi": "Vì sao anh ấy muốn thực đơn? → Để cho quản lý xem.", "ex": "'share it with my manager before we decide'.", "elim": "Không nhắc so sánh giá, món chay hay in cho khách.", "tip": "share with → show to."}]}, {"part": 3, "convo": [["W", "Hi Jason, did you see the sales report for the new smartwatch?"], ["M", "Yes. Online sales are strong, but in-store sales are way below target."], ["W", "I visited a few stores last week. The watches were displayed at the back, next to the phone cases."], ["M", "Well, that explains a lot."], ["W", "I've already contacted the store managers and asked them to move the display to the front entrance."], ["M", "Good. Let's check the numbers again at the end of the month."]], "vocab": [["below target", "dưới mục tiêu"], ["display", "quầy trưng bày; trưng bày"], ["front entrance", "lối vào chính"]], "qs": [{"q": "What problem are the speakers discussing?", "opts": ["Customer complaints online", "A defective product", "Poor sales in stores", "A late shipment"], "a": "C", "type": "L34-main", "vi": "Vấn đề họ đang bàn là gì? → Doanh số tại cửa hàng kém.", "ex": "'in-store sales are way below target'.", "elim": "(A) online bán tốt. (B), (D) không được nhắc.", "tip": "Vấn đề thường đi sau 'but'."}, {"q": "What does the man imply when he says, \"that explains a lot\"?", "opts": ["The display location is likely the cause.", "The report contains an error.", "He needs more information.", "The phone cases are popular."], "a": "A", "type": "L34-intent", "vi": "'Vậy là rõ rồi' → Vị trí trưng bày có lẽ là nguyên nhân.", "ex": "Đáp lại thông tin đồng hồ bày ở cuối cửa hàng → lý giải doanh số thấp.", "elim": "(C) ngược nghĩa. (D) hiểu sai trọng tâm.", "tip": "'That explains it/a lot' = câu trước là nguyên nhân của vấn đề đã nêu."}, {"q": "What has the woman already done?", "opts": ["Lowered prices", "Spoken with store managers", "Visited the factory", "Hired more staff"], "a": "B", "type": "L34-detail", "vi": "Người phụ nữ đã làm gì? → Đã trao đổi với quản lý cửa hàng.", "ex": "'I've already contacted the store managers'.", "elim": "Không giảm giá, không đến nhà máy.", "tip": "'already' trong câu hỏi ↔ 'I've already...' trong bài."}]}, {"part": 3, "convo": [["W", "We have one thousand dollars left in this quarter's advertising budget. What should we use it for?"], ["M", "Our customers are mostly young professionals, so I'd suggest the social media package."], ["W", "That's over budget, though."], ["M", "True. Then how about the posters at bus stops? A lot of commuters would see them."], ["W", "OK, let's do that. I'll call the advertising company this afternoon to reserve a spot near the train station."]], "graphic": {"title": "Advertising Options", "head": ["Option", "Price"], "rows": [["Bus stop posters", "$800 / month"], ["Newspaper half page", "$950"], ["Radio spot (30 sec.)", "$1,200 / week"], ["Social media package", "$1,500 / month"]]}, "vocab": [["commuter", "người đi làm hằng ngày"], ["over budget", "vượt ngân sách"], ["reserve a spot", "đặt một vị trí"]], "qs": [{"q": "Who are the company's main customers?", "opts": ["Students", "Retirees", "Families", "Young professionals"], "a": "D", "type": "L34-detail", "vi": "Khách hàng chính là ai? → Người trẻ đi làm.", "ex": "'Our customers are mostly young professionals'.", "elim": "Không có nhóm khác.", "tip": "mostly / mainly ↔ main."}, {"q": "Look at the graphic. How much will the speakers most likely spend?", "opts": ["$800", "$950", "$1,200", "$1,500"], "a": "A", "type": "L34-graphic", "vi": "Họ sẽ chi bao nhiêu? → $800.", "ex": "Chọn poster ở trạm xe buýt → $800/tháng, nằm trong ngân sách $1,000.", "elim": "(D) gói mạng xã hội bị loại vì vượt ngân sách. (B) báo không được bàn.", "tip": "Biểu đồ + ý kiến bị bác bỏ: nghe đến quyết định CUỐI CÙNG ('OK, let's do that')."}, {"q": "What will the woman do this afternoon?", "opts": ["Design a poster", "Visit a train station", "Contact an advertising agency", "Revise the budget"], "a": "C", "type": "L34-next", "vi": "Chiều nay người phụ nữ sẽ làm gì? → Liên hệ công ty quảng cáo.", "ex": "'I'll call the advertising company this afternoon'.", "elim": "(B) nhà ga chỉ là vị trí đặt poster.", "tip": "call → contact; advertising company → agency."}]}, {"part": 4, "convo": [["N", "Is your small business ready for the holiday rush? Join us at the Riverside Business Expo on December third and fourth at the City Convention Center. You'll find over one hundred fifty exhibitors offering the latest tools for online sales, payment processing, and customer service. Don't miss the free workshops led by successful local entrepreneurs. Tickets are just fifteen dollars, and they're half price if you register on our Web site before November twentieth. Visit riversideexpo dot com for details."]], "vocab": [["holiday rush", "cao điểm mùa lễ"], ["exhibitor", "đơn vị trưng bày"], ["entrepreneur", "doanh nhân khởi nghiệp"]], "qs": [{"q": "Who is the advertisement intended for?", "opts": ["University students", "Small business owners", "Tourists", "City officials"], "a": "B", "type": "L34-who", "vi": "Quảng cáo nhắm đến ai? → Chủ doanh nghiệp nhỏ.", "ex": "Câu mở đầu: 'Is your small business ready...?'", "elim": "Các nhóm khác không được nhắc.", "tip": "Câu hỏi mở đầu quảng cáo cho biết đối tượng người nghe."}, {"q": "What is offered for free?", "opts": ["Parking", "Tickets", "Lunch", "Workshops"], "a": "D", "type": "L34-detail", "vi": "Điều gì được miễn phí? → Các buổi hội thảo.", "ex": "'free workshops led by... entrepreneurs'.", "elim": "(B) vé có giá $15.", "tip": "Phân biệt free với half price."}, {"q": "How can listeners get a discount?", "opts": ["By registering online early", "By bringing a friend", "By visiting on the first day", "By joining a business association"], "a": "A", "type": "L34-detail", "vi": "Làm sao để được giảm giá? → Đăng ký trực tuyến sớm.", "ex": "'half price if you register on our Web site before November twentieth'.", "elim": "Các cách khác không được nhắc.", "tip": "before + ngày → early (paraphrase)."}]}, {"part": 4, "convo": [["N", "Thanks for coming, everyone. I want to update you on our customer loyalty app. Since we launched it in August, about twelve thousand customers have downloaded it. That's good, but only twenty percent of them use it more than once a month. So, starting next week, we'll send personalized discount offers through the app based on each customer's purchase history. Now, our IT team says this feature is complicated. But they've built similar systems before. Lisa will be in charge of testing, so please send her any bugs you find."]], "vocab": [["loyalty app", "ứng dụng khách hàng thân thiết"], ["purchase history", "lịch sử mua hàng"], ["bug", "lỗi phần mềm"]], "qs": [{"q": "What is the speaker mainly discussing?", "opts": ["A hiring plan", "A store opening", "A customer app", "A price change"], "a": "C", "type": "L34-main", "vi": "Người nói chủ yếu bàn về? → Một ứng dụng cho khách hàng.", "ex": "'update you on our customer loyalty app'.", "elim": "(D) discount offers là chi tiết.", "tip": "'I want to update you on...' = chủ đề."}, {"q": "What will the company start doing next week?", "opts": ["Opening a new store", "Hiring IT staff", "Surveying customers", "Sending customized discounts"], "a": "D", "type": "L34-detail", "vi": "Tuần tới công ty bắt đầu làm gì? → Gửi ưu đãi giảm giá cá nhân hóa.", "ex": "'send personalized discount offers' → personalized = customized.", "elim": "Không có tuyển dụng hay khảo sát.", "tip": "personalized ↔ customized ↔ tailored."}, {"q": "Why does the speaker say, \"they've built similar systems before\"?", "opts": ["To request help from listeners", "To express confidence in a team", "To explain a delay", "To introduce new staff"], "a": "B", "type": "L34-intent", "vi": "Vì sao người nói nói 'họ đã từng làm hệ thống tương tự'? → Để bày tỏ sự tin tưởng vào đội IT.", "ex": "Sau 'complicated. But...' → trấn an rằng đội IT làm được.", "elim": "(C) không có trì hoãn.", "tip": "Mẫu 'X is difficult. But...' → câu sau 'But' thể hiện sự tin tưởng/trấn an."}]}], "reading": [{"part": 5, "qs": [{"q": "The marketing department is ______ for designing all promotional materials.", "opts": ["responsibility", "responsibly", "responsive", "responsible"], "a": "D", "type": "R5-pos", "vi": "Phòng marketing chịu trách nhiệm thiết kế mọi tài liệu quảng bá.", "ex": "be responsible for = chịu trách nhiệm về.", "elim": "(C) responsive (phản hồi nhanh) là tính từ nhưng sai nghĩa và không đi với 'for' theo nghĩa này.", "tip": "Hai tính từ cùng gốc (responsible/responsive) → chọn theo giới từ đi sau và nghĩa."}, {"q": "Our latest advertising campaign was ______ more successful than the previous one.", "opts": ["considerable", "considerably", "consider", "consideration"], "a": "B", "type": "R5-comp", "vi": "Chiến dịch quảng cáo mới nhất thành công hơn đáng kể so với chiến dịch trước.", "ex": "Trạng từ bổ nghĩa cho so sánh hơn 'more successful'.", "elim": "(A) tính từ không bổ nghĩa cho 'more'.", "tip": "much/far/considerably/significantly + so sánh hơn."}, {"q": "The sales team ______ its annual target two months ahead of schedule.", "opts": ["exceeds", "exceeding", "exceeded", "to exceed"], "a": "C", "type": "R5-verb", "vi": "Đội bán hàng đã vượt mục tiêu năm trước kế hoạch hai tháng.", "ex": "Câu cần động từ chính; sự việc đã xảy ra → quá khứ.", "elim": "(B), (D) không làm động từ chính. (A) không hợp ngữ cảnh 'ahead of schedule' đã hoàn thành.", "tip": "Câu thiếu động từ chính → loại ngay V-ing và to V."}, {"q": "Our new product line will be available ______ select retailers starting next month.", "opts": ["at", "on", "of", "along"], "a": "A", "type": "R5-prep", "vi": "Dòng sản phẩm mới sẽ có mặt tại một số nhà bán lẻ từ tháng sau.", "ex": "available at + nơi bán.", "elim": "on/of/along không đi với nhà bán lẻ.", "tip": "available at (nơi), available to (người), available for (mục đích)."}, {"q": "The proposal was ______ reviewed by the legal team before it was sent to the client.", "opts": ["care", "careful", "carefully", "carefulness"], "a": "C", "type": "R5-pos", "vi": "Đề xuất được bộ phận pháp lý xem xét cẩn thận trước khi gửi khách hàng.", "ex": "Giữa 'was' và V3 'reviewed' → trạng từ.", "elim": "(B) tính từ không đứng trước V3 trong bị động.", "tip": "be + ___ + V3 → trạng từ (carefully, recently, thoroughly)."}, {"q": "______ the advertisement appeared on television, Web site traffic tripled.", "opts": ["After", "During", "Following", "Prior"], "a": "A", "type": "R5-conj", "vi": "Sau khi quảng cáo lên sóng truyền hình, lượng truy cập web tăng gấp ba.", "ex": "Sau chỗ trống là mệnh đề → liên từ After.", "elim": "(B), (C) giới từ + danh từ. (D) cần 'Prior to'.", "tip": "After/Before vừa là liên từ vừa là giới từ; During/Following chỉ là giới từ."}, {"q": "Ms. Ivanova suggested ______ the product launch until the packaging is finalized.", "opts": ["postpone", "postponing", "to postpone", "postponed"], "a": "B", "type": "R5-verb", "vi": "Bà Ivanova đề nghị hoãn ra mắt sản phẩm cho đến khi bao bì hoàn tất.", "ex": "suggest + V-ing.", "elim": "(C) suggest không đi với to V.", "tip": "Động từ + V-ing hay ra: suggest, recommend, consider, avoid, postpone, finish."}, {"q": "Please contact our customer service team ______ you have any questions about your order.", "opts": ["unless", "whereas", "so", "if"], "a": "D", "type": "R5-conj", "vi": "Vui lòng liên hệ đội chăm sóc khách hàng nếu bạn có câu hỏi về đơn hàng.", "ex": "Nghĩa điều kiện → if.", "elim": "(A) ngược nghĩa. (B) tương phản. (C) kết quả.", "tip": "Câu thư/thông báo: 'Please contact us if...' là mẫu cực kỳ phổ biến."}, {"q": "The ______ of the survey show that customers value fast delivery above price.", "opts": ["result", "results", "resulting", "resulted"], "a": "B", "type": "R5-pos", "vi": "Kết quả khảo sát cho thấy khách hàng coi trọng giao hàng nhanh hơn giá.", "ex": "Sau 'The' cần danh từ; động từ 'show' số nhiều → results.", "elim": "(A) số ít không hợp 'show'.", "tip": "Khi 2 đáp án cùng là danh từ, xem động từ chia số ít/nhiều."}, {"q": "The brochure ______ all the features of the new tablet.", "opts": ["outlines", "attends", "occurs", "arrives"], "a": "A", "type": "R5-vocab", "vi": "Tờ giới thiệu trình bày khái quát mọi tính năng của máy tính bảng mới.", "ex": "outline = trình bày khái quát, cần tân ngữ.", "elim": "occur/arrive là nội động từ; attend sai nghĩa.", "tip": "Có tân ngữ phía sau → loại nội động từ (occur, arrive, happen, rise)."}, {"q": "Neither the manager ______ her assistant was available to meet the client.", "opts": ["or", "and", "but", "nor"], "a": "D", "type": "R5-conj", "vi": "Cả quản lý lẫn trợ lý đều không rảnh để gặp khách hàng.", "ex": "Neither ... nor.", "elim": "Các liên từ khác không ghép với neither.", "tip": "Cặp liên từ là câu 'cho điểm': thấy vế đầu → chọn vế sau tương ứng."}]}, {"part": 6, "passages": [{"kind": "Press release", "title": "Sunleaf Beverages to Launch Sparkling Tea Line", "body": "Sunleaf Beverages announced today that it will {{0}} a new line of sparkling teas in March. The drinks contain no added sugar and come in three flavors: peach, lemon, and ginger. {{1}}\n\nThe company spent nearly two years {{2}} the recipes based on feedback from customer tasting panels. The sparkling teas will be sold in supermarkets nationwide and through the company's online store. {{3}}, customers who order online during the first week will receive a free reusable bottle."}], "vocab": [["tasting panel", "nhóm nếm thử"], ["nationwide", "trên toàn quốc"], ["reusable", "tái sử dụng"]], "qs": [{"opts": ["introduce", "introducing", "introduced", "introduction"], "a": "A", "type": "R6-word", "vi": "...sẽ giới thiệu một dòng trà có ga mới...", "ex": "will + V nguyên mẫu.", "elim": "Các dạng khác sai sau 'will'.", "tip": "Part 6 vẫn có câu ngữ pháp thuần như Part 5 → làm nhanh."}, {"opts": ["Sunleaf was founded in 1998 by two brothers.", "Each flavor uses natural ingredients sourced from local farms.", "The company's headquarters will move next year.", "Coffee sales have declined this year."], "a": "B", "type": "R6-sent", "vi": "Mỗi hương vị dùng nguyên liệu tự nhiên từ nông trại địa phương.", "ex": "Câu trước nói về 3 hương vị → câu tiếp mô tả hương vị (Each flavor).", "elim": "(A), (C), (D) chuyển sang chủ đề khác.", "tip": "Từ lặp/đại từ nối câu trước: 'three flavors' → 'Each flavor'."}, {"opts": ["develop", "developing", "developed", "development"], "a": "B", "type": "R6-word", "vi": "...mất gần hai năm phát triển công thức...", "ex": "spend + thời gian + V-ing.", "elim": "(A) nguyên mẫu sai cấu trúc.", "tip": "spend time/money + V-ing; have difficulty/trouble + V-ing."}, {"opts": ["However", "Otherwise", "Instead", "In addition"], "a": "D", "type": "R6-word", "vi": "Ngoài ra, khách đặt hàng online tuần đầu sẽ nhận bình tái sử dụng miễn phí.", "ex": "Thêm một thông tin có lợi → bổ sung.", "elim": "(A) tương phản; (B) điều kiện ngược; (C) thay thế.", "tip": "Câu sau là thêm ưu đãi/thông tin cùng chiều → In addition / Also / Moreover."}]}, {"part": 7, "passages": [{"kind": "Notice", "title": "Attention, Customers", "body": "Starting January 1, Greenway Supermarket will no longer provide free plastic bags at checkout. Reusable bags are available for purchase at $1.50 each. Customers who bring their own bags will receive 5 bonus points on their Greenway Rewards card for every visit."}], "vocab": [["no longer", "không còn"], ["checkout", "quầy thanh toán"], ["bonus points", "điểm thưởng"]], "qs": [{"q": "What is the notice mainly about?", "opts": ["New store hours", "A change in bag policy", "A price increase on groceries", "The launch of a rewards program"], "a": "B", "type": "R7-main", "vi": "Thông báo chủ yếu nói về? → Thay đổi chính sách túi đựng.", "ex": "Không còn phát túi nilon miễn phí.", "elim": "(D) thẻ thưởng đã có sẵn, không phải ra mắt.", "tip": "'no longer' báo hiệu thay đổi chính sách."}, {"q": "How can customers earn bonus points?", "opts": ["By buying reusable bags", "By shopping on January 1", "By signing up online", "By bringing their own bags"], "a": "D", "type": "R7-detail", "vi": "Làm sao để nhận điểm thưởng? → Mang túi của mình.", "ex": "'Customers who bring their own bags will receive 5 bonus points'.", "elim": "(A) mua túi không được nhắc là có điểm.", "tip": "Bẫy: đáp án dùng từ có trong bài (reusable bags) nhưng gắn sai điều kiện."}]}, {"part": 7, "passages": [{"kind": "E-mail", "meta": "From: Daniel Wu, Marketing Manager | To: Design Team | Subject: Spring catalog", "body": "Hi team,\n\nThank you for your hard work on the spring catalog. [1] The client was impressed with the layout and the photography. [2] However, they have asked us to address two issues before printing. First, the prices on pages 8 and 9 need to be updated to reflect the new discounts. Second, the client would like the cover photo replaced with one that features the new outdoor furniture collection. [3]\n\nPlease make these changes by Thursday so that we can send the final version to the printer on Friday. [4]\n\nThanks,\nDaniel"}], "vocab": [["address an issue", "giải quyết vấn đề"], ["reflect", "phản ánh"], ["feature", "giới thiệu nổi bật"]], "qs": [{"q": "What is the purpose of the e-mail?", "opts": ["To request changes to a catalog", "To praise a printing company", "To announce a new client", "To schedule a photo shoot"], "a": "A", "type": "R7-main", "vi": "Mục đích email? → Yêu cầu chỉnh sửa catalog.", "ex": "Nội dung chính sau 'However': hai yêu cầu sửa.", "elim": "(B) lời khen dành cho nhóm thiết kế, không phải nhà in.", "tip": "Email bắt đầu bằng lời khen thì mục đích thật thường nằm sau 'However'."}, {"q": "The word \"address\" in paragraph 1, line 3, is closest in meaning to", "opts": ["speak to", "deal with", "send to", "locate"], "a": "B", "type": "R7-syn", "vi": "'address two issues' = giải quyết hai vấn đề → deal with.", "ex": "Đi với 'issues' → nghĩa giải quyết.", "elim": "(A) nói chuyện với; (C) gửi đến; (D) xác định vị trí.", "tip": "address + issue/problem/concern = deal with/handle."}, {"q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"I have attached several photos for you to choose from.\"", "opts": ["[1]", "[2]", "[3]", "[4]"], "a": "C", "type": "R7-insert", "vi": "'Tôi đã đính kèm vài ảnh để các bạn chọn' → đặt ở [3].", "ex": "Nối tiếp yêu cầu thay ảnh bìa ngay trước [3].", "elim": "[4] sau hạn chót, không còn nói về ảnh.", "tip": "Câu chèn nhắc 'photos' → đặt sau câu nói về ảnh gần nhất."}]}, {"part": 7, "passages": [{"kind": "Advertisement", "title": "Lumina Home Store — Anniversary Sale, May 1–7", "body": "• 30% off all lighting fixtures\n• 20% off rugs and curtains\n• Buy one cushion, get one free\n\nMembers receive an additional 10% off sale prices.\nOffer valid in stores only; online orders are not eligible.\nFree delivery on purchases over $300."}, {"kind": "E-mail", "meta": "From: Pedro Alves | To: Lumina Home Store Customer Service | Date: May 9", "body": "To whom it may concern,\n\nOn May 5, I bought a floor lamp and two rugs at your Westfield branch. I am a member, but when I checked my receipt later, I noticed that I was not given the extra member discount. My total was $340, and the items were delivered to my home on May 6.\n\nCould you please refund the difference? I have attached a photo of the receipt."}], "vocab": [["lighting fixtures", "thiết bị chiếu sáng"], ["be eligible", "đủ điều kiện"], ["refund the difference", "hoàn lại phần chênh lệch"]], "qs": [{"q": "What is indicated about the sale?", "opts": ["It lasts two weeks.", "It includes online purchases.", "It is valid only in physical stores.", "It is open only to members."], "a": "C", "type": "R7-detail", "vi": "Thông tin đúng về đợt giảm giá? → Chỉ áp dụng tại cửa hàng.", "ex": "'valid in stores only'.", "elim": "(A) 1–7/5 là một tuần. (D) ai cũng được, hội viên thêm 10%.", "tip": "in stores → physical stores (paraphrase)."}, {"q": "What did Mr. Alves purchase?", "opts": ["Cushions and curtains", "A lamp and some rugs", "Outdoor furniture", "Lighting fixtures only"], "a": "B", "type": "R7-detail", "vi": "Ông Alves đã mua gì? → Một đèn và vài tấm thảm.", "ex": "'a floor lamp and two rugs'.", "elim": "(D) thiếu thảm.", "tip": "Đáp án 'only' thường sai nếu bài có nhiều món."}, {"q": "Which discount did Mr. Alves NOT receive?", "opts": ["The additional 10% member discount", "30% off lighting", "20% off rugs", "A free cushion"], "a": "A", "type": "R7-cross", "vi": "Ông Alves KHÔNG được giảm loại nào? → Giảm thêm 10% cho hội viên.", "ex": "'I was not given the extra member discount' ↔ quảng cáo: hội viên thêm 10%.", "elim": "(D) ông không mua gối nên không liên quan.", "tip": "extra ↔ additional."}, {"q": "What is suggested about Mr. Alves's purchase?", "opts": ["It was made online.", "It was made on May 1.", "It was returned.", "It qualified for free delivery."], "a": "D", "type": "R7-cross", "vi": "Có thể suy ra gì về đơn hàng? → Đủ điều kiện giao miễn phí.", "ex": "Tổng $340 > $300 (điều kiện ở quảng cáo).", "elim": "(A) mua tại chi nhánh. (B) mua ngày 5/5.", "tip": "Số tiền ở văn bản 2 × ngưỡng ở văn bản 1 → câu liên kết."}, {"q": "What does Mr. Alves ask for?", "opts": ["An exchange", "A partial refund", "A membership card", "A delivery date"], "a": "B", "type": "R7-detail", "vi": "Ông Alves yêu cầu gì? → Hoàn tiền một phần.", "ex": "'refund the difference' → hoàn phần chênh lệch = partial refund.", "elim": "Không đổi hàng.", "tip": "the difference → partial."}]}]}, {"id": 8, "title": "Đề 8", "theme": "Logistics, đi lại & cơ sở vật chất", "focus": true, "listening": [{"part": 1, "scene": "Một người đàn ông đứng ở bàn đóng gói, đang dán băng keo lên miệng một thùng các-tông.", "sp": "N", "vocab": [["tape (v)", "dán băng keo"], ["cardboard box", "thùng các-tông"], ["load a truck", "chất hàng lên xe tải"]], "qs": [{"opts": ["He's loading a truck.", "He's tearing up a box.", "He's taping a cardboard box.", "He's writing on a label."], "a": "C", "type": "L1-person", "vi": "(C) Anh ấy đang dán băng keo lên thùng các-tông.", "ex": "'taping' khớp hành động dán băng keo.", "elim": "(A) không có xe tải. (B) xé thùng ngược nghĩa. (D) không viết nhãn.", "tip": "Ảnh kho/đóng gói: tape, wrap, label, stack, load, unload, push a cart."}]}, {"part": 1, "scene": "Hành lang khách sạn không người; cửa các phòng đều đóng, một xe đẩy dọn phòng đỗ sát tường.", "sp": "N", "vocab": [["cart", "xe đẩy"], ["hallway", "hành lang"], ["housekeeper", "nhân viên buồng phòng"]], "qs": [{"opts": ["Housekeepers are cleaning a room.", "A cart has been left next to a wall.", "The doors are being opened.", "Guests are carrying luggage."], "a": "B", "type": "L1-scene", "vi": "(B) Một chiếc xe đẩy được để cạnh tường.", "ex": "Bị động hoàn thành 'has been left' mô tả trạng thái.", "elim": "(A), (D) có người. (C) cửa đang đóng và cần người mở.", "tip": "'has been left' là động từ trạng thái hay gặp cho đồ vật không người."}]}, {"part": 2, "q": "How soon can you deliver the replacement parts?", "sp": ["W", "M"], "vocab": [["replacement parts", "linh kiện thay thế"], ["at the latest", "muộn nhất"]], "qs": [{"opts": ["By Wednesday at the latest.", "Some spare parts.", "I'll replace it."], "a": "A", "type": "L2-wh", "vi": "Bao lâu nữa anh giao được linh kiện thay thế? → Muộn nhất là thứ Tư.", "ex": "How soon → thời hạn (A).", "elim": "(B) lặp 'parts'. (C) lặp gốc 'replace'.", "tip": "How soon = When."}]}, {"part": 2, "q": "Who should I contact about the broken air conditioner?", "sp": ["M", "W"], "vocab": [["building maintenance", "bộ phận bảo trì tòa nhà"], ["extension", "số máy lẻ"]], "qs": [{"opts": ["It's broken into pieces.", "Call building maintenance at extension 204.", "In the meeting room."], "a": "B", "type": "L2-wh", "vi": "Tôi nên liên hệ ai về máy lạnh hỏng? → Gọi bảo trì tòa nhà, số máy lẻ 204.", "ex": "Who → bộ phận (B).", "elim": "(A) lặp 'broken'. (C) trả lời Where.", "tip": "Đáp án Who có thể là phòng ban, không nhất thiết tên người."}]}, {"part": 2, "q": "Has the shipment from Busan arrived yet?", "sp": ["W", "M"], "vocab": [["shipment", "lô hàng"], ["unload", "dỡ hàng"]], "qs": [{"opts": ["From Busan to Tokyo.", "Yes, I shipped them yesterday.", "It's being unloaded now."], "a": "C", "type": "L2-yn", "vi": "Lô hàng từ Busan đến chưa? → Đang được dỡ xuống.", "ex": "Trả lời ngầm 'đã đến' (C).", "elim": "(A) lặp 'Busan'. (B) có Yes nhưng nói về việc gửi hàng (ship), không phải nhận.", "tip": "Đáp án có Yes nhưng sai nội dung là bẫy rất hay gặp."}]}, {"part": 2, "q": "Why is the elevator out of service?", "sp": ["M", "W"], "vocab": [["out of service", "ngừng hoạt động"], ["inspect", "kiểm tra"]], "qs": [{"opts": ["It's being inspected this morning.", "On every floor.", "The service was excellent."], "a": "A", "type": "L2-wh", "vi": "Sao thang máy ngừng hoạt động? → Nó đang được kiểm tra sáng nay.", "ex": "Why → lý do (A).", "elim": "(B) Where. (C) lặp 'service'.", "tip": "Lý do không cần 'because'."}]}, {"part": 2, "q": "Would you mind driving me to the airport tomorrow?", "sp": ["W", "M"], "vocab": [["Would you mind...?", "Bạn có phiền...?"]], "qs": [{"opts": ["The airport is huge.", "Not at all. What time is your flight?", "I drove there yesterday."], "a": "B", "type": "L2-req", "vi": "Mai bạn chở tôi ra sân bay được không? → Không phiền gì. Chuyến bay mấy giờ?", "ex": "'Not at all' = đồng ý giúp (B).", "elim": "(A) lặp 'airport'. (C) lặp gốc 'drive'.", "tip": "Would you mind? → Not at all / Of course not = ĐỒNG Ý."}]}, {"part": 2, "q": "We're running out of packing boxes.", "sp": ["M", "W"], "vocab": [["run out of", "hết, cạn"], ["packing boxes", "thùng đóng gói"]], "qs": [{"opts": ["He's running late.", "In the box office.", "I'll order more this afternoon."], "a": "C", "type": "L2-stmt", "vi": "Chúng ta sắp hết thùng đóng gói. → Chiều nay tôi sẽ đặt thêm.", "ex": "Báo thiếu → giải pháp (C).", "elim": "(A) lặp 'running'. (B) lặp 'box'.", "tip": "Câu trần thuật về sự cố/thiếu hụt → đáp án 'I'll...' rất thường đúng."}]}, {"part": 2, "q": "Do you know where the spare keys for the storage room are?", "sp": ["W", "M"], "vocab": [["spare key", "chìa khóa dự phòng"], ["security desk", "quầy bảo vệ"]], "qs": [{"opts": ["Ask the security desk.", "Yes, it's spacious.", "The keyboard is new."], "a": "A", "type": "L2-indirect", "vi": "Bạn có biết chìa dự phòng kho ở đâu không? → Hỏi quầy bảo vệ.", "ex": "Chỉ nơi hỏi = trả lời gián tiếp cho 'where' (A).", "elim": "(B) gần âm 'spare – spacious'. (C) gần âm 'key – keyboard'.", "tip": "'Ask X / Check with X' là đáp án đúng điển hình cho câu Where/Who gián tiếp."}]}, {"part": 2, "q": "Should we ship this by air or by sea?", "sp": ["M", "W"], "vocab": [["ship by air/sea", "gửi đường hàng không/biển"], ["urgent", "gấp"]], "qs": [{"opts": ["I'll see you there.", "By sea. It's not urgent.", "The air is fresh."], "a": "B", "type": "L2-choice", "vi": "Gửi đường hàng không hay đường biển? → Đường biển, vì không gấp.", "ex": "Chọn một + lý do (B).", "elim": "(A) gần âm 'sea – see'. (C) lặp 'air'.", "tip": "sea/see, air/heir... bẫy đồng âm."}]}, {"part": 3, "convo": [["W", "Hi Carlos, it's Emma from the Taichung warehouse. We just received the shipment of kitchen appliances, but twenty of the boxes are damaged."], ["M", "Oh no. Were the products inside damaged too?"], ["W", "We haven't opened all of them yet, but at least five microwaves have cracked doors."], ["M", "OK. Please take photos of everything and send them to me. I'll file a claim with the shipping company."], ["W", "Sure. Should I set the damaged items aside?"], ["M", "Yes, keep them in a separate area until the insurance inspector comes."]], "vocab": [["appliance", "thiết bị gia dụng"], ["file a claim", "nộp yêu cầu bồi thường"], ["set aside", "để riêng ra"]], "qs": [{"q": "Where does the woman work?", "opts": ["At an appliance store", "At a warehouse", "At a shipping company", "At an insurance office"], "a": "B", "type": "L34-who", "vi": "Người phụ nữ làm ở đâu? → Ở nhà kho.", "ex": "'it's Emma from the Taichung warehouse'.", "elim": "(C), (D) là bên liên quan được nhắc tới.", "tip": "'This is/It's X from Y' → Y là nơi làm việc."}, {"q": "What does the man ask the woman to do?", "opts": ["Repack the items", "Call the shipping company", "Take pictures of the damage", "Return the shipment"], "a": "C", "type": "L34-do", "vi": "Anh ấy yêu cầu cô làm gì? → Chụp ảnh hàng hỏng.", "ex": "'Please take photos of everything'.", "elim": "(B) anh tự liên hệ hãng vận chuyển.", "tip": "photos → pictures."}, {"q": "What will the man do?", "opts": ["Visit the warehouse", "Order replacements", "Inspect the items", "Submit a claim"], "a": "D", "type": "L34-next", "vi": "Người đàn ông sẽ làm gì? → Nộp yêu cầu bồi thường.", "ex": "'I'll file a claim with the shipping company'.", "elim": "(C) kiểm định do nhân viên bảo hiểm làm.", "tip": "file → submit."}]}, {"part": 3, "convo": [["M", "IT support, this is Kevin."], ["W", "Hi Kevin. I'm trying to join the video conference with our Seoul office, but my microphone isn't working."], ["M", "Have you checked whether it's selected in the meeting app's audio settings?"], ["W", "Let me look. Oh, it was set to my old headset. It's working now."], ["M", "Great. By the way, we're updating everyone's software on Saturday, so please restart your computer before you leave on Friday."], ["W", "Will do. Thanks."]], "vocab": [["audio settings", "cài đặt âm thanh"], ["headset", "tai nghe có micro"], ["restart", "khởi động lại"]], "qs": [{"q": "What problem does the woman have?", "opts": ["Her microphone is not working.", "She cannot find a meeting link.", "Her computer is too slow.", "She forgot her password."], "a": "A", "type": "L34-main", "vi": "Cô ấy gặp vấn đề gì? → Micro không hoạt động.", "ex": "'my microphone isn't working'.", "elim": "Các vấn đề khác không được nhắc.", "tip": "Vấn đề nằm sau 'but' trong câu nói đầu của người gọi."}, {"q": "How was the problem solved?", "opts": ["By replacing a headset", "By restarting a computer", "By adjusting a setting", "By reinstalling an app"], "a": "C", "type": "L34-detail", "vi": "Vấn đề được giải quyết thế nào? → Chỉnh lại cài đặt.", "ex": "Thiết bị âm thanh được chọn sai trong cài đặt → chọn lại.", "elim": "(B) khởi động lại là việc cho thứ Sáu, không phải cách sửa micro.", "tip": "Bẫy: hai hành động trong bài (chỉnh cài đặt, khởi động lại) gắn với hai mục đích khác nhau."}, {"q": "What does the man ask the woman to do on Friday?", "opts": ["Attend a training", "Restart her computer", "Update her software herself", "Call the Seoul office"], "a": "B", "type": "L34-do", "vi": "Anh ấy nhờ cô làm gì vào thứ Sáu? → Khởi động lại máy tính.", "ex": "'please restart your computer before you leave on Friday'.", "elim": "(C) IT sẽ cập nhật vào thứ Bảy.", "tip": "Mốc thời gian trong câu hỏi là chìa khóa để chọn đúng câu nói."}]}, {"part": 3, "convo": [["M", "I need to send these product samples to our client in Melbourne."], ["W", "When do they need them?"], ["M", "Their board meeting is in five days, so the samples have to arrive before then."], ["W", "Then you'll need something faster than standard. But overnight is very expensive."], ["M", "Right. Let's go with the next option down. Could you also add insurance? The samples are fragile."], ["W", "Sure. That's an extra eight dollars."]], "graphic": {"title": "Shipping Services", "head": ["Service", "Delivery time", "Price"], "rows": [["Economy", "7–10 days", "$25"], ["Standard", "4–6 days", "$40"], ["Express", "2–3 days", "$65"], ["Overnight", "1 day", "$110"]]}, "vocab": [["fragile", "dễ vỡ"], ["board meeting", "họp hội đồng quản trị"], ["the next option down", "lựa chọn ngay dưới"]], "qs": [{"q": "What does the man want to send?", "opts": ["Contracts", "Invoices", "A laptop", "Product samples"], "a": "D", "type": "L34-detail", "vi": "Anh ấy muốn gửi gì? → Hàng mẫu.", "ex": "'send these product samples'.", "elim": "Không có giấy tờ hay laptop.", "tip": "Câu đầu = đối tượng của hội thoại."}, {"q": "Look at the graphic. Which service will the man most likely choose?", "opts": ["Economy", "Standard", "Express", "Overnight"], "a": "C", "type": "L34-graphic", "vi": "Anh ấy sẽ chọn dịch vụ nào? → Express.", "ex": "Nhanh hơn Standard nhưng không chọn Overnight → 'next option down' = Express.", "elim": "(B) Standard 4–6 ngày có thể trễ. (D) quá đắt.", "tip": "Biểu đồ có thứ tự: 'next option down/up' buộc bạn dò theo hàng."}, {"q": "Why does the man ask for insurance?", "opts": ["The items are easily broken.", "The client requested it.", "It is free of charge.", "The package is heavy."], "a": "A", "type": "L34-detail", "vi": "Vì sao anh ấy mua bảo hiểm? → Hàng dễ vỡ.", "ex": "'The samples are fragile'.", "elim": "(C) bảo hiểm tốn thêm $8.", "tip": "fragile = easily broken."}]}, {"part": 4, "convo": [["N", "Attention, passengers traveling on the three fifteen express train to Hualien. Due to a signal problem near Yilan, this train will depart approximately forty minutes late. We apologize for the inconvenience. Passengers who wish to change to a later train may do so at no extra charge at any ticket counter. Complimentary bottled water is available at the information desk on the main concourse. We will make another announcement when the boarding platform has been confirmed."]], "vocab": [["signal problem", "sự cố tín hiệu"], ["complimentary", "miễn phí"], ["concourse", "sảnh chính nhà ga"]], "qs": [{"q": "Where is the announcement being made?", "opts": ["At an airport", "At a bus terminal", "At a train station", "At a ferry port"], "a": "C", "type": "L34-who", "vi": "Thông báo diễn ra ở đâu? → Nhà ga tàu hỏa.", "ex": "'express train', 'boarding platform'.", "elim": "Các phương tiện khác không được nhắc.", "tip": "Gom từ khóa: train, platform, ticket counter."}, {"q": "What has caused the delay?", "opts": ["Bad weather", "A technical problem", "A crew shortage", "Track repairs"], "a": "B", "type": "L34-detail", "vi": "Nguyên nhân trễ? → Sự cố kỹ thuật.", "ex": "'Due to a signal problem' → technical problem.", "elim": "(D) sửa đường ray không được nhắc.", "tip": "Đáp án là từ khái quát của chi tiết trong bài."}, {"q": "What is available at the information desk?", "opts": ["Maps", "Refunds", "Snacks", "Free drinks"], "a": "D", "type": "L34-detail", "vi": "Quầy thông tin có gì? → Đồ uống miễn phí.", "ex": "'Complimentary bottled water' → free drinks.", "elim": "(B) đổi vé ở quầy bán vé, không phải hoàn tiền.", "tip": "complimentary = free."}]}, {"part": 4, "convo": [["N", "Good morning, staff. This is an update from facilities management. As you know, the top level of our parking garage is closed for repairs until the end of the month. Starting Monday, staff who normally park there should use the level reserved for visitors instead, since visitor numbers are low this month. Please display your staff permit on your dashboard at all times. Also, we've received complaints about cars blocking the charging stations. If your vehicle isn't charging, please move it."]], "graphic": {"title": "Parking Garage", "head": ["Level", "Use"], "rows": [["Level 1", "Visitors"], ["Level 2", "Electric vehicles"], ["Level 3", "Staff"], ["Level 4", "Staff (closed for repairs)"]]}, "vocab": [["facilities management", "bộ phận quản lý cơ sở vật chất"], ["permit", "giấy phép"], ["dashboard", "bảng táp-lô xe"]], "qs": [{"q": "Look at the graphic. Which level should affected staff use starting Monday?", "opts": ["Level 1", "Level 2", "Level 3", "Level 4"], "a": "A", "type": "L34-graphic", "vi": "Từ thứ Hai, nhân viên bị ảnh hưởng nên dùng tầng nào? → Tầng 1.", "ex": "'use the level reserved for visitors' → Level 1.", "elim": "(D) đang đóng cửa.", "tip": "Người nói dùng chức năng (visitors) → đáp án là số tầng."}, {"q": "What are listeners asked to display?", "opts": ["An ID badge", "A driver's license", "A staff permit", "A parking receipt"], "a": "C", "type": "L34-do", "vi": "Người nghe được yêu cầu đặt gì trên xe? → Giấy phép đỗ xe của nhân viên.", "ex": "'display your staff permit on your dashboard'.", "elim": "Các giấy tờ khác không được nhắc.", "tip": "Câu Please trong bài nói là đáp án cho 'asked to do'."}, {"q": "What problem does the speaker mention?", "opts": ["Long lines at the entrance", "A broken gate", "High parking fees", "Cars occupying charging spots"], "a": "D", "type": "L34-detail", "vi": "Người nói nhắc vấn đề gì? → Xe chiếm chỗ sạc.", "ex": "'cars blocking the charging stations'.", "elim": "Không có vấn đề khác.", "tip": "complaints about... → problem."}]}], "reading": [{"part": 5, "qs": [{"q": "The shipping company guarantees ______ delivery of all packages within the city.", "opts": ["rely", "reliable", "reliably", "reliability"], "a": "B", "type": "R5-pos", "vi": "Công ty vận chuyển đảm bảo giao hàng đáng tin cậy trong thành phố.", "ex": "Trước danh từ 'delivery' → tính từ.", "elim": "(D) danh từ không ghép 'reliability delivery'.", "tip": "Động từ + ___ + danh từ → tính từ."}, {"q": "Due to heavy snow, all flights to Sapporo have been ______ until further notice.", "opts": ["suspended", "prevented", "refused", "removed"], "a": "A", "type": "R5-vocab", "vi": "Do tuyết dày, mọi chuyến bay đến Sapporo tạm ngừng cho đến khi có thông báo mới.", "ex": "suspend flights = tạm ngừng chuyến bay; 'until further notice' xác nhận nghĩa tạm thời.", "elim": "prevent cần 'from'; refuse/remove sai nghĩa.", "tip": "until further notice ↔ suspended / postponed / closed."}, {"q": "Ms. Huang ______ the customs documents before the shipment arrived.", "opts": ["prepares", "has prepared", "had prepared", "will prepare"], "a": "C", "type": "R5-verb", "vi": "Cô Huang đã chuẩn bị giấy tờ hải quan trước khi lô hàng đến.", "ex": "Hành động xảy ra trước một hành động quá khứ khác → quá khứ hoàn thành.", "elim": "(B) HTHT không dùng với mốc quá khứ 'arrived'.", "tip": "before/after + QKĐ → mệnh đề kia hay dùng had V3."}, {"q": "The warehouse operates ______ from 6 A.M. to 10 P.M., seven days a week.", "opts": ["day", "daily", "days", "dailiness"], "a": "B", "type": "R5-pos", "vi": "Kho hoạt động hằng ngày từ 6 giờ sáng đến 10 giờ tối, 7 ngày/tuần.", "ex": "Bổ nghĩa cho động từ 'operates' → trạng từ 'daily'.", "elim": "(A), (C) danh từ.", "tip": "Một số từ vừa là tính từ vừa là trạng từ: daily, weekly, early, late, fast, hard."}, {"q": "Passengers must present a valid boarding pass ______ entering the security area.", "opts": ["when", "during", "since", "unless"], "a": "A", "type": "R5-conj", "vi": "Hành khách phải xuất trình thẻ lên máy bay khi vào khu an ninh.", "ex": "when + V-ing (rút gọn mệnh đề thời gian).", "elim": "during + danh từ; since + V-ing sai nghĩa; unless sai logic.", "tip": "Rút gọn: when/while/before/after + V-ing."}, {"q": "All packages ______ more than 30 kg require a special handling fee.", "opts": ["weigh", "weighing", "weighed", "to weigh"], "a": "B", "type": "R5-verb", "vi": "Mọi kiện hàng nặng hơn 30 kg phải trả phí xử lý đặc biệt.", "ex": "Rút gọn mệnh đề quan hệ chủ động (that weigh) → weighing.", "elim": "(A) tạo 2 động từ chính. (C) bị động sai nghĩa.", "tip": "Danh từ + V-ing (chủ động) / V3 (bị động) = mệnh đề quan hệ rút gọn."}, {"q": "The technician will inspect the cooling system ______ to ensure it is working properly.", "opts": ["thorough", "thoroughness", "more thorough", "thoroughly"], "a": "D", "type": "R5-pos", "vi": "Kỹ thuật viên sẽ kiểm tra kỹ hệ thống làm mát để đảm bảo nó hoạt động tốt.", "ex": "Câu đã đủ S-V-O → bổ nghĩa động từ bằng trạng từ.", "elim": "(A), (C) tính từ; (B) danh từ.", "tip": "S + V + O + ___ → trạng từ."}, {"q": "The new tracking system allows customers to see exactly ______ their parcels are.", "opts": ["what", "which", "where", "whose"], "a": "C", "type": "R5-rel", "vi": "Hệ thống theo dõi mới cho khách thấy chính xác bưu kiện của họ đang ở đâu.", "ex": "Mệnh đề danh ngữ chỉ vị trí 'where their parcels are'.", "elim": "what cần thiếu thành phần trong mệnh đề; mệnh đề này đủ S-V, thiếu trạng ngữ nơi chốn.", "tip": "Mệnh đề sau chỗ trống đầy đủ S+V, thiếu nơi chốn → where; thiếu thời gian → when."}, {"q": "______ the ferry was delayed, the tour group arrived at the hotel on time.", "opts": ["Despite", "Although", "Because", "However"], "a": "B", "type": "R5-conj", "vi": "Mặc dù phà bị trễ, đoàn du lịch vẫn đến khách sạn đúng giờ.", "ex": "Mệnh đề + nghĩa nhượng bộ → Although.", "elim": "(A) giới từ. (C) sai nghĩa. (D) không nối 2 mệnh đề.", "tip": "Kiểm tra cấu trúc (mệnh đề/danh từ) trước, nghĩa sau."}, {"q": "Employees should keep fire exits clear ______ all times.", "opts": ["in", "on", "at", "for"], "a": "C", "type": "R5-prep", "vi": "Nhân viên phải luôn giữ lối thoát hiểm thông thoáng.", "ex": "Cụm cố định 'at all times'.", "elim": "Các giới từ khác không tạo cụm.", "tip": "at all times, at the moment, at your convenience, at no cost."}, {"q": "Mr. Silva will travel to Manila next week to meet with ______ suppliers.", "opts": ["potential", "potentially", "potency", "potentialize"], "a": "A", "type": "R5-pos", "vi": "Ông Silva sẽ đến Manila tuần tới để gặp các nhà cung cấp tiềm năng.", "ex": "Trước danh từ 'suppliers' → tính từ.", "elim": "(B) trạng từ; (C) danh từ; (D) không phải từ thông dụng.", "tip": "Cụm hay gặp: potential clients/customers/suppliers."}]}, {"part": 6, "passages": [{"kind": "Notice", "meta": "To: All tenants, Harborview Office Tower | From: Building Management", "body": "Please be advised that the main water supply will be shut off on Saturday, April 12, from 8 A.M. to 4 P.M. while we replace aging pipes on the ground floor. During this time, restrooms on all floors will be {{0}}. {{1}}\n\nWe recommend that tenants who plan to work on Saturday make other arrangements. We apologize for any inconvenience and appreciate your {{2}}. {{3}} questions about this work should be directed to the management office at extension 100."}], "vocab": [["tenant", "người thuê"], ["shut off", "ngắt, cắt"], ["aging pipes", "đường ống cũ"], ["make arrangements", "sắp xếp"]], "qs": [{"opts": ["unavailable", "unavailability", "unavailably", "availability"], "a": "A", "type": "R6-word", "vi": "...nhà vệ sinh các tầng sẽ không sử dụng được.", "ex": "Sau 'will be' cần tính từ.", "elim": "(B), (D) danh từ; (C) trạng từ.", "tip": "be + ___ (cuối câu) → tính từ."}, {"opts": ["The tower was built in 1985.", "Rent payments are due on the first of each month.", "Portable restrooms will be placed in the parking area for use during this period.", "The gym on the third floor has new equipment."], "a": "C", "type": "R6-sent", "vi": "Nhà vệ sinh di động sẽ được đặt ở bãi đỗ xe để dùng trong thời gian này.", "ex": "Câu trước: nhà vệ sinh không dùng được → giải pháp thay thế.", "elim": "Các câu còn lại lạc đề.", "tip": "Sau câu báo bất tiện thường là câu đưa giải pháp tạm thời."}, {"opts": ["understand", "understanding", "understood", "understandable"], "a": "B", "type": "R6-word", "vi": "...và cảm ơn sự thông cảm của quý vị.", "ex": "Sau tính từ sở hữu 'your' cần danh từ → understanding.", "elim": "(A) động từ, (C) quá khứ, (D) tính từ.", "tip": "appreciate your understanding/patience/cooperation: cụm kết thông báo."}, {"opts": ["Any", "Every", "Each", "Much"], "a": "A", "type": "R6-word", "vi": "Mọi câu hỏi về công việc này xin gửi về văn phòng quản lý.", "ex": "Danh từ số nhiều 'questions' → Any.", "elim": "Every/Each + danh từ số ít; Much + không đếm được.", "tip": "Lượng từ: each/every + số ít; all/any/many + số nhiều."}]}, {"part": 7, "passages": [{"kind": "Text-message chain", "body": "Aiko Mori [11:05 A.M.]: The delivery truck for the Tainan store just broke down on the highway.\nRyan Chen [11:06 A.M.]: Is the driver OK?\nAiko Mori [11:07 A.M.]: Yes, he's fine. A tow truck is on the way, but the store is expecting the shipment by 2 P.M.\nRyan Chen [11:08 A.M.]: Leave it to me. I'll send a van from the Chiayi branch to pick up the goods."}], "vocab": [["break down", "bị hỏng (xe)"], ["tow truck", "xe cứu hộ"], ["pick up the goods", "lấy hàng"]], "qs": [{"q": "What problem is being discussed?", "opts": ["An employee is late.", "A vehicle has broken down.", "A store is closed.", "An order was incorrect."], "a": "B", "type": "R7-main", "vi": "Vấn đề đang được bàn? → Một xe bị hỏng.", "ex": "'The delivery truck... just broke down'.", "elim": "Không có thông tin khác.", "tip": "Tin nhắn đầu = vấn đề."}, {"q": "At 11:08 A.M., what does Mr. Chen mean when he writes, \"Leave it to me\"?", "opts": ["He wants to be left alone.", "He is leaving the office.", "He disagrees with Ms. Mori.", "He will take care of the situation."], "a": "D", "type": "R7-intent", "vi": "'Cứ để tôi lo' → Anh ấy sẽ xử lý tình huống.", "ex": "Ngay sau đó anh nêu giải pháp gửi xe từ chi nhánh Chiayi.", "elim": "(A), (B) hiểu theo nghĩa đen của 'leave'.", "tip": "Câu ý định quen thuộc: Leave it to me / I'm on it / Count me in / Will do."}]}, {"part": 7, "passages": [{"kind": "Web page", "title": "Riverside Storage Solutions", "body": "Need extra space? Our climate-controlled units keep your belongings safe from heat and humidity. Units range from 2 to 20 square meters and can be rented by the month.\n\nAll units are monitored by security cameras 24 hours a day, and customers can access their units from 6 A.M. to 11 P.M. using a personal access code. Sign up for a 12-month contract and get your first month free. Moving trucks are available to rent at a discounted rate for storage customers."}], "vocab": [["climate-controlled", "có kiểm soát nhiệt độ, độ ẩm"], ["belongings", "đồ đạc"], ["access code", "mã truy cập"]], "qs": [{"q": "What is NOT mentioned about the storage units?", "opts": ["They are climate-controlled.", "They are monitored by cameras.", "They come in different sizes.", "They are insured."], "a": "D", "type": "R7-not", "vi": "Điều gì KHÔNG được nhắc về kho? → Có bảo hiểm.", "ex": "Bài có kiểm soát khí hậu, camera, kích thước 2–20 m²; không có bảo hiểm.", "elim": "(A)–(C) đều có.", "tip": "'range from... to...' = come in different sizes."}, {"q": "When can customers access their units?", "opts": ["At any time", "During business hours only", "From early morning until late evening", "On weekdays only"], "a": "C", "type": "R7-detail", "vi": "Khách được vào kho khi nào? → Từ sáng sớm đến tối muộn.", "ex": "'from 6 A.M. to 11 P.M.'", "elim": "(A) bẫy: 24 giờ là thời gian camera giám sát.", "tip": "Hai mốc thời gian trong một câu → kiểm tra mốc nào gắn với hành động nào."}, {"q": "What is offered to customers who sign a 12-month contract?", "opts": ["A free month", "A free moving truck", "A larger unit", "A free lock"], "a": "A", "type": "R7-detail", "vi": "Ký hợp đồng 12 tháng được gì? → Miễn phí một tháng.", "ex": "'get your first month free'.", "elim": "(B) xe tải chỉ được giảm giá, không miễn phí.", "tip": "discounted ≠ free."}]}, {"part": 7, "passages": [{"kind": "Itinerary", "title": "Travel Itinerary — Jonas Berg", "body": "Outbound: Flight SQ 877, October 14 — depart Taipei 08:10, arrive Singapore 12:50\nHotel: Marina Bay Business Hotel, October 14–17 (3 nights)\nReturn: Flight SQ 878, October 17 — depart Singapore 19:30\n\nNote: The hotel's airport shuttle runs every 30 minutes and is free for guests with a confirmation number."}, {"kind": "E-mail", "meta": "From: Jonas Berg | To: Lily Tan, Skyway Travel | Date: October 2", "body": "Hi Lily,\n\nThanks for arranging my trip. Unfortunately, my meeting with Delta Components has been moved from October 16 to October 18. Could you extend my hotel stay and change my return flight to the evening of the 18th?\n\nAlso, my colleague Sofia Ruiz will join me for the last two days. Could you book a room for her at the same hotel?"}, {"kind": "E-mail", "meta": "From: Lily Tan | To: Jonas Berg | Date: October 3", "body": "Hi Jonas,\n\nI've changed your return flight to SQ 878 on October 18 and extended your hotel stay by one night. Unfortunately, the Marina Bay Business Hotel is fully booked on October 17, so I've reserved a room for Ms. Ruiz at the Harbor Inn, a five-minute walk away. Her confirmation number is HI-5521. Please note that the Marina Bay shuttle service will not be available to her."}], "vocab": [["itinerary", "lịch trình"], ["extend a stay", "kéo dài thời gian lưu trú"], ["fully booked", "kín phòng"]], "qs": [{"q": "What is the purpose of Mr. Berg's e-mail?", "opts": ["To cancel a trip", "To request changes to travel plans", "To complain about a hotel", "To book a meeting room"], "a": "B", "type": "R7-main", "vi": "Mục đích email của ông Berg? → Yêu cầu thay đổi kế hoạch đi lại.", "ex": "Xin kéo dài khách sạn, đổi chuyến về, đặt thêm phòng.", "elim": "(A) không hủy.", "tip": "Nhiều câu 'Could you...' → mục đích là yêu cầu thay đổi."}, {"q": "What is suggested about the meeting with Delta Components?", "opts": ["It has been postponed.", "It will be held online.", "It was canceled.", "It will take place in Taipei."], "a": "A", "type": "R7-infer", "vi": "Có thể suy ra gì về cuộc họp? → Đã bị lùi lịch.", "ex": "Dời từ 16 sang 18/10 → postponed.", "elim": "(C) không bị hủy.", "tip": "moved to a later date = postponed / pushed back."}, {"q": "How many nights will Mr. Berg now stay at the Marina Bay Business Hotel?", "opts": ["Two", "Three", "Four", "Five"], "a": "C", "type": "R7-cross", "vi": "Giờ ông Berg ở khách sạn mấy đêm? → Bốn đêm.", "ex": "Lịch trình: 3 đêm + email 3: thêm 1 đêm = 4.", "elim": "(B) là số đêm ban đầu.", "tip": "Câu tính toán liên văn bản: con số gốc (văn bản 1) + thay đổi (văn bản 3)."}, {"q": "Why will Ms. Ruiz stay at a different hotel?", "opts": ["She requested it.", "It is cheaper.", "The original hotel is fully booked.", "It is closer to the meeting."], "a": "C", "type": "R7-detail", "vi": "Vì sao cô Ruiz ở khách sạn khác? → Khách sạn ban đầu kín phòng.", "ex": "'fully booked on October 17'.", "elim": "(A) ông Berg muốn cùng khách sạn.", "tip": "Unfortunately + lý do."}, {"q": "What is implied about Ms. Ruiz?", "opts": ["She will arrive on October 14.", "She will take a different airline.", "She works for Delta Components.", "She cannot use the free airport shuttle."], "a": "D", "type": "R7-cross", "vi": "Có thể suy ra gì về cô Ruiz? → Cô không dùng được xe đưa đón sân bay miễn phí.", "ex": "Văn bản 1: shuttle miễn phí cho khách Marina Bay; văn bản 3: dịch vụ không áp dụng cho cô.", "elim": "(A) cô đi 2 ngày cuối.", "tip": "Câu implied cuối cụm thường cần ghép ghi chú nhỏ (Note) ở văn bản 1."}]}]}, {"id": 9, "title": "Đề 9", "theme": "Tài chính, bất động sản & sức khỏe", "focus": true, "listening": [{"part": 1, "scene": "Một người phụ nữ đứng trên thang, đang dùng con lăn sơn tường màu trắng.", "sp": "N", "vocab": [["ladder", "cái thang"], ["paint a wall", "sơn tường"], ["hang a picture", "treo tranh"]], "qs": [{"opts": ["She's climbing down the stairs.", "She's hanging a picture.", "She's opening a can of paint.", "She's painting a wall while standing on a ladder."], "a": "D", "type": "L1-person", "vi": "(D) Cô ấy đang sơn tường khi đứng trên thang.", "ex": "Đúng cả hành động (painting) lẫn vị trí (on a ladder).", "elim": "(A) stairs ≠ ladder. (B) không treo tranh. (C) không mở thùng sơn.", "tip": "Bẫy từ gần nghĩa: stairs/ladder, step/stool. Nghe đúng danh từ cũng quan trọng như động từ."}]}, {"part": 1, "scene": "Quầy giao dịch ngân hàng: vài người xếp hàng chờ trước quầy, một nhân viên ngồi sau vách kính.", "sp": "N", "vocab": [["wait in line", "xếp hàng chờ"], ["counter", "quầy"], ["teller", "giao dịch viên"]], "qs": [{"opts": ["Some people are waiting in line at a counter.", "A teller is counting coins outside.", "Customers are sitting on a bench.", "The glass is being cleaned."], "a": "A", "type": "L1-scene", "vi": "(A) Vài người đang xếp hàng chờ ở quầy.", "ex": "Mô tả đúng nhóm người và vị trí.", "elim": "(B) nhân viên ngồi trong quầy. (C) mọi người đứng. (D) không ai lau kính.", "tip": "Ảnh nhiều người: chọn câu mô tả hành động CHUNG của nhóm, không phải chi tiết nhỏ."}]}, {"part": 2, "q": "Where can I get my parking ticket validated?", "sp": ["W", "M"], "vocab": [["validate a ticket", "xác nhận vé (để miễn/giảm phí)"]], "qs": [{"opts": ["At the reception desk.", "It's valid for two hours.", "I bought a ticket."], "a": "A", "type": "L2-wh", "vi": "Tôi xác nhận vé đỗ xe ở đâu? → Ở quầy lễ tân.", "ex": "Where → địa điểm (A).", "elim": "(B) gần âm 'validated – valid'. (C) lặp 'ticket'.", "tip": "Bẫy cùng gốc từ: validate/valid, expense/expensive."}]}, {"part": 2, "q": "How long will the bank be closed for renovations?", "sp": ["M", "W"], "vocab": [["renovation", "sự cải tạo"]], "qs": [{"opts": ["On Main Street.", "Until the end of next week.", "The account was closed."], "a": "B", "type": "L2-wh", "vi": "Ngân hàng đóng cửa sửa chữa bao lâu? → Đến cuối tuần sau.", "ex": "How long → khoảng/thời hạn (B).", "elim": "(A) Where. (C) lặp 'closed'.", "tip": "How long ↔ until..., for..., about two weeks."}]}, {"part": 2, "q": "Who approved this expense?", "sp": ["W", "M"], "vocab": [["expense", "khoản chi"]], "qs": [{"opts": ["It was really expensive.", "Next Monday.", "I think it was Mr. Ford."], "a": "C", "type": "L2-wh", "vi": "Ai đã duyệt khoản chi này? → Tôi nghĩ là ông Ford.", "ex": "Who → người (C).", "elim": "(A) gần âm 'expense – expensive'. (B) When.", "tip": "'I think it was...' là đáp án Who rất phổ biến."}]}, {"part": 2, "q": "Are you renewing your apartment lease or moving out?", "sp": ["M", "W"], "vocab": [["renew a lease", "gia hạn hợp đồng thuê"], ["move out", "chuyển đi"]], "qs": [{"opts": ["I'm still deciding.", "It's a large apartment.", "Yes, I moved it."], "a": "A", "type": "L2-choice", "vi": "Bạn gia hạn hợp đồng thuê hay chuyển đi? → Tôi vẫn đang cân nhắc.", "ex": "Chưa chọn cũng là câu trả lời hợp lý (A).", "elim": "(B) lặp 'apartment'. (C) Yes cho câu lựa chọn.", "tip": "'I haven't decided yet / I'm still deciding' đúng cho cả câu lựa chọn lẫn câu WH."}]}, {"part": 2, "q": "The quarterly tax payment is due on Friday.", "sp": ["W", "M"], "vocab": [["quarterly", "hằng quý"], ["be due", "đến hạn"]], "qs": [{"opts": ["On the top floor.", "I've already sent it.", "Taxi drivers."], "a": "B", "type": "L2-stmt", "vi": "Khoản thuế quý đến hạn vào thứ Sáu. → Tôi đã gửi rồi.", "ex": "Phản hồi thông báo hạn chót (B).", "elim": "(A) Where. (C) gần âm 'tax – taxi'.", "tip": "Câu báo hạn chót → đáp án 'already done / I'll do it today'."}]}, {"part": 2, "q": "Why don't we hire an accountant to handle the paperwork?", "sp": ["M", "W"], "vocab": [["accountant", "kế toán"], ["paperwork", "giấy tờ"]], "qs": [{"opts": ["Because I counted them.", "In the paper tray.", "That would save us a lot of time."], "a": "C", "type": "L2-req", "vi": "Sao không thuê kế toán lo giấy tờ? → Như vậy sẽ tiết kiệm nhiều thời gian.", "ex": "Đồng ý gợi ý kèm lợi ích (C).", "elim": "(A) Because + gần âm 'accountant – counted'. (B) lặp 'paper'.", "tip": "Why don't we → loại Because ngay."}]}, {"part": 2, "q": "Isn't the clinic open late on Wednesdays?", "sp": ["W", "M"], "vocab": [["open late", "mở cửa muộn"]], "qs": [{"opts": ["Only until seven.", "It's a late payment.", "I opened it."], "a": "A", "type": "L2-tag", "vi": "Phòng khám mở muộn vào thứ Tư phải không? → Chỉ đến 7 giờ.", "ex": "Xác nhận kèm giới hạn giờ (A).", "elim": "(B) lặp 'late'. (C) lặp gốc 'open'.", "tip": "Đáp án ngắn có 'Only...' thường là trả lời gián tiếp hợp lệ."}]}, {"part": 2, "q": "Could you send me a copy of the invoice?", "sp": ["M", "W"], "vocab": [["invoice", "hóa đơn"]], "qs": [{"opts": ["Two coffees, please.", "Sure, I'll e-mail it right away.", "The voice was clear."], "a": "B", "type": "L2-req", "vi": "Bạn gửi tôi bản sao hóa đơn được không? → Được, tôi sẽ email ngay.", "ex": "Đồng ý yêu cầu (B).", "elim": "(A) gần âm 'copy – coffee'. (C) gần âm 'invoice – voice'.", "tip": "copy/coffee là cặp gần âm kinh điển của TOEIC."}]}, {"part": 3, "convo": [["M", "Hi, I'm calling about the office space for rent on Maple Avenue. Is it still available?"], ["W", "Yes, it is. It's one hundred twenty square meters on the third floor, and the rent is two thousand five hundred dollars a month."], ["M", "That's a bit more than we planned. Does that include utilities?"], ["W", "Water is included, but electricity is separate. The landlord is offering the first month at half price for leases of two years or more."], ["M", "That might work. Could I see the space this Saturday?"], ["W", "Certainly. I'll meet you there at ten."]], "vocab": [["utilities", "các tiện ích (điện, nước)"], ["landlord", "chủ nhà"], ["lease", "hợp đồng thuê"]], "qs": [{"q": "What is the man calling about?", "opts": ["Buying a house", "Renting office space", "Selling a property", "Finding a parking space"], "a": "B", "type": "L34-main", "vi": "Người đàn ông gọi về việc gì? → Thuê văn phòng.", "ex": "'calling about the office space for rent'.", "elim": "Các phương án khác không có.", "tip": "'I'm calling about...' = chủ đề."}, {"q": "According to the woman, what is included in the rent?", "opts": ["Electricity", "Internet", "Parking", "Water"], "a": "D", "type": "L34-detail", "vi": "Tiền thuê đã bao gồm gì? → Nước.", "ex": "'Water is included, but electricity is separate'.", "elim": "(A) điện tính riêng.", "tip": "Hai thông tin đối lập trong một câu ('but') → nghe kỹ cái nào đi với 'included'."}, {"q": "What does the man want to do on Saturday?", "opts": ["View the property", "Sign a lease", "Meet the landlord", "Pay a deposit"], "a": "A", "type": "L34-detail", "vi": "Thứ Bảy anh ấy muốn làm gì? → Xem văn phòng.", "ex": "'Could I see the space this Saturday?'", "elim": "(B) chưa ký hợp đồng.", "tip": "see the space → view the property."}]}, {"part": 3, "convo": [["W", "Thanks for coming in, Mr. Okafor. I've reviewed your application for a small business loan."], ["M", "Great. Do you need any more documents?"], ["W", "Just your tax returns for the past two years. Everything else looks fine."], ["M", "I filed them online. I can download copies tonight."], ["W", "Perfect. Once we receive them, approval usually takes about a week."], ["M", "A week? The equipment supplier's offer expires on the fifteenth."], ["W", "I'll mark your application as a priority, then."]], "vocab": [["small business loan", "khoản vay cho doanh nghiệp nhỏ"], ["tax return", "tờ khai thuế"], ["expire", "hết hạn"]], "qs": [{"q": "Who most likely is the woman?", "opts": ["An accountant", "An equipment supplier", "A bank employee", "A tax official"], "a": "C", "type": "L34-who", "vi": "Người phụ nữ có lẽ là ai? → Nhân viên ngân hàng.", "ex": "Xét duyệt hồ sơ vay vốn → ngân hàng.", "elim": "(D) tờ khai thuế chỉ là giấy tờ cần nộp.", "tip": "Suy nghề từ công việc người đó đang làm (review loan application)."}, {"q": "What does the woman ask for?", "opts": ["Tax documents", "A business plan", "A bank statement", "An equipment quote"], "a": "A", "type": "L34-do", "vi": "Người phụ nữ yêu cầu gì? → Giấy tờ thuế.", "ex": "'Just your tax returns for the past two years'.", "elim": "Không yêu cầu kế hoạch kinh doanh hay sao kê.", "tip": "tax returns → tax documents."}, {"q": "Why does the man say, \"The equipment supplier's offer expires on the fifteenth\"?", "opts": ["To ask for a discount", "To express urgency", "To change suppliers", "To correct a date"], "a": "B", "type": "L34-intent", "vi": "Vì sao anh ấy nhắc ưu đãi hết hạn ngày 15? → Để thể hiện sự gấp gáp.", "ex": "Phản ứng với 'about a week'; người phụ nữ đáp bằng cách ưu tiên hồ sơ.", "elim": "(A), (C), (D) không hợp phản ứng tiếp theo.", "tip": "Nhắc deadline sau khi nghe thời gian chờ = thúc giục."}]}, {"part": 3, "convo": [["W", "Hi, I'd like to book an appointment with a dermatologist. I only have time on Wednesdays."], ["M", "We have two doctors on Wednesdays. Dr. Kim is fully booked this month, but the other one has openings."], ["W", "That's fine. What time is available?"], ["M", "There's an opening at three thirty. Please note that our clinic has moved to the fifth floor of the Liberty Building."], ["W", "Thanks for letting me know."]], "graphic": {"title": "Dermatology — Doctor Schedule", "head": ["Doctor", "Days"], "rows": [["Dr. Kim", "Mon, Wed"], ["Dr. Patel", "Tue, Thu"], ["Dr. Rossi", "Wed, Fri"], ["Dr. Huang", "Sat"]]}, "vocab": [["dermatologist", "bác sĩ da liễu"], ["opening", "chỗ trống (lịch hẹn)"], ["move to", "chuyển đến"]], "qs": [{"q": "Look at the graphic. Which doctor will the woman see?", "opts": ["Dr. Kim", "Dr. Patel", "Dr. Rossi", "Dr. Huang"], "a": "C", "type": "L34-graphic", "vi": "Cô ấy sẽ gặp bác sĩ nào? → Dr. Rossi.", "ex": "Thứ Tư có Kim và Rossi; Kim kín lịch → Rossi.", "elim": "(A) đã kín lịch.", "tip": "Biểu đồ + loại trừ: nghe điều kiện (Wednesday) rồi chi tiết loại bỏ (fully booked)."}, {"q": "What time is the appointment?", "opts": ["3:00", "3:30", "4:30", "5:00"], "a": "B", "type": "L34-detail", "vi": "Lịch hẹn lúc mấy giờ? → 3:30.", "ex": "'There's an opening at three thirty'.", "elim": "Không có giờ khác.", "tip": "Ghi nhanh con số ngay khi nghe."}, {"q": "What does the man mention about the clinic?", "opts": ["It has new opening hours.", "It has hired a new doctor.", "It offers free parking.", "It has moved to a new location."], "a": "D", "type": "L34-detail", "vi": "Anh ấy nói gì về phòng khám? → Đã chuyển địa điểm.", "ex": "'our clinic has moved to the fifth floor of the Liberty Building'.", "elim": "Không nhắc giờ mở cửa hay bãi đỗ.", "tip": "'Please note that...' báo một chi tiết quan trọng → thường thành câu hỏi."}]}, {"part": 4, "convo": [["N", "Hi Ms. Duarte, this is Ken Liu from Pinecrest Accounting. I've finished preparing your company's annual financial statements. Overall, revenue grew by eight percent compared to last year, which is excellent. However, I noticed that your office supply expenses nearly doubled. I'd like to go over the details with you before we submit the documents to the tax office. Are you free next Tuesday afternoon? If so, please call me back at five five five, zero one four seven. Otherwise, you can book a time through our online scheduling system."]], "vocab": [["financial statements", "báo cáo tài chính"], ["revenue", "doanh thu"], ["go over", "xem xét kỹ"]], "qs": [{"q": "Who most likely is the speaker?", "opts": ["An accountant", "A tax officer", "A sales manager", "An office supplier"], "a": "A", "type": "L34-who", "vi": "Người nói có lẽ là ai? → Kế toán.", "ex": "'from Pinecrest Accounting', soạn báo cáo tài chính.", "elim": "(B) chỉ là nơi nộp hồ sơ.", "tip": "Tên công ty trong lời giới thiệu thường lộ nghề."}, {"q": "What concern does the speaker mention?", "opts": ["Falling revenue", "A late tax payment", "Higher spending on supplies", "Missing documents"], "a": "C", "type": "L34-detail", "vi": "Người nói lo ngại điều gì? → Chi tiêu văn phòng phẩm tăng.", "ex": "'office supply expenses nearly doubled'.", "elim": "(A) doanh thu tăng 8%.", "tip": "However → vấn đề."}, {"q": "How can the listener schedule a meeting?", "opts": ["By visiting the office", "By sending an e-mail", "By sending a text message", "By using an online system"], "a": "D", "type": "L34-detail", "vi": "Người nghe đặt lịch thế nào? → Dùng hệ thống trực tuyến.", "ex": "'book a time through our online scheduling system'.", "elim": "Gọi lại cũng được nhưng không có trong lựa chọn.", "tip": "Otherwise... = cách thứ hai → vẫn có thể là đáp án."}]}, {"part": 4, "convo": [["N", "Welcome to today's workplace wellness seminar. I'm Dr. Sarah Lin. Most of you spend over eight hours a day sitting at a desk. Research shows that standing up and moving for just five minutes every hour can reduce back pain significantly. Now, I know what you're going to say: you're too busy. But setting a simple reminder on your phone can make a big difference. In a moment, I'll demonstrate a few stretches you can do right at your desk. Please make sure you have enough space around you."]], "vocab": [["wellness", "sức khỏe toàn diện"], ["back pain", "đau lưng"], ["stretch", "động tác giãn cơ"]], "qs": [{"q": "What is the seminar about?", "opts": ["Time management", "Health at work", "Using phone apps", "Office design"], "a": "B", "type": "L34-main", "vi": "Hội thảo về gì? → Sức khỏe nơi làm việc.", "ex": "'workplace wellness seminar'.", "elim": "(C) điện thoại chỉ là công cụ nhắc.", "tip": "workplace wellness → health at work."}, {"q": "What does the speaker recommend?", "opts": ["Buying a new chair", "Working fewer hours", "Taking short movement breaks", "Seeing a doctor regularly"], "a": "C", "type": "L34-do", "vi": "Người nói khuyên gì? → Nghỉ ngắn để vận động.", "ex": "'standing up and moving for just five minutes every hour'.", "elim": "Các lời khuyên khác không có.", "tip": "Khuyên = recommend/suggest; đáp án là bản khái quát của chi tiết."}, {"q": "What will listeners most likely do next?", "opts": ["Watch some exercises", "Download an app", "Fill out a survey", "Take a break"], "a": "A", "type": "L34-next", "vi": "Người nghe sẽ làm gì tiếp? → Xem một số động tác.", "ex": "'In a moment, I'll demonstrate a few stretches'.", "elim": "(B) chỉ gợi ý đặt nhắc nhở, không tải ứng dụng.", "tip": "'In a moment / Next / Now let's' → hành động tiếp theo."}]}], "reading": [{"part": 5, "qs": [{"q": "The bank has introduced a new mobile app that makes transferring money more ______.", "opts": ["convenient", "convenience", "conveniently", "convene"], "a": "A", "type": "R5-pos", "vi": "Ngân hàng ra mắt ứng dụng giúp chuyển tiền thuận tiện hơn.", "ex": "make + O + tính từ.", "elim": "(C) trạng từ không làm bổ ngữ cho tân ngữ.", "tip": "make/keep/find/consider + O + ADJ."}, {"q": "Ms. Patel's loan application was rejected because it was ______.", "opts": ["incompletely", "incompletion", "incomplete", "completing"], "a": "C", "type": "R5-pos", "vi": "Hồ sơ vay của cô Patel bị từ chối vì chưa đầy đủ.", "ex": "Sau 'was' (cuối câu) → tính từ.", "elim": "(A) trạng từ; (B) danh từ; (D) V-ing sai nghĩa.", "tip": "be + ___ + dấu chấm → thường là tính từ."}, {"q": "Rent payments ______ on the first day of each month.", "opts": ["due", "are due", "dues", "to be due"], "a": "B", "type": "R5-verb", "vi": "Tiền thuê đến hạn vào ngày đầu tiên mỗi tháng.", "ex": "Câu thiếu động từ chính → are due.", "elim": "(A) thiếu 'be'. (C), (D) không làm động từ chính.", "tip": "Câu thiếu động từ → đáp án phải chứa động từ chia thì."}, {"q": "The clinic will extend its hours ______ the demand for appointments continues to grow.", "opts": ["if", "despite", "during", "whether"], "a": "A", "type": "R5-conj", "vi": "Phòng khám sẽ kéo dài giờ nếu nhu cầu đặt lịch tiếp tục tăng.", "ex": "Mệnh đề + nghĩa điều kiện → if.", "elim": "(B), (C) giới từ. (D) whether cần 'or not' hoặc làm mệnh đề danh ngữ.", "tip": "Mệnh đề If ở tương lai dùng hiện tại đơn (continues)."}, {"q": "______ to the financial seminar is free for all registered members.", "opts": ["Admit", "Admission", "Admitted", "Admitting"], "a": "B", "type": "R5-pos", "vi": "Việc vào cửa hội thảo tài chính miễn phí cho hội viên đã đăng ký.", "ex": "Chủ ngữ cần danh từ → Admission.", "elim": "(A) động từ; (C) quá khứ; (D) V-ing sai nghĩa.", "tip": "Đầu câu, trước giới từ, trước động từ chính → danh từ."}, {"q": "The property was sold for ______ more than its estimated value.", "opts": ["significant", "significance", "significantly", "signify"], "a": "C", "type": "R5-comp", "vi": "Bất động sản được bán với giá cao hơn đáng kể so với giá ước tính.", "ex": "Trạng từ bổ nghĩa cho 'more'.", "elim": "(A) tính từ không bổ nghĩa cho so sánh hơn.", "tip": "Trước more/less/-er → trạng từ mức độ."}, {"q": "Investors were pleased that profits rose ______ 12 percent in the third quarter.", "opts": ["on", "by", "for", "with"], "a": "B", "type": "R5-prep", "vi": "Nhà đầu tư hài lòng vì lợi nhuận tăng 12% trong quý ba.", "ex": "rise/increase by + mức thay đổi.", "elim": "on/for/with không đi với mức tăng.", "tip": "increase BY 12% (mức tăng), increase TO $5m (con số cuối)."}, {"q": "Patients ______ appointments are canceled will be contacted by phone.", "opts": ["who", "which", "whom", "whose"], "a": "D", "type": "R5-rel", "vi": "Bệnh nhân bị hủy lịch hẹn sẽ được liên lạc qua điện thoại.", "ex": "Sau chỗ trống là danh từ 'appointments' → whose.", "elim": "who/whom/which không đứng trước danh từ theo nghĩa sở hữu.", "tip": "Dạng whose xuất hiện gần như mọi đề."}, {"q": "The accountant recommended that the company ______ its spending on travel.", "opts": ["reduce", "reduces", "reduced", "reducing"], "a": "A", "type": "R5-verb", "vi": "Kế toán đề nghị công ty cắt giảm chi tiêu cho công tác.", "ex": "recommend that + S + V nguyên mẫu (giả định).", "elim": "(B) chia số ít là bẫy theo thói quen.", "tip": "recommend/suggest/insist/require that → V nguyên mẫu."}, {"q": "The new branch office is conveniently located ______ walking distance of the subway station.", "opts": ["between", "within", "among", "along"], "a": "B", "type": "R5-prep", "vi": "Văn phòng chi nhánh mới ở vị trí thuận tiện, chỉ cách ga tàu điện ngầm một quãng đi bộ.", "ex": "Cụm 'within walking distance of'.", "elim": "Các giới từ khác không tạo cụm.", "tip": "within + distance/budget/the deadline/24 hours."}, {"q": "Our financial advisors will help you choose the plan that best ______ your needs.", "opts": ["suitable", "suiting", "suits", "to suit"], "a": "C", "type": "R5-verb", "vi": "Cố vấn tài chính sẽ giúp bạn chọn gói phù hợp nhất với nhu cầu.", "ex": "Mệnh đề quan hệ 'that' cần động từ chia: chủ ngữ 'plan' số ít → suits.", "elim": "(A) tính từ; (B), (D) không chia.", "tip": "Mệnh đề quan hệ cũng cần động từ chia theo danh từ được bổ nghĩa."}]}, {"part": 6, "passages": [{"kind": "E-mail", "meta": "From: Eastbridge Bank | To: Online Banking Customers | Subject: Two-step verification", "body": "Dear Customer,\n\nTo improve the security of your account, Eastbridge Bank will introduce two-step verification for all online banking users {{0}} May 1. After you enter your password, you will receive a six-digit code by text message. You must enter this code before you can {{1}} your account. {{2}}\n\nIf you have not yet registered a mobile phone number with us, please do so {{3}} visiting any branch or calling our customer service line."}], "vocab": [["two-step verification", "xác minh hai bước"], ["six-digit code", "mã 6 chữ số"], ["register", "đăng ký"]], "qs": [{"opts": ["begin", "begun", "beginning", "beginner"], "a": "C", "type": "R6-word", "vi": "...bắt đầu từ ngày 1/5.", "ex": "'beginning + ngày' = starting + ngày.", "elim": "Các dạng khác không dùng trước mốc ngày.", "tip": "starting/beginning/effective + ngày."}, {"opts": ["access", "accessible", "accessibility", "accessing"], "a": "A", "type": "R6-word", "vi": "...trước khi bạn có thể truy cập tài khoản.", "ex": "can + V nguyên mẫu.", "elim": "Các dạng khác sai sau 'can'.", "tip": "access vừa là danh từ vừa là động từ."}, {"opts": ["Our branches are closed on national holidays.", "The code will expire after five minutes for your protection.", "Interest rates will rise next year.", "We have opened a new branch downtown."], "a": "B", "type": "R6-sent", "vi": "Mã sẽ hết hạn sau 5 phút để bảo vệ bạn.", "ex": "Tiếp tục mô tả 'this code' ở câu trước.", "elim": "(A), (C), (D) lạc chủ đề bảo mật.", "tip": "Câu đúng nhắc lại danh từ chủ đề (code)."}, {"opts": ["for", "with", "at", "by"], "a": "D", "type": "R6-word", "vi": "...bằng cách đến bất kỳ chi nhánh nào.", "ex": "by + V-ing = bằng cách.", "elim": "Các giới từ khác không mang nghĩa phương thức với V-ing ở đây.", "tip": "by + V-ing (phương thức) là cấu trúc rất hay gặp."}]}, {"part": 7, "passages": [{"kind": "Text-message chain", "body": "Grace Park [3:15 P.M.]: Hi Tom, the tenants in unit 4B reported that their heater isn't working.\nTom Weller [3:17 P.M.]: I'm finishing a repair at the Elm Street building. I could be there around five.\nGrace Park [3:18 P.M.]: They have a newborn baby, and it's getting cold.\nTom Weller [3:19 P.M.]: Understood. I'll come right after I finish here and skip my break."}], "vocab": [["tenant", "người thuê nhà"], ["heater", "máy sưởi"], ["skip a break", "bỏ giờ nghỉ"]], "qs": [{"q": "Who most likely is Mr. Weller?", "opts": ["A tenant", "A property owner", "A maintenance technician", "A delivery driver"], "a": "C", "type": "R7-infer", "vi": "Ông Weller có lẽ là ai? → Kỹ thuật viên bảo trì.", "ex": "Đang sửa chữa ở tòa nhà khác và được nhờ sửa máy sưởi.", "elim": "(A) người thuê là gia đình ở 4B.", "tip": "Suy nghề nghiệp từ hành động."}, {"q": "At 3:18 P.M., why does Ms. Park write, \"They have a newborn baby, and it's getting cold\"?", "opts": ["To emphasize that the repair is urgent", "To explain a noise complaint", "To request a new heater", "To suggest a different unit"], "a": "A", "type": "R7-intent", "vi": "Vì sao cô Park nhắc em bé sơ sinh và trời lạnh? → Nhấn mạnh việc sửa là gấp.", "ex": "Đáp lại 'khoảng 5 giờ'; sau đó ông Weller đến sớm hơn, bỏ giờ nghỉ.", "elim": "Các đáp án khác không khớp phản ứng.", "tip": "Hiệu quả của câu = phản ứng của người kia ở tin tiếp theo."}]}, {"part": 7, "passages": [{"kind": "Article", "title": "Downtown Office Vacancies Fall", "body": "The vacancy rate for downtown office buildings dropped to 11 percent in the third quarter, down from 15 percent a year earlier, according to a report released by Corvin Realty on Monday. The report attributes the decline to companies requiring employees to spend more days in the office. Smaller offices of under 200 square meters were in especially high demand.\n\nHowever, rents rose by an average of 6 percent, which may discourage some startups from moving downtown. Corvin Realty expects vacancy rates to remain stable through next year."}], "vocab": [["vacancy rate", "tỉ lệ trống"], ["attribute ... to", "quy ... cho"], ["discourage ... from", "làm nản lòng, ngăn cản"]], "qs": [{"q": "According to the report, why did vacancies decrease?", "opts": ["Many new buildings opened.", "More companies require in-office work.", "Rents became cheaper.", "Startups grew quickly."], "a": "B", "type": "R7-detail", "vi": "Vì sao tỉ lệ trống giảm? → Nhiều công ty yêu cầu làm tại văn phòng hơn.", "ex": "'attributes the decline to companies requiring employees to spend more days in the office'.", "elim": "(C) ngược: tiền thuê tăng.", "tip": "attribute X to Y: Y là nguyên nhân."}, {"q": "The word \"discourage\" in paragraph 2, line 1, is closest in meaning to", "opts": ["deter", "disappoint", "criticize", "depress"], "a": "A", "type": "R7-syn", "vi": "'discourage startups from moving' = khiến startup ngại chuyển đến → deter.", "ex": "Cấu trúc discourage/deter sb from doing.", "elim": "(B) làm thất vọng là nghĩa cảm xúc, không đi với 'from'.", "tip": "Kiểm tra cấu trúc đi kèm (from + V-ing) khi chọn từ đồng nghĩa."}, {"q": "What does Corvin Realty predict?", "opts": ["Rents will fall.", "More startups will move downtown.", "Vacancy rates will rise.", "Vacancy rates will not change much."], "a": "D", "type": "R7-detail", "vi": "Corvin Realty dự đoán gì? → Tỉ lệ trống không thay đổi nhiều.", "ex": "'remain stable through next year'.", "elim": "(C) ngược nghĩa.", "tip": "remain stable → not change much."}]}, {"part": 7, "passages": [{"kind": "Policy", "title": "Harmony Dental Clinic — Appointment Policy", "body": "• Please arrive 10 minutes before your scheduled time.\n• Cancellations must be made at least 24 hours in advance. Late cancellations will be charged a $30 fee.\n• Patients who arrive more than 15 minutes late may need to reschedule.\n• We accept most major insurance plans. Please bring your insurance card to every visit.\n• New patients should complete the health questionnaire online before their first visit."}, {"kind": "E-mail", "meta": "From: Mia Torres | To: Harmony Dental Clinic | Date: Friday, 9:00 A.M.", "body": "Hello,\n\nI have a cleaning appointment scheduled for today at 2 P.M. Unfortunately, I have to attend an urgent business meeting at that time. Would it be possible to move my appointment to next week?\n\nI understand there may be a fee, but I would
