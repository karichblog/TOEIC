<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Luyện TOEIC 2026–2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: answer-sheet metaphor — test booklet on the left, a sticky OMR bubble sheet on the right. */
:root{
  --bg:#EEF1F4; --sheet:#FFFFFF; --ink:#172238; --muted:#5A6476; --rule:#D5DBE3;
  --form:#0B6A88; --form-tint:#E3F1F6; --pencil:#272C35;
  --ok:#1E7A4C; --ok-tint:#E2F3EA; --bad:#B42318; --bad-tint:#FBE8E6; --warn:#9A6200;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --sheet:#171E28; --ink:#E5EAF1; --muted:#9AA5B5; --rule:#2A3442;
  --form:#5DB8D8; --form-tint:#12303B; --pencil:#E5EAF1;
  --ok:#52C48C; --ok-tint:#15301F; --bad:#F07A6E; --bad-tint:#3A1C1A; --warn:#E3B04B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --sheet:#171E28; --ink:#E5EAF1; --muted:#9AA5B5; --rule:#2A3442;
  --form:#5DB8D8; --form-tint:#12303B; --pencil:#E5EAF1;
  --ok:#52C48C; --ok-tint:#15301F; --bad:#F07A6E; --bad-tint:#3A1C1A; --warn:#E3B04B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--form);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{font-family:var(--f-num);font-size:12px;color:var(--form)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;padding:6px 11px;border-radius:6px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--bg)}
nav.tabs a[aria-current="page"]{color:var(--form);background:var(--form-tint);font-weight:600}
main{padding-block:24px 96px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:20px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0}
.eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--form)}
.lede{color:var(--muted);max-width:68ch;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:28px;align-items:start;margin-top:20px}
.layout>*{min-width:0}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.toolbar label{display:flex;align-items:center;gap:8px}
.toolbar input[type=range]{width:110px;accent-color:var(--form)}
.timer{font-family:var(--f-num);color:var(--ink)}
.voicewarn{color:var(--warn)}
/* sections */
.section-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.section-h:first-child{margin-top:0}
.section-h .eyebrow{color:var(--muted)}
.part-h{margin:26px 0 10px}
.part-h h3{display:flex;gap:10px;align-items:baseline}
.part-h h3 .pn{font-family:var(--f-num);color:var(--form);font-size:13px}
.part-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:72ch}
.group{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.group-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.qrange{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.play{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--form);background:var(--form-tint);color:var(--form);
  border-radius:999px;padding:5px 14px 5px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
.play svg{width:14px;height:14px;fill:currentColor}
.play[data-on="1"]{background:var(--form);color:var(--sheet)}
.scene{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border:1px dashed var(--rule);border-radius:8px;padding:14px;margin-bottom:12px}
.scene .cam{flex:none;width:44px;height:36px;border:1.5px solid var(--muted);border-radius:6px;position:relative}
.scene .cam::after{content:"";position:absolute;inset:8px 13px;border:1.5px solid var(--muted);border-radius:50%}
.scene p{margin:0;font-size:14.5px}
.scene small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.text-en{font-family:var(--f-text);font-size:16px;line-height:1.6}
.q{padding:10px 0;border-top:1px solid var(--rule)}
.q:first-of-type{border-top:0}
.qline{display:flex;gap:10px;align-items:baseline}
.qn{flex:none;font-family:var(--f-num);font-weight:600;font-size:14px;min-width:26px}
.qtext{min-width:0}
.opts{display:flex;flex-direction:column;gap:4px;margin:8px 0 0 36px}
.opts.inline{flex-direction:row;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;cursor:pointer;width:100%}
.opts.inline .opt{width:auto;padding:4px}
.opt:hover{background:var(--bg)}
.bub{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--form);color:var(--form);display:grid;place-items:center;
  font-family:var(--f-num);font-size:12px;font-weight:600;margin-top:1px}
.opt.sel .bub{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
.opt .ot{font-family:var(--f-text);font-size:15.5px}
.done .opt{cursor:default}
.done .opt.right{background:var(--ok-tint)}
.done .opt.right .bub{border-color:var(--ok);background:var(--ok);color:var(--sheet)}
.done .opt.sel.wrong{background:var(--bad-tint)}
.done .opt.sel.wrong .bub{border-color:var(--bad);background:var(--bad);color:var(--sheet)}
.explain{margin:10px 0 0 36px;padding:10px 12px;border-left:3px solid var(--form);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px}
.explain p{margin:4px 0}
.explain .tip{color:var(--muted)}
.explain .tip b{color:var(--ink)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--form-tint);color:var(--form);text-decoration:none;margin-right:6px}
.verdict{font-weight:700;font-size:12.5px;margin-right:6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
details.tr{margin-top:12px;font-size:14px}
details.tr summary{cursor:pointer;color:var(--form);font-weight:600;font-size:13.5px}
.script{margin-top:8px;display:grid;gap:6px}
.script div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.script .sp{font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:3px}
.graphic{overflow-x:auto;margin:4px 0 12px}
.graphic table,.docs table{border-collapse:collapse;font-size:14px;min-width:280px}
.graphic caption{caption-side:top;text-align:left;font-weight:600;font-size:13px;padding-bottom:6px}
.graphic th,.graphic td{border:1px solid var(--rule);padding:5px 12px;text-align:left;font-variant-numeric:tabular-nums}
.graphic th{background:var(--bg);font-weight:600}
.doc{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:var(--sheet)}
.doc .kind{font-family:var(--f-num);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.doc .dtitle{font-weight:700;margin-top:2px}
.doc .meta{font-size:13px;color:var(--muted);margin-top:2px}
.doc .body{font-family:var(--f-text);font-size:15.5px;line-height:1.65;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.blank{font-family:var(--f-num);font-weight:600;color:var(--form);border-bottom:1.5px solid var(--form);padding:0 6px;white-space:nowrap}
.ins{font-family:var(--f-num);font-weight:600;color:var(--form)}
/* answer sheet */
aside.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px}
.sheet h3{font-size:14px;display:flex;justify-content:space-between}
.sheet h3 span{font-family:var(--f-num);color:var(--muted);font-weight:500}
.omr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 4px}
.omr button{border:1.5px solid var(--form);background:none;border-radius:6px;height:30px;font-family:var(--f-num);font-size:12px;cursor:pointer;color:var(--form);padding:0}
.omr button.f{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
.omr button.ok{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.omr button.bad{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.omr-label{font-size:11.5px;color:var(--muted);margin-top:8px;font-family:var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
.btn.primary{background:var(--form);color:var(--sheet)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--rule)}
.confirm{font-size:13px;margin-top:10px;padding:10px;background:var(--bg);border-radius:8px}
.confirm .row{display:flex;gap:8px}
.confirm .btn{margin-top:8px;padding:8px}
/* results */
.result{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:20px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.score{border:1px solid var(--rule);border-radius:8px;padding:12px}
.score .lab{font-size:12.5px;color:var(--muted)}
.score .big{font-family:var(--f-num);font-size:26px;font-weight:600}
.score .est{font-size:12.5px;color:var(--muted)}
.typeTable{width:100%;border-collapse:collapse;font-size:13.5px}
.typeTable td,.typeTable th{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.typeTable th{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.low{background:var(--bad)} .bar i.mid{background:var(--warn)}
.note{font-size:12.5px;color:var(--muted)}
.freq{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}
.freq i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.freq i.on{background:var(--warn)}
.flabel{font-size:11.5px;color:var(--warn);font-weight:600;margin-right:6px}
.explain .lab{color:var(--muted);font-weight:600;font-size:12.5px;margin-right:4px}
.gvocab{margin-top:12px;font-size:13.5px;border-top:1px dashed var(--rule);padding-top:10px}
.gvocab .lab{font-weight:600;color:var(--muted);font-size:12.5px}
.gvocab ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px}
.gvocab li b{font-family:var(--f-text);font-weight:600}
.setlabel{margin-top:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.setlabel .tag{font-family:var(--f-num);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.cards5 .badge{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);margin-top:4px}
/* guide pages */
.guide{max-width:860px}
.guide section{margin-top:30px}
.tcard{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-top:10px;scroll-margin-top:90px}
.tcard:target{border-color:var(--form);box-shadow:0 0 0 3px var(--form-tint)}
.tcard h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tcard .cnt{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:500}
.tcard dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;margin:10px 0 0;font-size:14px}
.tcard dt{color:var(--muted);font-weight:600;font-size:13px}
.tcard dd{margin:0}
.facts{display:grid;gap:10px;margin-top:12px}
.fact{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px}
.fact .tag{font-family:var(--f-num);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.fact .tag.v{color:var(--ok)} .fact .tag.p{color:var(--warn)}
.fact p{margin:6px 0 0}
.tablewrap{overflow-x:auto;margin-top:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.tablewrap table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.tablewrap th,.tablewrap td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:left;font-variant-numeric:tabular-nums}
.tablewrap th{font-size:12.5px;color:var(--muted)}
.tablewrap tr:last-child td{border-bottom:0}
.vocab td:first-child{font-family:var(--f-text);font-size:15px}
.sources{font-size:13px;color:var(--muted)}
.sources a{color:var(--form)}
.cards5{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:16px}
.cards5 a{display:block;text-decoration:none;color:inherit;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.cards5 a:hover{border-color:var(--form)}
.cards5 b{display:block}
.cards5 span{font-size:13px;color:var(--muted)}
.cards5 .st{font-family:var(--f-num);font-size:12px;color:var(--form);margin-top:6px}
/* mobile */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:12px 12px 0 0;z-index:6;max-height:70vh;overflow:auto;
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -4px 18px rgba(0,0,0,.12)}
  aside.sheet:not(.open) .omr,aside.sheet:not(.open) .omr-label{display:none}
  .sheetToggle{display:inline-flex!important}
  .opts{margin-left:0}
  .explain{margin-left:0}
  .tcard dl{grid-template-columns:minmax(0,1fr)}
}
.sheetToggle{display:none;font-size:12.5px;background:none;border:1px solid var(--rule);border-radius:6px;padding:2px 8px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.opt,.omr button,.play{transition:background .15s,border-color .15s,color .15s}}
</style>

</div></header>

<script>
const TESTS = [{"id": 1, "title": "Đề 1", "theme": "Văn phòng & công nghệ", "listening": [{"part": 1, "scene": "Một người phụ nữ đứng trước máy photocopy, đang đặt xấp giấy vào khay giấy của máy.", "sp": "N", "qs": [{"opts": ["She's opening a window.", "She's loading paper into a machine.", "She's carrying a box up the stairs.", "She's signing a document."], "a": "B", "type": "L1-person", "ex": "(B) 'loading paper into a machine' = nạp giấy vào máy, đúng hành động trong ảnh. (A), (C), (D) mô tả hành động không có trong ảnh.", "tip": "Ảnh 1 người: nghe kỹ ĐỘNG TỪ hành động. Loại ngay câu có động từ không khớp dù danh từ có trong ảnh."}]}, {"part": 1, "scene": "Phòng hội nghị trống: các hàng ghế xếp thẳng hàng, trên bục có một chiếc micro. Không có người nào trong ảnh.", "sp": "N", "qs": [{"opts": ["Some people are attending a lecture.", "A speaker is adjusting a microphone.", "Chairs have been arranged in rows.", "The curtains are being closed."], "a": "C", "type": "L1-scene", "ex": "(C) 'have been arranged in rows' = đã được xếp thành hàng (bị động hoàn thành, mô tả trạng thái). (A), (B) có người trong khi ảnh không có người. (D) 'are being closed' = đang được kéo, cần có người thực hiện.", "tip": "Ảnh không có người: loại câu có chủ ngữ là người và câu 'is/are being + V3' (cần người đang làm). Ưu tiên 'has/have been + V3' hoặc 'There is/are'."}]}, {"part": 2, "q": "Where will the new training session be held?", "sp": ["W", "M"], "qs": [{"opts": ["In the conference room on the third floor.", "It was very helpful.", "At three o'clock."], "a": "A", "type": "L2-wh", "ex": "Hỏi WHERE (ở đâu) → trả lời địa điểm (A). (C) trả lời WHEN; (B) nói về chất lượng buổi đào tạo.", "tip": "Nghe chắc 3 từ đầu (Where/When/Who...) rồi loại đáp án sai loại thông tin."}]}, {"part": 2, "q": "Who's responsible for updating the client database?", "sp": ["M", "W"], "qs": [{"opts": ["The data was updated.", "Mr. Patel's team handles that.", "Yes, it's responsible."], "a": "B", "type": "L2-wh", "ex": "Hỏi WHO → (B) nêu người/nhóm phụ trách. (A) lặp từ 'updated', (C) lặp 'responsible' và dùng Yes cho câu hỏi WH.", "tip": "Bẫy lặp từ: đáp án nhắc lại nguyên từ trong câu hỏi thường SAI. Câu hỏi WH không trả lời bằng Yes/No."}]}, {"part": 2, "q": "Would you like me to send you the slides after the meeting?", "sp": ["W", "M"], "qs": [{"opts": ["That would be great, thanks.", "They slid down.", "The meeting room is booked."], "a": "A", "type": "L2-req", "ex": "Lời đề nghị giúp đỡ (Would you like me to...?) → đồng ý (A). (B) bẫy âm gần 'slides – slid'. (C) lặp 'meeting'.", "tip": "Câu đề nghị/mời: đáp án thường là đồng ý/từ chối lịch sự (Sure, That'd be great, No thanks, I can manage)."}]}, {"part": 2, "q": "Should we order the new laptops now or wait until next quarter?", "sp": ["M", "W"], "qs": [{"opts": ["A quarter past nine.", "Yes, I ordered it.", "Let's check the budget first."], "a": "C", "type": "L2-choice", "ex": "Câu hỏi lựa chọn (A or B) → (C) trả lời gián tiếp: xem ngân sách trước rồi quyết. (A) bẫy từ 'quarter'. (B) dùng Yes cho câu hỏi lựa chọn.", "tip": "Câu hỏi 'A or B': đáp án hay là chọn 1, chọn cả 2, 'either/neither', hoặc trả lời gián tiếp. Gần như không bao giờ là Yes/No."}]}, {"part": 2, "q": "The printer on this floor isn't working again.", "sp": ["W", "M"], "qs": [{"opts": ["I'll call the technician.", "He works on the fifth floor.", "Print two copies, please."], "a": "A", "type": "L2-stmt", "ex": "Câu trần thuật báo sự cố → phản hồi đưa ra giải pháp (A). (B) lặp 'works/floor'. (C) lặp gốc 'print'.", "tip": "Câu trần thuật: đáp án là phản ứng tự nhiên (giải pháp, đồng tình, hỏi lại). Dạng khó nhất Part 2 – loại trừ bẫy lặp từ trước."}]}, {"part": 2, "q": "Haven't you submitted your expense report yet?", "sp": ["M", "W"], "qs": [{"opts": ["I did it yesterday afternoon.", "The report is very long.", "No, it's not expensive."], "a": "A", "type": "L2-tag", "ex": "Câu hỏi phủ định ≈ câu hỏi Yes/No thường: 'Bạn nộp chưa?' → (A) 'Tôi nộp chiều qua rồi'. (C) bẫy 'expense – expensive'.", "tip": "Câu hỏi phủ định/đuôi: bỏ 'not' đi rồi hiểu như câu hỏi thường. Đáp án đúng hay bỏ luôn Yes/No."}]}, {"part": 2, "q": "When is the software update scheduled?", "sp": ["W", "M"], "qs": [{"opts": ["On the server.", "It's been postponed until Friday.", "A new schedule app."], "a": "B", "type": "L2-wh", "ex": "Hỏi WHEN → (B) nêu thời gian (hoãn đến thứ Sáu). (A) trả lời địa điểm, (C) lặp 'schedule'.", "tip": "Đáp án WHEN có thể là thời gian gián tiếp: 'postponed until...', 'not until...', 'as soon as...'."}]}, {"part": 2, "q": "Why don't we hold the product launch online this year?", "sp": ["M", "W"], "qs": [{"opts": ["Because it was launched.", "At the main hall.", "That would save on travel costs."], "a": "C", "type": "L2-req", "ex": "'Why don't we...?' là LỜI GỢI Ý chứ không hỏi lý do → (C) đồng tình kèm lợi ích. (A) bẫy: trả lời 'Because' cho câu gợi ý.", "tip": "'Why don't we/you...?' = gợi ý. Đáp án bắt đầu bằng 'Because' gần như chắc chắn sai."}]}, {"part": 3, "convo": [["W", "Hi, I'm calling about the office chairs I ordered last week. The order number is 4471. They were supposed to arrive yesterday, but nothing came."], ["M", "I'm sorry about that, ma'am. Let me check. It looks like there was a delay at our warehouse because of a supplier issue. The chairs will be shipped tomorrow morning."], ["W", "Hmm, we have new employees starting on Monday, so we really need them by then."], ["M", "I understand. I'll upgrade your delivery to express shipping at no extra charge. They should arrive by Friday."]], "qs": [{"q": "Why is the woman calling?", "opts": ["To place a new order", "To report a delayed delivery", "To request a refund", "To change her address"], "a": "B", "type": "L34-main", "ex": "Câu đầu: 'were supposed to arrive yesterday, but nothing came' → hàng giao trễ.", "tip": "Câu hỏi mục đích/chủ đề: đáp án gần như luôn nằm ở 1–2 câu ĐẦU bài."}, {"q": "What caused the problem?", "opts": ["Bad weather", "A wrong address", "A payment error", "A supplier issue"], "a": "D", "type": "L34-detail", "ex": "Người đàn ông nói 'a delay at our warehouse because of a supplier issue'.", "tip": "Chi tiết: đọc trước câu hỏi, gạch từ khóa (caused/problem) và chờ tín hiệu 'because of / due to'."}, {"q": "What does the man offer to do?", "opts": ["Give a discount", "Cancel the order", "Upgrade the shipping", "Send a catalog"], "a": "C", "type": "L34-do", "ex": "'I'll upgrade your delivery to express shipping' → nâng cấp vận chuyển.", "tip": "Offer/suggest/ask: chờ cấu trúc 'I'll.../ I can.../ Let me.../ Why don't you...'."}]}, {"part": 3, "convo": [["M", "Lisa, have you finished the slides for the investors' meeting?"], ["W", "Almost. I'm still waiting for the sales figures from the finance department."], ["M", "The meeting starts at two."], ["W", "I know, I know. I'll go down to their office and get the numbers myself."], ["M", "Good idea. And once you're done, could you email me a copy? I'd like to review it before lunch."]], "qs": [{"q": "What are the speakers mainly discussing?", "opts": ["A presentation", "A job interview", "A sales conference", "A finance course"], "a": "A", "type": "L34-main", "ex": "'slides for the investors' meeting' → bài thuyết trình (paraphrase slides = presentation).", "tip": "TOEIC thích paraphrase: slides → presentation, figures → numbers/data."}, {"q": "Why does the man say, \"The meeting starts at two\"?", "opts": ["To correct a schedule", "To suggest a later time", "To indicate urgency", "To invite the woman"], "a": "C", "type": "L34-intent", "ex": "Phản hồi 'I know, I know' và việc cô tự đi lấy số liệu cho thấy anh ta đang nhắc thời gian gấp.", "tip": "Câu hỏi ý định (Why does... say '...'): nghe câu NGAY TRƯỚC và NGAY SAU câu trích dẫn để hiểu hàm ý."}, {"q": "What will the woman probably do next?", "opts": ["Call a client", "Visit another department", "Have lunch", "Print a document"], "a": "B", "type": "L34-next", "ex": "'I'll go down to their office' (phòng tài chính) → đến phòng ban khác.", "tip": "Hành động tiếp theo: đáp án ở cuối bài, thường là 'I'll / I'm going to'."}]}, {"part": 3, "convo": [["W", "Kenji, I need to book a room for the training workshop next Thursday."], ["M", "How many people are attending?"], ["W", "Fifteen from our department, plus the trainer. And we'll need a projector."], ["M", "Then this one is the best choice. The bigger hall with the stage is too expensive for a small group."], ["W", "Great. Could you also arrange coffee and snacks?"], ["M", "Sure. I'll contact the catering company this afternoon."]], "graphic": {"title": "Meeting Rooms", "head": ["Room", "Capacity", "Equipment"], "rows": [["Maple", "6", "TV screen"], ["Cedar", "12", "Projector"], ["Birch", "20", "Projector"], ["Oak", "40", "Stage & sound system"]]}, "qs": [{"q": "What event are the speakers planning?", "opts": ["A training workshop", "A client dinner", "A job fair", "A board meeting"], "a": "A", "type": "L34-main", "ex": "Câu đầu: 'book a room for the training workshop'.", "tip": "Chủ đề ở câu đầu tiên."}, {"q": "Look at the graphic. Which room will the speakers most likely book?", "opts": ["Maple", "Cedar", "Birch", "Oak"], "a": "C", "type": "L34-graphic", "ex": "16 người (15 + trainer) và cần projector → Cedar (12) quá nhỏ, Oak đắt → Birch (20 chỗ, có projector).", "tip": "Câu biểu đồ: đáp án là cột KHÔNG được nhắc tên; nghe thông tin ở cột còn lại (số người, thiết bị) rồi đối chiếu."}, {"q": "What will the man do this afternoon?", "opts": ["Test a projector", "Email the trainer", "Print handouts", "Contact a caterer"], "a": "D", "type": "L34-next", "ex": "'I'll contact the catering company this afternoon'.", "tip": "Nghe mốc thời gian trong câu hỏi (this afternoon) để bắt đúng câu."}]}, {"part": 4, "convo": [["N", "Attention, shoppers. Greenleaf Market is pleased to announce that our new self-checkout lanes are now open near the main entrance. To celebrate, customers who use the new lanes today will receive a coupon for ten percent off their next purchase. If you need help using the machines, our staff members in green aprons will be happy to assist. Also, please note that the pharmacy will close early today, at six p.m., for inventory."]], "qs": [{"q": "Where is the announcement being made?", "opts": ["At a pharmacy school", "At a supermarket", "At a bank", "At an airport"], "a": "B", "type": "L34-who", "ex": "'Attention, shoppers… Greenleaf Market… checkout lanes' → siêu thị.", "tip": "Hỏi nơi chốn: cộng dồn từ khóa (shoppers, checkout, purchase). Cẩn thận bẫy 'pharmacy' chỉ là chi tiết phụ."}, {"q": "What will customers receive if they use the new lanes today?", "opts": ["A free bag", "A membership card", "A discount coupon", "A gift box"], "a": "C", "type": "L34-detail", "ex": "'a coupon for ten percent off' → phiếu giảm giá.", "tip": "Paraphrase: ten percent off → discount."}, {"q": "Why will the pharmacy close early?", "opts": ["For a staff meeting", "For repairs", "For a holiday", "For an inventory count"], "a": "D", "type": "L34-detail", "ex": "'close early today… for inventory' → kiểm kê.", "tip": "Câu hỏi cuối thường ứng với thông tin cuối bài nói."}]}, {"part": 4, "convo": [["W", "Hi, Mr. Alvarez. This is Grace Lin from Brightway Apartments. I'm calling about your application for the two-bedroom unit on Elm Street. Good news: the owner has approved it. To complete the process, we need a copy of your employment contract. You can upload it through our online tenant portal. Also, the move-in date you requested, November first, is available. But the elevator in the building will be under maintenance that week, so I recommend booking the freight elevator in advance. Please call me back at 555-0182."]], "qs": [{"q": "Who most likely is the speaker?", "opts": ["A property agent", "A bank officer", "A moving company employee", "A building inspector"], "a": "A", "type": "L34-who", "ex": "Gọi từ 'Brightway Apartments', nói về hồ sơ thuê căn hộ → nhân viên bất động sản.", "tip": "Hỏi nghề nghiệp: nghe phần tự giới thiệu 'This is... from...'."}, {"q": "What does the speaker ask the listener to do?", "opts": ["Pay a deposit", "Upload a document", "Sign a lease in person", "Choose a different unit"], "a": "B", "type": "L34-do", "ex": "'we need a copy of your employment contract… upload it' → tải tài liệu lên.", "tip": "Yêu cầu: chờ 'we need / please / you can'."}, {"q": "What does the speaker mention about the move-in week?", "opts": ["The rent will increase.", "The building will be closed.", "The elevator may be unavailable.", "The office will be closed."], "a": "C", "type": "L34-detail", "ex": "'the elevator… under maintenance that week' → thang máy có thể không dùng được.", "tip": "under maintenance ≈ unavailable / out of service."}]}], "reading": [{"part": 5, "qs": [{"q": "The marketing team will present its ______ strategy at Monday's meeting.", "opts": ["revise", "revised", "revising", "revision"], "a": "B", "type": "R5-pos", "ex": "Trước danh từ 'strategy' cần tính từ → 'revised' (đã được điều chỉnh).", "tip": "Ô trống giữa tính từ sở hữu (its) và danh từ → điền TÍNH TỪ."}, {"q": "All employees must complete the online safety course ______ the end of the month.", "opts": ["by", "until", "since", "among"], "a": "A", "type": "R5-prep", "ex": "'by + mốc thời gian' = hạn chót (trước lúc đó). 'until' dùng cho hành động kéo dài.", "tip": "complete/submit/finish + BY (deadline); stay/wait/continue + UNTIL."}, {"q": "Ms. Tanaka has worked at Orion Technologies ______ 2019.", "opts": ["since", "for", "during", "ago"], "a": "A", "type": "R5-prep", "ex": "Thì hiện tại hoàn thành + mốc thời gian (2019) → since.", "tip": "Thấy 'has/have + V3' → since + mốc, for + khoảng."}, {"q": "The new accounting software is ______ easier to use than the previous version.", "opts": ["very", "so", "too", "much"], "a": "D", "type": "R5-comp", "ex": "Bổ nghĩa cho so sánh hơn (easier than) dùng much/far/even/a lot, không dùng very.", "tip": "Thấy '-er than / more... than' → chọn much, far, even, still, considerably."}, {"q": "Customers ______ order online before noon will receive their items the same day.", "opts": ["who", "whose", "which", "whom"], "a": "A", "type": "R5-rel", "ex": "Thay cho người (customers) và làm chủ ngữ của 'order' → who.", "tip": "Sau chỗ trống là ĐỘNG TỪ → who/which; là DANH TỪ → whose; là chủ ngữ + động từ → whom/which/that."}, {"q": "Please return the signed contract to ______ at your earliest convenience.", "opts": ["we", "our", "us", "ours"], "a": "C", "type": "R5-pron", "ex": "Sau giới từ 'to' cần đại từ tân ngữ → us.", "tip": "Giới từ + đại từ tân ngữ (me, us, them...)."}, {"q": "The company's profits increased ______ last year thanks to strong overseas sales.", "opts": ["significant", "significance", "signify", "significantly"], "a": "D", "type": "R5-pos", "ex": "Bổ nghĩa cho động từ 'increased' → trạng từ significantly.", "tip": "Sau động từ thường (increase, rise, drop) → TRẠNG TỪ -ly."}, {"q": "By the time the CEO arrives, the technicians ______ the video system.", "opts": ["set up", "will have set up", "are setting up", "had set up"], "a": "B", "type": "R5-verb", "ex": "'By the time + hiện tại đơn' → mệnh đề chính dùng tương lai hoàn thành.", "tip": "By the time + HTĐ → will have V3; By the time + QKĐ → had V3."}, {"q": "______ the heavy rain, the outdoor product demonstration attracted over 300 visitors.", "opts": ["Although", "Despite", "Because", "However"], "a": "B", "type": "R5-conj", "ex": "Sau chỗ trống là cụm danh từ (the heavy rain) và nghĩa nhượng bộ → Despite.", "tip": "Liên từ + mệnh đề (Although, Because); giới từ + cụm danh từ (Despite, Because of). Kiểm tra cả cấu trúc lẫn nghĩa."}, {"q": "Applicants should ______ a résumé and two letters of reference.", "opts": ["attend", "apply", "submit", "register"], "a": "C", "type": "R5-vocab", "ex": "submit a résumé = nộp hồ sơ. 'apply' cần 'for', 'register' cần 'for'.", "tip": "Từ vựng: xem cụm đi kèm (collocation) và động từ có cần giới từ không."}, {"q": "The warehouse manager asked that every shipment ______ carefully before it leaves the building.", "opts": ["inspects", "is inspecting", "be inspected", "inspected"], "a": "C", "type": "R5-verb", "ex": "Cấu trúc giả định: ask/request/require that + S + (be) V nguyên mẫu. Lô hàng được kiểm tra → bị động 'be inspected'.", "tip": "Thấy ask/recommend/require/insist THAT → động từ nguyên mẫu không chia."}]}, {"part": 6, "passages": [{"kind": "E-mail", "meta": "To: All staff | From: Facilities Team | Subject: Third-floor renovation", "body": "Starting on Monday, May 4, the third floor of our building will be renovated. The work is expected to {{0}} about three weeks. During this period, employees in the sales and design teams will be temporarily {{1}} to the meeting rooms on the fifth floor. {{2}}\n\nWe understand that this may cause some inconvenience. {{3}}, the new space will include brighter lighting, a quiet zone, and additional charging stations. Thank you for your patience."}], "qs": [{"opts": ["last", "stay", "spend", "remain"], "a": "A", "type": "R6-word", "ex": "'last + khoảng thời gian' = kéo dài. 'remain/stay' không đi với 'about three weeks' theo nghĩa này.", "tip": "Part 6 từ vựng: đọc cả câu, ưu tiên collocation tự nhiên."}, {"opts": ["relocate", "relocating", "relocated", "relocation"], "a": "C", "type": "R6-word", "ex": "Nhân viên ĐƯỢC chuyển chỗ → bị động 'will be relocated'.", "tip": "be + ___ + to: kiểm tra chủ động/bị động theo nghĩa."}, {"opts": ["The sales team exceeded its targets last quarter.", "Please pack your personal items in the boxes provided by Friday, May 1.", "The fifth-floor cafeteria serves lunch until 2 P.M.", "Our design team won an award in March."], "a": "B", "type": "R6-sent", "ex": "Câu trước nói về việc chuyển chỗ → câu tiếp hợp lý là hướng dẫn đóng gói đồ trước ngày bắt đầu (May 1 trước May 4).", "tip": "Điền câu: câu đúng phải nối logic với câu TRƯỚC và SAU, thường lặp lại/chỉ tới ý (từ chỉ định, mốc thời gian)."}, {"opts": ["Therefore", "Otherwise", "However", "Similarly"], "a": "C", "type": "R6-word", "ex": "Câu trước: bất tiện; câu sau: lợi ích → tương phản → However.", "tip": "Trạng từ nối: xác định quan hệ 2 câu (tương phản, kết quả, bổ sung)."}]}, {"part": 7, "passages": [{"kind": "Text-message chain", "body": "Daniel Cho [9:12 A.M.]: Hi Mei, the client from Seoul just moved our video call to 10:30.\nMei Huang [9:13 A.M.]: That's when I'm at the dentist.\nDaniel Cho [9:14 A.M.]: No problem. I can lead it. Can you send me the latest project timeline?\nMei Huang [9:15 A.M.]: Sure, it's in the shared folder under \"Q3 Plans.\" I'll also forward you my notes.\nDaniel Cho [9:16 A.M.]: Perfect. I'll update you afterward."}], "qs": [{"q": "Why did Mr. Cho write to Ms. Huang?", "opts": ["To report a schedule change", "To cancel a project", "To ask about a dentist", "To book a meeting room"], "a": "A", "type": "R7-main", "ex": "Tin đầu: khách hàng đổi giờ cuộc gọi sang 10:30.", "tip": "Mục đích tin nhắn nằm ở tin đầu tiên."}, {"q": "At 9:13 A.M., what does Ms. Huang mean when she writes, \"That's when I'm at the dentist\"?", "opts": ["She wants to reschedule her appointment.", "She cannot attend the call.", "She will arrive late to work.", "She needs Mr. Cho's advice."], "a": "B", "type": "R7-intent", "ex": "Giờ mới trùng lịch nha sĩ → cô không tham gia được; tin sau Daniel đề nghị tự dẫn cuộc gọi xác nhận điều đó.", "tip": "Câu ý định: đọc tin NGAY SAU để xem người kia phản ứng thế nào."}]}, {"part": 7, "passages": [{"kind": "Advertisement", "title": "Coworking Hub Riverside", "body": "Whether you are a freelancer, a startup, or a remote employee, Coworking Hub offers the space you need. [1] Our facility, located two minutes from Riverside Station, is open 24 hours a day. Members enjoy high-speed internet, free printing of up to 100 pages per month, and access to fully equipped meeting rooms. [2]\n\nMembership plans: Day Pass $12 | Monthly Flex (10 days) $95 | Monthly Unlimited $150\n\n[3] New members who sign up for a Monthly Unlimited plan before December 31 will receive their first week free. [4] To book a tour, visit www.coworkinghub-riverside.com."}], "qs": [{"q": "What is NOT mentioned as a benefit for members?", "opts": ["Internet access", "Free printing", "Meeting rooms", "Free parking"], "a": "D", "type": "R7-not", "ex": "Bài nêu internet, in miễn phí, phòng họp; không nhắc bãi đỗ xe.", "tip": "Câu NOT: đối chiếu từng đáp án với bài, gạch dần cái có nhắc tới."}, {"q": "How can new members get a free week?", "opts": ["By referring a friend", "By choosing a specific plan before a deadline", "By booking a tour", "By paying for a full year"], "a": "B", "type": "R7-detail", "ex": "Đăng ký gói Monthly Unlimited trước 31/12 → paraphrase thành 'chọn gói cụ thể trước hạn'.", "tip": "Đáp án đúng ở Part 7 thường được diễn đạt lại (paraphrase), không chép nguyên văn."}, {"q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Meeting rooms can be reserved through our mobile app.\"", "opts": ["[1]", "[2]", "[3]", "[4]"], "a": "B", "type": "R7-insert", "ex": "Câu chèn nói tiếp về 'meeting rooms' → đặt ngay sau câu nhắc meeting rooms, tức vị trí [2].", "tip": "Chèn câu: tìm từ khóa/đại từ trong câu cần chèn rồi đặt sau câu giới thiệu cùng chủ đề đó."}]}, {"part": 7, "passages": [{"kind": "E-mail", "meta": "From: Sarah Kim, Nova Tech | To: Lumière Catering | Date: October 2", "body": "Thank you for the quote for our product launch on October 20. We would like to confirm the Premium Buffet for 80 guests. However, about 15 of our guests follow a vegetarian diet, so please make sure there are enough vegetarian options.\n\nAlso, the event venue has changed from our headquarters to the Harbor View Hotel, Room B. Our guests will arrive at 6 P.M., so we would like the food to be ready by 5:45 P.M. Please send a revised invoice."}, {"kind": "Invoice", "title": "Lumière Catering — Invoice #2210", "meta": "Date: October 4 | Client: Nova Tech", "body": "Premium Buffet × 80 @ $45 ........ $3,600\nVegetarian add-on × 15 @ $5 ........ $75\nDelivery to Harbor View Hotel ........ $120\nTOTAL ........ $3,795\n\nNote: A 30% deposit is due by October 10. Our team begins setup 90 minutes before the serving time."}], "qs": [{"q": "What is the purpose of the e-mail?", "opts": ["To complain about a service", "To cancel an event", "To confirm an order and request changes", "To apply for a job"], "a": "C", "type": "R7-main", "ex": "Xác nhận gói buffet và yêu cầu thêm món chay, đổi địa điểm, gửi hóa đơn mới.", "tip": "Mục đích email: đoạn đầu + các câu yêu cầu (please...)."}, {"q": "What is suggested about the product launch?", "opts": ["It was postponed.", "It will start at 5:45 P.M.", "It will have 15 speakers.", "It was originally planned at Nova Tech's headquarters."], "a": "D", "type": "R7-infer", "ex": "'venue has changed from our headquarters' → ban đầu tổ chức tại trụ sở.", "tip": "Suggested/implied: đáp án không nói thẳng, phải suy ra từ 1 chi tiết. Loại đáp án nhầm số liệu (5:45 là giờ đồ ăn sẵn sàng)."}, {"q": "In the e-mail, the word \"follow\" in paragraph 1, line 2, is closest in meaning to", "opts": ["chase", "adhere to", "come after", "understand"], "a": "B", "type": "R7-syn", "ex": "'follow a vegetarian diet' = tuân theo chế độ ăn chay → adhere to.", "tip": "Từ đồng nghĩa: thay từng đáp án vào câu gốc, chọn cái giữ nguyên nghĩa NGỮ CẢNH (không phải nghĩa phổ biến nhất)."}, {"q": "What is true about the invoice?", "opts": ["It was sent on October 2.", "It lists 95 guests.", "It includes a delivery charge.", "It has been fully paid."], "a": "C", "type": "R7-detail", "ex": "Có dòng 'Delivery to Harbor View Hotel $120'.", "tip": "Câu 'true about': quét từng đáp án, cẩn thận bẫy số (80 + 15 không phải 95 khách)."}, {"q": "When will Lumière Catering staff most likely begin setting up?", "opts": ["At 4:00 P.M.", "At 4:15 P.M.", "At 5:45 P.M.", "At 6:00 P.M."], "a": "B", "type": "R7-cross", "ex": "Email: đồ ăn sẵn sàng lúc 5:45. Hóa đơn: setup bắt đầu 90 phút trước giờ phục vụ → 4:15.", "tip": "Câu liên kết 2 văn bản: một dữ kiện ở văn bản 1, một ở văn bản 2. Thường là câu cuối của cụm."}]}]}, {"id": 2, "title": "Đề 2", "theme": "Du lịch, khách sạn & hàng không", "listening": [{"part": 1, "scene": "Hai du khách đang kéo vali đi dọc sảnh nhà ga sân bay; phía sau là bảng thông tin chuyến bay.", "sp": "N", "qs": [{"opts": ["They're boarding an airplane.", "They're unpacking their suitcases.", "They're pulling their luggage through a terminal.", "They're reading a newspaper at a gate."], "a": "C", "type": "L1-person", "ex": "(C) 'pulling their luggage through a terminal' = kéo hành lý đi qua nhà ga. (A) chưa lên máy bay; (B) không mở vali; (D) không đọc báo.", "tip": "Ảnh nhiều người cùng làm 1 việc: chủ ngữ 'They' + động từ chung. Nghe từ đồng nghĩa: luggage = suitcases = baggage."}]}, {"part": 1, "scene": "Một bàn ăn trong nhà hàng khách sạn đã bày sẵn đĩa, ly và khăn ăn gấp gọn. Không có người.", "sp": "N", "qs": [{"opts": ["A waiter is pouring some water.", "Some plates have been set on a table.", "Diners are looking at menus.", "Glasses are being washed in a sink."], "a": "B", "type": "L1-scene", "ex": "(B) 'have been set' = đã được bày (trạng thái). (A), (C) có người; (D) 'are being washed' cần người đang rửa.", "tip": "Ảnh vật không người: 'has/have been + V3' thường đúng; 'is/are being + V3' thường sai."}]}, {"part": 2, "q": "How long does the shuttle bus take to get to the airport?", "sp": ["M", "W"], "qs": [{"opts": ["About forty minutes.", "It's a long story.", "At the bus stop."], "a": "A", "type": "L2-wh", "ex": "How long → khoảng thời gian (A). (B) bẫy 'long', (C) trả lời WHERE.", "tip": "How long / How often / How much / How many: mỗi loại cần đúng kiểu số liệu."}]}, {"part": 2, "q": "Did you reserve a table for the client dinner?", "sp": ["W", "M"], "qs": [{"opts": ["The dinner was delicious.", "I'll do it right now.", "A table and four chairs."], "a": "B", "type": "L2-yn", "ex": "Câu hỏi Yes/No; (B) ngầm hiểu 'chưa, tôi sẽ đặt ngay'. (A) lặp 'dinner', (C) lặp 'table'.", "tip": "Câu Yes/No: đáp án đúng thường KHÔNG có Yes/No mà trả lời ngầm."}]}, {"part": 2, "q": "Which hotel are you staying at in Singapore?", "sp": ["M", "W"], "qs": [{"opts": ["For three nights.", "I'm staying until Friday.", "The one near the convention center."], "a": "C", "type": "L2-wh", "ex": "Which hotel → chỉ ra khách sạn nào: 'the one near...' (C). (A), (B) trả lời thời gian.", "tip": "Which + N → đáp án hay dùng 'The one...' / 'The ... one'."}]}, {"part": 2, "q": "Could you help me carry these boxes to the lobby?", "sp": ["W", "M"], "qs": [{"opts": ["Sure, where should I put them?", "In the box office.", "He helped yesterday."], "a": "A", "type": "L2-req", "ex": "Lời nhờ vả → đồng ý và hỏi thêm (A). (B) lặp 'box', (C) lặp 'help' và sai chủ ngữ.", "tip": "Could/Can/Would you...? (nhờ) → Sure / No problem / Sorry, I'm busy."}]}, {"part": 2, "q": "Isn't the museum closed on Mondays?", "sp": ["M", "W"], "qs": [{"opts": ["It's close to the station.", "Not during the summer season.", "I've been there twice."], "a": "B", "type": "L2-tag", "ex": "Hỏi 'bảo tàng đóng cửa thứ Hai đúng không?' → (B) 'mùa hè thì không'. (A) bẫy đồng âm 'closed – close'.", "tip": "Bẫy từ đồng âm/gần âm (close/closed, copy/coffee, fare/fair) rất phổ biến."}]}, {"part": 2, "q": "The flight to Tokyo has been delayed by two hours.", "sp": ["W", "M"], "qs": [{"opts": ["It's a long flight.", "Two tickets, please.", "Then we'll miss the opening session."], "a": "C", "type": "L2-stmt", "ex": "Báo tin chuyến bay trễ → phản ứng nêu hậu quả (C).", "tip": "Câu trần thuật: đáp án đúng có thể là hệ quả, cảm xúc, hoặc giải pháp."}]}, {"part": 2, "q": "Would you prefer a window seat or an aisle seat?", "sp": ["M", "W"], "qs": [{"opts": ["Either is fine with me.", "The window is open.", "Yes, I'd prefer that."], "a": "A", "type": "L2-choice", "ex": "Câu lựa chọn → 'Either' (cái nào cũng được). (C) Yes không hợp câu lựa chọn.", "tip": "Either / Neither / Whichever / I don't mind là đáp án quen thuộc của câu lựa chọn."}]}, {"part": 2, "q": "Why was the tour canceled?", "sp": ["W", "M"], "qs": [{"opts": ["On a guided tour.", "Not enough people signed up.", "I'll cancel it later."], "a": "B", "type": "L2-wh", "ex": "Why → lý do: không đủ người đăng ký (B), không cần 'Because'.", "tip": "Đáp án cho Why có thể KHÔNG có 'because' – chỉ cần nêu lý do."}]}, {"part": 3, "convo": [["M", "Good evening, welcome to the Bayside Hotel. Do you have a reservation?"], ["W", "Yes, under Elena Ruiz. I booked a room with an ocean view for three nights."], ["M", "Let me see. I'm afraid the ocean-view room we assigned you has a plumbing problem and is being repaired. But we can give you a suite on the top floor at the same rate."], ["W", "Oh, that sounds even better. Is breakfast included?"], ["M", "Yes, it's served from six-thirty to ten in the restaurant on the second floor. Here's your key card."]], "qs": [{"q": "Where does the conversation take place?", "opts": ["At a travel agency", "At a hotel", "At a restaurant", "At an airport"], "a": "B", "type": "L34-who", "ex": "'welcome to the Bayside Hotel… reservation… key card' → khách sạn.", "tip": "Nơi chốn: lời chào đầu tiên thường lộ đáp án."}, {"q": "Why can't the woman get the room she reserved?", "opts": ["It is being painted.", "It was given to another guest.", "Its view is blocked.", "It has a plumbing problem."], "a": "D", "type": "L34-detail", "ex": "'has a plumbing problem and is being repaired'.", "tip": "Câu Why: chờ các từ báo lý do: I'm afraid, unfortunately, because."}, {"q": "Where is breakfast served?", "opts": ["In the lobby", "On the top floor", "In a restaurant on the second floor", "In the guest's room"], "a": "C", "type": "L34-detail", "ex": "'served… in the restaurant on the second floor'. Bẫy: 'top floor' là vị trí phòng suite.", "tip": "Bài có 2 địa điểm → ghi chú nhanh cái nào gắn với cái gì."}]}, {"part": 3, "convo": [["W", "Thanks for meeting with us. Tom and I need to plan our trip to the trade fair in Berlin next month."], ["M", "Of course. Will you be traveling together?"], ["M2", "Yes, but I have to come back two days earlier for a client meeting."], ["M", "No problem. I can book separate return flights. Have you decided on accommodation?"], ["W", "We'd like something within walking distance of the exhibition center."], ["M", "There's a business hotel just across the street. I'll send you the details by e-mail this afternoon."]], "qs": [{"q": "What is the purpose of the trip?", "opts": ["To visit family", "To attend a trade fair", "To open an office", "To take a vacation"], "a": "B", "type": "L34-main", "ex": "'our trip to the trade fair in Berlin'.", "tip": "Hội thoại 3 người: đọc trước câu hỏi để biết cần chú ý ai (the woman / one of the men)."}, {"q": "Why will one of the men return early?", "opts": ["He has a client meeting.", "His ticket is cheaper.", "He feels ill.", "He has a training course."], "a": "A", "type": "L34-detail", "ex": "Tom: 'come back two days earlier for a client meeting'.", "tip": "'One of the men' → báo hiệu hội thoại 3 người, chú ý giọng nam thứ hai."}, {"q": "What does the travel agent say he will do?", "opts": ["Print boarding passes", "Call the hotel", "Reserve a rental car", "Send information by e-mail"], "a": "D", "type": "L34-next", "ex": "'I'll send you the details by e-mail this afternoon'.", "tip": "details → information (paraphrase)."}]}, {"part": 3, "convo": [["W", "Excuse me, I'd like to check in for my flight. Here's my passport."], ["M", "Thank you, Ms. Park. You're going to Tokyo, I see. Would you like to check any bags?"], ["W", "Just this one. Oh, and I heard there's a lounge for business-class passengers?"], ["M", "Yes, it's on the fourth floor, next to the duty-free shops. Here's your boarding pass. Please be at the gate thirty minutes before departure."]], "graphic": {"title": "Departures", "head": ["Flight", "Destination", "Time", "Gate"], "rows": [["TG 635", "Bangkok", "13:10", "C2"], ["JL 802", "Tokyo", "13:25", "C4"], ["SQ 879", "Singapore", "13:40", "C6"], ["CX 465", "Hong Kong", "13:55", "C8"]]}, "qs": [{"q": "Look at the graphic. Which gate will the woman go to?", "opts": ["C6", "C2", "C4", "C8"], "a": "C", "type": "L34-graphic", "ex": "Cô đi Tokyo → chuyến JL 802 → cổng C4.", "tip": "Nghe tên thành phố (cột được nhắc) → dò sang cột được hỏi (Gate)."}, {"q": "What does the woman ask about?", "opts": ["A lounge", "Baggage fees", "A refund", "Meal options"], "a": "A", "type": "L34-detail", "ex": "'I heard there's a lounge for business-class passengers?'", "tip": "Câu hỏi 'ask about' → nghe câu có dấu hỏi của nhân vật đó."}, {"q": "Look at the graphic. By what time should the woman be at the gate?", "opts": ["12:40", "12:55", "13:10", "13:25"], "a": "B", "type": "L34-graphic", "ex": "Khởi hành 13:25 − 30 phút = 12:55.", "tip": "Câu biểu đồ có tính toán: ghi lại con số trong lời nói (thirty minutes before) rồi tính."}]}, {"part": 4, "convo": [["N", "Good morning, everyone, and welcome to the Old Town walking tour. My name is Marco, and I'll be your guide today. We'll begin at the clock tower, which was built in 1842, then walk along the river to the historic market. The tour lasts about two hours, so please make sure you have water with you. Halfway through, we'll stop at a local café where you can try our famous almond pastries. They're included in the price of your ticket. Finally, please stay close to the group. The streets get very crowded on weekends."]], "qs": [{"q": "Who most likely is the speaker?", "opts": ["A shop owner", "A bus driver", "A tour guide", "A museum curator"], "a": "C", "type": "L34-who", "ex": "'I'll be your guide today'.", "tip": "Tự giới thiệu ở đầu bài nói → nghề nghiệp."}, {"q": "What is included in the ticket price?", "opts": ["A boat ride", "A pastry", "A souvenir", "Museum admission"], "a": "B", "type": "L34-detail", "ex": "'almond pastries… included in the price of your ticket'.", "tip": "included / free / at no cost → chú ý ngay."}, {"q": "Why does the speaker ask listeners to stay close to the group?", "opts": ["Some roads are closed.", "The tour is short.", "The weather is bad.", "The area is busy."], "a": "D", "type": "L34-detail", "ex": "'streets get very crowded' → khu vực đông đúc.", "tip": "crowded → busy (paraphrase)."}]}, {"part": 4, "convo": [["N", "Planning a getaway this winter? Skyline Airways is launching new nonstop flights between Taipei and Da Nang starting December first. To celebrate, round-trip tickets are available for just five thousand nine hundred ninety-nine dollars when you book through our mobile app by November fifteenth. App users also earn double reward points on every flight. Don't wait. Seats at this price are limited. Download the Skyline Airways app today."]], "qs": [{"q": "What is being advertised?", "opts": ["A hotel chain", "A new flight route", "A travel insurance plan", "A car rental service"], "a": "B", "type": "L34-main", "ex": "'launching new nonstop flights between Taipei and Da Nang'.", "tip": "Quảng cáo: sản phẩm/dịch vụ được nêu trong 2 câu đầu."}, {"q": "How can listeners get the special price?", "opts": ["By booking through an app by a deadline", "By visiting a ticket office", "By joining a travel club", "By buying two tickets"], "a": "A", "type": "L34-detail", "ex": "'book through our mobile app by November fifteenth'.", "tip": "by + ngày = hạn chót → deadline."}, {"q": "What does the speaker imply when she says, \"Seats at this price are limited\"?", "opts": ["The plane is small.", "Prices will drop soon.", "Listeners should book soon.", "Seats are uncomfortable."], "a": "C", "type": "L34-intent", "ex": "Đi kèm 'Don't wait' → khuyến khích đặt sớm.", "tip": "Hàm ý trong quảng cáo thường là thúc giục hành động ngay."}]}], "reading": [{"part": 5, "qs": [{"q": "Guests who wish to extend their stay should inform the front desk ______ 10 A.M. on the day of departure.", "opts": ["before", "between", "along", "within"], "a": "A", "type": "R5-prep", "ex": "before + mốc giờ = trước 10 giờ.", "tip": "within + khoảng (within 3 days); between A and B; before/after + mốc."}, {"q": "The hotel's renovated lobby has received ______ reviews from business travelers.", "opts": ["favor", "favorable", "favorably", "favoring"], "a": "B", "type": "R5-pos", "ex": "Trước danh từ 'reviews' cần tính từ → favorable.", "tip": "Động từ + ___ + danh từ → tính từ."}, {"q": "Ms. Wong asked her assistant to book ______ a seat on the earliest train to Kaohsiung.", "opts": ["she", "hers", "herself", "her"], "a": "D", "type": "R5-pron", "ex": "book + somebody + something; 'her' là tân ngữ chỉ Ms. Wong. 'herself' sai vì chủ ngữ của 'book' là assistant.", "tip": "Đại từ phản thân chỉ dùng khi chủ ngữ và tân ngữ là cùng một người."}, {"q": "Passengers are reminded that liquids over 100 ml are not ______ in carry-on bags.", "opts": ["agreed", "admitted", "permitted", "consented"], "a": "C", "type": "R5-vocab", "ex": "be permitted = được phép (mang theo).", "tip": "Từ vựng: allowed/permitted cho đồ vật; admitted cho người vào nơi nào đó."}, {"q": "The travel agency ______ its office in Hsinchu next spring.", "opts": ["will open", "opened", "has opened", "opening"], "a": "A", "type": "R5-verb", "ex": "'next spring' → tương lai.", "tip": "Tìm trạng từ thời gian trong câu trước khi xem đáp án."}, {"q": "______ the conference center nor the nearby hotels have enough parking spaces.", "opts": ["Either", "Both", "Neither", "Whether"], "a": "C", "type": "R5-conj", "ex": "Cặp liên từ: Neither ... nor.", "tip": "Thấy nor → Neither; or → Either/Whether; and → Both; but also → not only."}, {"q": "Room rates vary ______ on the season and the length of stay.", "opts": ["depend", "dependent", "dependence", "depending"], "a": "D", "type": "R5-pos", "ex": "'depending on' = tùy thuộc vào (cụm cố định).", "tip": "Học cụm: depending on, according to, regardless of, in addition to."}, {"q": "The cruise was so popular ______ the company added three more departures.", "opts": ["as", "that", "than", "which"], "a": "B", "type": "R5-conj", "ex": "Cấu trúc so + adj + that (quá... đến nỗi).", "tip": "so/such ... THAT; too ... TO."}, {"q": "Of all the resorts in the region, Palm Cove offers the ______ selection of water sports.", "opts": ["wide", "wider", "widely", "widest"], "a": "D", "type": "R5-comp", "ex": "'Of all... the ___' → so sánh nhất.", "tip": "the + ___ + of all / in the region → so sánh nhất."}, {"q": "The airline apologized for the delay and ______ each passenger a meal voucher.", "opts": ["offered", "offering", "to offer", "offers"], "a": "A", "type": "R5-verb", "ex": "Song hành với 'apologized' (quá khứ) qua 'and' → offered.", "tip": "Động từ nối bằng and/or/but phải cùng dạng (cấu trúc song hành)."}, {"q": "Tour participants ______ luggage exceeds 20 kg will be charged an additional fee.", "opts": ["who", "whose", "which", "whom"], "a": "B", "type": "R5-rel", "ex": "Sau chỗ trống là danh từ 'luggage' → whose (hành lý của người tham gia).", "tip": "___ + danh từ + động từ → whose."}]}, {"part": 6, "passages": [{"kind": "Letter", "meta": "SkyMiles Rewards Program", "body": "Dear Valued Member,\n\nThank you for being a loyal member of the SkyMiles Rewards program. We are writing to inform you of changes {{0}} will take effect on January 1. From that date, members will earn points based on the price of their ticket rather than the distance {{1}}. {{2}}\n\nIn addition, points will now {{3}} valid for 24 months instead of 18. For full details, please visit our Web site."}], "qs": [{"opts": ["who", "what", "where", "that"], "a": "D", "type": "R6-word", "ex": "Mệnh đề quan hệ bổ nghĩa 'changes' (vật) làm chủ ngữ → that/which.", "tip": "what không đứng sau danh từ."}, {"opts": ["flown", "flew", "flying", "flies"], "a": "A", "type": "R6-word", "ex": "'the distance (that is) flown' = quãng đường được bay → rút gọn bị động V3.", "tip": "Danh từ + V3 = rút gọn mệnh đề bị động."}, {"opts": ["Our new aircraft have larger seats.", "This means that higher-fare tickets will earn more points.", "Please arrive at the airport early.", "Membership fees will be refunded."], "a": "B", "type": "R6-sent", "ex": "Giải thích hệ quả của việc tính điểm theo giá vé → (B).", "tip": "Câu 'This means...' thường nối tiếp câu nêu thay đổi/quy định."}, {"opts": ["become", "remain", "keep", "last"], "a": "B", "type": "R6-word", "ex": "'remain valid' = vẫn còn hiệu lực.", "tip": "Collocation: remain valid / remain open / remain unchanged."}]}, {"part": 7, "passages": [{"kind": "Notice", "title": "Notice to Guests: Pool Maintenance", "body": "The rooftop pool will be closed from Tuesday, March 12, to Thursday, March 14, for scheduled cleaning and tile repairs. During this time, guests may use the indoor pool at our partner facility, Harbor Fitness Club, located across the street, free of charge. Simply show your room key at the reception desk. We apologize for any inconvenience."}], "qs": [{"q": "What is the purpose of the notice?", "opts": ["To advertise a fitness club", "To announce new opening hours", "To inform guests of a temporary closure", "To explain a price change"], "a": "C", "type": "R7-main", "ex": "Hồ bơi đóng cửa 3 ngày để bảo trì.", "tip": "Tiêu đề + câu đầu = mục đích."}, {"q": "How can guests use the Harbor Fitness Club?", "opts": ["By paying a fee", "By showing a room key", "By booking online", "By becoming members"], "a": "B", "type": "R7-detail", "ex": "'Simply show your room key at the reception desk'.", "tip": "Từ khóa câu hỏi (Harbor Fitness Club) → tìm câu chứa nó và câu kế tiếp."}]}, {"part": 7, "passages": [{"kind": "Online review", "title": "★★★★☆ Reviewed by Kevin Osei", "body": "I stayed at the Green Hill Lodge for four nights during a business trip. [1] The room was spotless, and the staff were incredibly helpful; they even arranged a late checkout for me at no charge. [2] My only complaint is the Wi-Fi, which was slow in the evenings when many guests were online. [3] Still, given its quiet location and reasonable price, I would definitely stay here again. [4]"}], "qs": [{"q": "Why did Mr. Osei stay at the lodge?", "opts": ["For a sports event", "For a family holiday", "For a wedding", "For work"], "a": "D", "type": "R7-detail", "ex": "'during a business trip' → vì công việc.", "tip": "business trip → for work (paraphrase)."}, {"q": "What problem does Mr. Osei mention?", "opts": ["Noisy neighbors", "A dirty room", "Slow internet", "High prices"], "a": "C", "type": "R7-detail", "ex": "'My only complaint is the Wi-Fi, which was slow'.", "tip": "Tín hiệu phàn nàn: complaint, however, unfortunately, the only problem."}, {"q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"The restaurant on the ground floor also serves an excellent breakfast.\"", "opts": ["[1]", "[2]", "[3]", "[4]"], "a": "B", "type": "R7-insert", "ex": "Câu chèn là một điểm KHEN với từ 'also' → đặt sau các lời khen (phòng, nhân viên), trước câu phàn nàn → [2].", "tip": "Từ 'also' báo hiệu câu chèn tiếp nối ý cùng tính chất ở câu trước."}]}, {"part": 7, "passages": [{"kind": "Web page", "title": "Asia Travel Tech Summit 2026", "meta": "Singapore Expo, Hall 3 | November 18–19", "body": "Registration\n• Standard Pass (both days): $420\n• One-Day Pass: $250\n• Student Pass (both days, valid student ID required): $150\n\nEarly-bird discount: 20% off Standard Passes purchased before October 31.\nGroup rate: Organizations registering 5 or more people receive one free Standard Pass."}, {"kind": "E-mail", "meta": "From: Priya Nair | To: summit-registration@atts.org | Date: October 28", "body": "Hello,\n\nI would like to register six members of our team at Wanderly Inc. for the full two-day event. Could you confirm whether we are still eligible for the early-bird price?\n\nAlso, one of our team members, Leo Tran, can attend only on November 19 because of a client visit. Should we register him separately?\n\nThank you,\nPriya Nair, Operations Manager"}], "qs": [{"q": "What is indicated about the summit?", "opts": ["It is held every year.", "It lasts two days.", "It is free for students.", "It takes place in October."], "a": "B", "type": "R7-detail", "ex": "November 18–19 → hai ngày.", "tip": "Loại đáp án không có căn cứ (every year) dù nghe hợp lý."}, {"q": "What does Ms. Nair ask about?", "opts": ["Eligibility for a discount", "A list of speakers", "Hotel options", "Parking"], "a": "A", "type": "R7-detail", "ex": "'confirm whether we are still eligible for the early-bird price'.", "tip": "Câu hỏi trong email (Could you...?) là đáp án cho 'ask about'."}, {"q": "What will Wanderly Inc. most likely receive?", "opts": ["A refund", "A free Standard Pass", "A student discount", "A free hotel night"], "a": "B", "type": "R7-cross", "ex": "Đăng ký 6 người (≥5) → được tặng 1 Standard Pass (web page).", "tip": "Câu liên kết: số liệu ở email (6 người) × điều kiện ở web (5+)."}, {"q": "Why can Mr. Tran attend only one day?", "opts": ["He is a student.", "He is giving a speech.", "He has a meeting with a client.", "He booked his flight late."], "a": "C", "type": "R7-detail", "ex": "'because of a client visit'.", "tip": "client visit → meeting with a client."}, {"q": "Which pass would Mr. Tran most likely need?", "opts": ["Standard Pass", "Student Pass", "Group Pass", "One-Day Pass"], "a": "D", "type": "R7-cross", "ex": "Chỉ dự 1 ngày → One-Day Pass.", "tip": "Đối chiếu nhu cầu ở văn bản 2 với lựa chọn ở văn bản 1."}]}]}, {"id": 3, "title": "Đề 3", "theme": "Sản xuất, y tế & môi trường", "listening": [{"part": 1, "scene": "Một công nhân đội mũ bảo hộ đang lái xe nâng, chở một pallet thùng hàng trong nhà kho; các kệ hai bên chất đầy thùng.", "sp": "N", "qs": [{"opts": ["Boxes are being unloaded from a truck.", "A worker is taking off his helmet.", "Some shelves are empty.", "A man is driving a forklift in a warehouse."], "a": "D", "type": "L1-person", "ex": "(D) đúng: lái xe nâng trong kho. (B) 'taking off' = đang tháo mũ (sai, anh ta đang đội). (C) kệ đầy hàng.", "tip": "Phân biệt wearing (trạng thái đang đội/mặc) và putting on / taking off (hành động đội vào/tháo ra)."}]}, {"part": 1, "scene": "Một nhà nghiên cứu nữ mặc áo blouse trắng đang nhìn vào kính hiển vi trong phòng thí nghiệm.", "sp": "N", "qs": [{"opts": ["She's looking into a microscope.", "She's washing some test tubes.", "She's writing on a whiteboard.", "She's putting on a lab coat."], "a": "A", "type": "L1-person", "ex": "(A) đúng hành động. (D) bẫy: cô ấy ĐANG MẶC sẵn áo (wearing), không phải đang mặc vào (putting on).", "tip": "Bẫy 'putting on' xuất hiện gần như mọi đề. Chỉ chọn khi người trong ảnh đang trong động tác mặc/đeo."}]}, {"part": 2, "q": "What time does the clinic open on Saturdays?", "sp": ["W", "M"], "qs": [{"opts": ["It's open.", "At eight-thirty.", "Yes, every Saturday."], "a": "B", "type": "L2-wh", "ex": "What time → giờ cụ thể (B). (A) lặp 'open'; (C) Yes cho câu WH.", "tip": "What time = When: chờ giờ/ngày."}]}, {"part": 2, "q": "Who's going to lead the factory inspection tomorrow?", "sp": ["M", "W"], "qs": [{"opts": ["Ms. Grant from headquarters.", "It was lead-free.", "Tomorrow at ten."], "a": "A", "type": "L2-wh", "ex": "Who → người (A). (B) bẫy 'lead' (dẫn dắt) / 'lead' (chì). (C) trả lời When.", "tip": "Who: tên người, chức danh, phòng ban (the HR department) đều có thể là đáp án."}]}, {"part": 2, "q": "Can you show me how to use the new scanner?", "sp": ["W", "M"], "qs": [{"opts": ["It's a new show.", "Yes, I scanned it.", "Sure, after my meeting."], "a": "C", "type": "L2-req", "ex": "Lời nhờ → đồng ý kèm điều kiện thời gian (C). (A), (B) lặp từ.", "tip": "Câu nhờ: 'Sure, but...', 'After lunch', 'I'm busy right now' đều là đáp án tiềm năng."}]}, {"part": 2, "q": "Do you know if the recycling bins have been emptied?", "sp": ["M", "W"], "qs": [{"opts": ["The cleaning crew comes on Thursdays.", "Yes, I know him.", "In the green bins."], "a": "A", "type": "L2-indirect", "ex": "Câu hỏi gián tiếp 'Do you know if...' → trọng tâm là thùng rác đã được đổ chưa; (A) trả lời gián tiếp. (B) chỉ trả lời 'Do you know'.", "tip": "Câu hỏi gián tiếp (Do you know/Can you tell me + if/wh-): tập trung vào phần SAU 'if/wh'."}]}, {"part": 2, "q": "You've worked in quality control before, haven't you?", "sp": ["W", "M"], "qs": [{"opts": ["Quality is important.", "Yes, at my previous company.", "I'll control it."], "a": "B", "type": "L2-tag", "ex": "Câu hỏi đuôi xác nhận kinh nghiệm → (B) Yes + bổ sung. (A), (C) lặp từ.", "tip": "Câu hỏi đuôi: trả lời như Yes/No thường, đáp án đúng hay có thông tin thêm."}]}, {"part": 2, "q": "Why is production behind schedule this week?", "sp": ["M", "W"], "qs": [{"opts": ["Behind the warehouse.", "The schedule is on the wall.", "One of the machines needs repairs."], "a": "C", "type": "L2-wh", "ex": "Why → lý do: máy cần sửa (C). (A) lặp 'behind', (B) lặp 'schedule'.", "tip": "Hai đáp án lặp từ thường để đánh lừa người nghe chậm → loại nhanh."}]}, {"part": 2, "q": "Should I book your appointment with Dr. Lee for Monday or Tuesday?", "sp": ["W", "M"], "qs": [{"opts": ["Monday works better for me.", "An annual checkup.", "Yes, she's a doctor."], "a": "A", "type": "L2-choice", "ex": "Lựa chọn → chọn một (A).", "tip": "'works better for me' / 'I'd prefer' = chọn một phương án."}]}, {"part": 2, "q": "The new solar panels have reduced our energy bills.", "sp": ["M", "W"], "qs": [{"opts": ["On the roof.", "That's great news.", "I'll pay the bill."], "a": "B", "type": "L2-stmt", "ex": "Báo tin tốt → phản ứng 'Tin tuyệt quá' (B). (A) trả lời Where, (C) lặp 'bill'.", "tip": "Câu trần thuật mang tin tốt/xấu → đáp án bày tỏ cảm xúc phù hợp."}]}, {"part": 3, "convo": [["W", "Riverside Medical Center, how may I help you?"], ["M", "Hi, I'd like to make an appointment with Dr. Chen for a checkup. I'm a new patient."], ["W", "Dr. Chen's first available slot is next Wednesday at 4:15. Would that be OK?"], ["M", "Hmm, I finish work at five."], ["W", "In that case, we also have evening appointments on Thursdays until eight."], ["M", "Thursday at six would be perfect."], ["W", "Great. Please arrive fifteen minutes early to fill out a registration form, and bring your insurance card."]], "qs": [{"q": "Who most likely is the woman?", "opts": ["A doctor", "A pharmacist", "A receptionist", "An insurance agent"], "a": "C", "type": "L34-who", "ex": "Nghe điện thoại, đặt lịch hẹn cho bác sĩ → lễ tân.", "tip": "Người nghe máy và nói tên tổ chức thường là lễ tân/nhân viên."}, {"q": "Why does the man say, \"I finish work at five\"?", "opts": ["He cannot come at the suggested time.", "He wants a longer appointment.", "He works near the clinic.", "He prefers morning appointments."], "a": "A", "type": "L34-intent", "ex": "Lịch đề xuất 4:15 nhưng anh làm đến 5 giờ → không đến được; người phụ nữ đề xuất giờ tối.", "tip": "Câu trích dẫn thường là lời từ chối KHÉO. Phản ứng sau đó ('In that case...') xác nhận hàm ý."}, {"q": "What is the man asked to bring?", "opts": ["A prescription", "A medical report", "A payment receipt", "An insurance card"], "a": "D", "type": "L34-do", "ex": "'bring your insurance card'.", "tip": "Yêu cầu nằm cuối bài: please arrive / bring..."}]}, {"part": 3, "convo": [["M", "Hi Rachel, did you see the report on the packaging line?"], ["W", "Yes. The new biodegradable wrapping is tearing more often than the plastic we used before."], ["M", "That's a problem. We've promised our retail clients that all packaging will be eco-friendly by January."], ["W", "Right. I've contacted the supplier, and they're sending a thicker version for testing next week."], ["M", "Good. Let's run a trial on Line 2 as soon as it arrives."]], "qs": [{"q": "What problem are the speakers discussing?", "opts": ["A late shipment", "Packaging material that tears", "A broken machine", "A client complaint"], "a": "B", "type": "L34-main", "ex": "'biodegradable wrapping is tearing more often'.", "tip": "Vấn đề được nêu ngay sau câu mở đầu."}, {"q": "What did the company promise its clients?", "opts": ["Lower prices", "Faster delivery", "Environmentally friendly packaging", "New product designs"], "a": "C", "type": "L34-detail", "ex": "'all packaging will be eco-friendly by January'.", "tip": "eco-friendly = environmentally friendly = green = sustainable."}, {"q": "According to the woman, what will happen next week?", "opts": ["A new material will arrive for testing.", "Line 2 will be shut down.", "Clients will visit the factory.", "A report will be published."], "a": "A", "type": "L34-detail", "ex": "'sending a thicker version for testing next week'.", "tip": "Chú ý mốc thời gian trong câu hỏi (next week)."}]}, {"part": 3, "convo": [["W", "I've been reviewing our energy usage for the first four months of the year."], ["M", "How does it look?"], ["W", "Mostly good. But one month was much higher than the others. That's when we ran the extra night shift to complete the large order for Polaris Motors."], ["M", "Right. Well, the lowest month came right after we replaced the old lights with LED lighting. Let's share those results at the staff meeting."], ["W", "Good idea. I'll make a chart for the presentation."]], "graphic": {"title": "Monthly Energy Use (kWh)", "head": ["Month", "Energy use"], "rows": [["January", "4,200"], ["February", "3,900"], ["March", "4,800"], ["April", "3,100"]]}, "qs": [{"q": "Look at the graphic. In which month did the company run an extra night shift?", "opts": ["January", "February", "March", "April"], "a": "C", "type": "L34-graphic", "ex": "Tháng cao nhất (4,800) là tháng chạy ca đêm → March.", "tip": "Biểu đồ: nghe tính từ so sánh (higher, lowest, most) rồi dò số liệu."}, {"q": "According to the man, what happened before the lowest month?", "opts": ["Staff hours were reduced.", "The factory closed for a week.", "An order was canceled.", "The lighting system was replaced."], "a": "D", "type": "L34-detail", "ex": "'replaced the old lights with LED lighting'.", "tip": "Đáp án paraphrase: LED lighting → lighting system."}, {"q": "What will the woman do?", "opts": ["Prepare a visual for a meeting", "Contact Polaris Motors", "Hire more workers", "Order new lights"], "a": "A", "type": "L34-next", "ex": "'I'll make a chart for the presentation'.", "tip": "chart → visual (paraphrase)."}]}, {"part": 4, "convo": [["N", "Welcome to Westfield Electronics. Before we begin our tour of the assembly plant, I'd like to go over a few safety rules. First, please wear the safety glasses and earplugs provided at all times on the factory floor. Second, photography is not allowed inside the building to protect our confidential product designs. Finally, stay inside the yellow lines painted on the floor. At the end of the tour, we'll gather in the visitor center, where you can see a display of our newest smart home devices."]], "qs": [{"q": "Where is the talk most likely taking place?", "opts": ["At a hospital", "At a manufacturing plant", "At a museum", "At a hardware store"], "a": "B", "type": "L34-who", "ex": "'tour of the assembly plant… factory floor' → nhà máy.", "tip": "assembly plant = factory = manufacturing plant."}, {"q": "Why is photography prohibited?", "opts": ["To avoid distractions", "For safety reasons", "To protect confidential designs", "To respect workers' privacy"], "a": "C", "type": "L34-detail", "ex": "'to protect our confidential product designs'.", "tip": "Bẫy: 'safety' được nhắc nhiều nhưng không phải lý do cấm chụp ảnh."}, {"q": "What will listeners see at the end of the tour?", "opts": ["A product display", "A training video", "A safety demonstration", "A new assembly line"], "a": "A", "type": "L34-detail", "ex": "'a display of our newest smart home devices'.", "tip": "At the end → câu cuối bài."}]}, {"part": 4, "convo": [["N", "Before we wrap up today's staff meeting, I have an exciting announcement. Starting next month, our company will offer a wellness program for all employees. It includes free yoga classes on Tuesday evenings and a monthly session with a nutritionist. We've also partnered with Fitzone Gym, so employees can get a membership at half the regular price. If you're interested, please sign up on the HR portal by Friday. Spaces in the yoga classes are limited to twenty people. And I know what you're thinking. Yes, family members can join the gym deal too."]], "qs": [{"q": "What is the speaker mainly announcing?", "opts": ["A gym opening", "A training course", "A schedule change", "A wellness program"], "a": "D", "type": "L34-main", "ex": "'our company will offer a wellness program'.", "tip": "Câu 'I have an announcement' → câu ngay sau là chủ đề."}, {"q": "What is offered at a discount?", "opts": ["Yoga classes", "Gym memberships", "Nutrition books", "Health checkups"], "a": "B", "type": "L34-detail", "ex": "'membership at half the regular price'. Bẫy: yoga là MIỄN PHÍ, không phải giảm giá.", "tip": "Phân biệt free (miễn phí) và discount/half price (giảm giá)."}, {"q": "Why does the speaker say, \"I know what you're thinking\"?", "opts": ["To answer an expected question", "To change the topic", "To apologize for a delay", "To end the meeting"], "a": "A", "type": "L34-intent", "ex": "Ngay sau đó cô trả lời câu hỏi mà nhân viên có thể thắc mắc (gia đình có được tham gia không).", "tip": "Câu trích dẫn ở cuối bài → nghe câu sau nó."}]}], "reading": [{"part": 5, "qs": [{"q": "Dr. Morales will ______ the results of the clinical trial at next week's conference.", "opts": ["present", "presence", "presentation", "presently"], "a": "A", "type": "R5-pos", "ex": "Sau 'will' cần động từ nguyên mẫu.", "tip": "Modal (will, can, must, should) + V nguyên mẫu."}, {"q": "The factory reduced its water consumption by ______ 40 percent last year.", "opts": ["near", "nearly", "nearest", "nearness"], "a": "B", "type": "R5-pos", "ex": "Trạng từ bổ nghĩa cho số → nearly (gần như).", "tip": "Trước con số: nearly, approximately, almost, roughly, about."}, {"q": "Patients must fill out the medical history form ______ seeing the doctor.", "opts": ["prior", "ahead", "before", "previous"], "a": "C", "type": "R5-prep", "ex": "before + V-ing. 'prior' cần 'to', 'ahead' cần 'of'.", "tip": "prior TO, ahead OF, before + N/V-ing."}, {"q": "The new filtering system is ______ efficient that it saves the plant thousands of dollars each month.", "opts": ["such", "very", "too", "so"], "a": "D", "type": "R5-conj", "ex": "so + adj + that.", "tip": "such + (a) adj + N + that; so + adj/adv + that."}, {"q": "All laboratory equipment ______ after each use.", "opts": ["cleans", "must be cleaned", "cleaning", "has cleaned"], "a": "B", "type": "R5-verb", "ex": "Thiết bị ĐƯỢC làm sạch, không có tân ngữ sau chỗ trống → bị động.", "tip": "Chủ ngữ là vật + không có tân ngữ phía sau → nghĩ ngay đến bị động."}, {"q": "Mr. Haddad and his team completed the safety audit by ______.", "opts": ["them", "their", "theirs", "themselves"], "a": "D", "type": "R5-pron", "ex": "by + oneself = tự làm, không cần giúp đỡ.", "tip": "by myself/themselves = một mình, tự lực."}, {"q": "The clinic's new appointment app allows patients to ______ their visits from their phones.", "opts": ["manage", "attend", "succeed", "agree"], "a": "A", "type": "R5-vocab", "ex": "manage visits = quản lý lịch hẹn. 'attend' không làm qua điện thoại; succeed/agree cần giới từ.", "tip": "Loại động từ nội động (cần giới từ) khi phía sau là tân ngữ trực tiếp."}, {"q": "Production will resume ______ the replacement parts arrive from Germany.", "opts": ["as soon as", "in order to", "because of", "in spite of"], "a": "A", "type": "R5-conj", "ex": "Sau chỗ trống là mệnh đề; nghĩa thời gian → as soon as.", "tip": "in order to + V; because of/in spite of + N; as soon as + mệnh đề."}, {"q": "The hospital is looking for a nurse ______ can speak both English and Mandarin.", "opts": ["whose", "who", "which", "whom"], "a": "B", "type": "R5-rel", "ex": "Thay cho người, theo sau là động từ → who.", "tip": "Người + động từ → who."}, {"q": "Sales of electric scooters have risen ______ since the government introduced new subsidies.", "opts": ["steady", "steadiness", "steadily", "steadied"], "a": "C", "type": "R5-pos", "ex": "Bổ nghĩa cho 'have risen' → trạng từ.", "tip": "rise/increase/grow + ADV (steadily, sharply, significantly)."}, {"q": "Ms. Kowalski ______ at the plant for ten years when she was promoted to director.", "opts": ["works", "has worked", "had worked", "will work"], "a": "C", "type": "R5-verb", "ex": "Hành động kéo dài trước một mốc quá khứ (was promoted) → quá khứ hoàn thành.", "tip": "for + khoảng + when + QKĐ → had V3."}]}, {"part": 6, "passages": [{"kind": "Memo", "meta": "To: All Production Staff | Subject: New Waste Sorting Policy", "body": "In line with our commitment to sustainability, Kestrel Manufacturing will introduce a new waste sorting policy on June 1. Separate bins for plastic, metal, and general waste will be placed at each workstation. Employees are {{0}} to sort their waste before leaving their shifts. {{1}} Training sessions will be held next week to explain the new procedures.\n\n{{2}} you have questions about the policy, please contact Ms. Abebe in the Environmental Department. We believe these changes will help us reach our goal of {{3}} landfill waste by 50 percent by 2028."}], "qs": [{"opts": ["expect", "expecting", "expected", "expectation"], "a": "C", "type": "R6-word", "ex": "be expected to V = được yêu cầu/mong đợi làm gì.", "tip": "be expected / required / asked / encouraged + to V."}, {"opts": ["The cafeteria menu will change next month.", "Supervisors will check the bins at the end of each day.", "Our sales rose sharply last year.", "New uniforms have been ordered."], "a": "B", "type": "R6-sent", "ex": "Câu trước nói về việc phân loại rác → câu tiếp nói về giám sát việc phân loại, cùng chủ đề.", "tip": "Loại các câu lạc đề (thực đơn, doanh số, đồng phục)."}, {"opts": ["Unless", "Whether", "If", "Although"], "a": "C", "type": "R6-word", "ex": "'Nếu bạn có câu hỏi, hãy liên hệ…' → If.", "tip": "Câu điều kiện + mệnh lệnh: If you have questions, please contact..."}, {"opts": ["reduce", "reducing", "reduced", "reduction"], "a": "B", "type": "R6-word", "ex": "Sau giới từ 'of' và có tân ngữ 'landfill waste' → V-ing.", "tip": "Giới từ + V-ing (khi phía sau có tân ngữ)."}]}, {"part": 7, "passages": [{"kind": "Text-message chain", "body": "Hannah Ortiz [2:05 P.M.]: The inspector from the health department will be here at 3:00 instead of 4:00.\nRaj Mehta [2:06 P.M.]: Seriously? The storage room isn't ready yet.\nHannah Ortiz [2:07 P.M.]: I'll send two people from the kitchen to help you.\nRaj Mehta [2:08 P.M.]: Thanks. With extra hands, we should be done in thirty minutes."}], "qs": [{"q": "What is the problem?", "opts": ["A delivery is late.", "An inspection will happen earlier than planned.", "Some staff members are absent.", "A storage room is damaged."], "a": "B", "type": "R7-main", "ex": "Thanh tra đến lúc 3:00 thay vì 4:00 → sớm hơn.", "tip": "instead of + mốc thời gian → thay đổi lịch."}, {"q": "At 2:06 P.M., why does Mr. Mehta write, \"Seriously?\"", "opts": ["He doubts Ms. Ortiz's honesty.", "He is making a joke.", "He is worried about not being ready.", "He wants to confirm a name."], "a": "C", "type": "R7-intent", "ex": "Câu ngay sau: 'The storage room isn't ready yet' → lo lắng vì chưa chuẩn bị xong.", "tip": "Ý định của câu cảm thán được giải thích bởi câu NGAY SAU của chính người đó."}]}, {"part": 7, "passages": [{"kind": "Article", "title": "Local Clinic Goes Green", "body": "HARBOR CITY — Bayview Community Clinic has become the first medical facility in the region to run entirely on renewable energy. The clinic installed 220 solar panels on its roof and parking structure in July.\n\n\"The panels generate more power than we need on sunny days, so we sell the extra electricity back to
