 appreciate it if it could be waived, since this is my first time canceling. Also, my insurance provider changed this month, so I will bring my new card.\n\nMia Torres"}], "vocab": [["in advance", "trước"], ["waive a fee", "miễn phí (bỏ qua khoản phí)"], ["insurance provider", "công ty bảo hiểm"]], "qs": [{"q": "What is stated in the policy?", "opts": ["Patients should arrive ahead of time.", "Insurance is not accepted.", "Appointments last 15 minutes.", "Questionnaires must be completed on paper."], "a": "A", "type": "R7-detail", "vi": "Quy định nêu điều gì? → Bệnh nhân nên đến sớm.", "ex": "'arrive 10 minutes before your scheduled time'.", "elim": "(B) ngược. (C) 15 phút là mức trễ tối đa. (D) điền online.", "tip": "before your scheduled time → ahead of time."}, {"q": "Why does Ms. Torres want to reschedule?", "opts": ["She feels sick.", "She is traveling.", "She has a business meeting.", "Her car broke down."], "a": "C", "type": "R7-detail", "vi": "Vì sao cô Torres muốn đổi lịch? → Cô có cuộc họp công việc.", "ex": "'attend an urgent business meeting'.", "elim": "Không có lý do khác.", "tip": "Unfortunately + lý do."}, {"q": "What is most likely true about Ms. Torres's request?", "opts": ["She is a new patient.", "A fee may apply.", "Her insurance covers the cancellation.", "She must arrive 15 minutes early."], "a": "B", "type": "R7-cross", "vi": "Điều gì có lẽ đúng về yêu cầu của cô? → Có thể bị tính phí.", "ex": "Email lúc 9 giờ sáng cho lịch 2 giờ chiều cùng ngày → chưa đủ 24 giờ → hủy muộn ($30).", "elim": "(A) cô đã từng hủy, có thẻ bảo hiểm cũ → không phải bệnh nhân mới.", "tip": "Câu liên kết có tính thời gian: so giờ gửi email với quy định 24 giờ."}, {"q": "What does Ms. Torres ask the clinic to do?", "opts": ["Send her a questionnaire", "Accept her old insurance card", "Call her back", "Not charge the cancellation fee"], "a": "D", "type": "R7-detail", "vi": "Cô Torres đề nghị phòng khám làm gì? → Không tính phí hủy lịch.", "ex": "'I would appreciate it if it could be waived'.", "elim": "(B) cô sẽ mang thẻ mới.", "tip": "waive = not charge."}, {"q": "What is indicated about Ms. Torres?", "opts": ["She has changed insurance companies.", "She has canceled before.", "She works at the clinic.", "She completed a questionnaire today."], "a": "A", "type": "R7-detail", "vi": "Thông tin đúng về cô Torres? → Cô đã đổi công ty bảo hiểm.", "ex": "'my insurance provider changed this month'.", "elim": "(B) đây là lần đầu cô hủy.", "tip": "Bẫy phủ định: 'first time canceling' loại (B)."}]}]}, {"id": 10, "title": "Đề 10", "theme": "Tổng hợp tần suất cao (mức khó)", "focus": true, "listening": [{"part": 1, "scene": "Hai người đàn ông đang cùng khiêng một chiếc bàn gỗ qua cửa ra vào của một tòa nhà.", "sp": "N", "vocab": [["doorway", "khung cửa, lối ra vào"], ["assemble", "lắp ráp"], ["carry", "khiêng, mang"]], "qs": [{"opts": ["They're assembling a table.", "They're moving a table through a doorway.", "They're sitting at a table.", "They're painting a door."], "a": "B", "type": "L1-person", "vi": "(B) Họ đang di chuyển chiếc bàn qua lối cửa.", "ex": "'moving... through a doorway' mô tả đúng hành động hai người.", "elim": "(A) lắp ráp ≠ khiêng. (C) không ngồi. (D) không sơn cửa.", "tip": "Đáp án đúng thường dùng động từ khái quát (moving) thay cho động từ cụ thể (carrying)."}]}, {"part": 1, "scene": "Một bến tàu không người: nhiều thuyền nhỏ neo dọc cầu tàu, mặt nước phẳng lặng.", "sp": "N", "vocab": [["dock (v)", "neo đậu"], ["pier", "cầu tàu"], ["shore", "bờ"]], "qs": [{"opts": ["People are fishing from a pier.", "A boat is sailing under a bridge.", "Some boats are docked along a pier.", "Waves are crashing onto the shore."], "a": "C", "type": "L1-scene", "vi": "(C) Vài chiếc thuyền đang neo dọc cầu tàu.", "ex": "Trạng thái thuyền neo khớp ảnh.", "elim": "(A) không người. (B) không có thuyền chạy. (D) nước phẳng lặng.", "tip": "Ảnh cảnh ngoài trời (bến tàu, công viên) có tỉ lệ khoảng 1–2 câu mỗi đề."}]}, {"part": 2, "q": "When will the revised budget be ready?", "sp": ["W", "M"], "vocab": [["revised budget", "ngân sách đã điều chỉnh"]], "qs": [{"opts": ["The finance team is still working on it.", "It was ready to go.", "By bus."], "a": "A", "type": "L2-wh", "vi": "Khi nào ngân sách điều chỉnh xong? → Phòng tài chính vẫn đang làm.", "ex": "Trả lời gián tiếp 'chưa biết' (A).", "elim": "(B) lặp 'ready'. (C) trả lời How.", "tip": "Mức khó: đáp án When không chứa mốc thời gian nào."}]}, {"part": 2, "q": "Which supplier did you choose for the office furniture?", "sp": ["M", "W"], "vocab": [["supplier", "nhà cung cấp"], ["installation", "lắp đặt"]], "qs": [{"opts": ["A chair and a desk.", "The one with free installation.", "I chose to stay."], "a": "B", "type": "L2-wh", "vi": "Bạn chọn nhà cung cấp nào cho nội thất văn phòng? → Nhà cung cấp lắp đặt miễn phí.", "ex": "Which → 'The one...' (B).", "elim": "(A) lặp chủ đề furniture. (C) lặp 'chose'.", "tip": "Which ... ? → The one that/with..."}]}, {"part": 2, "q": "You're presenting at the conference next week, aren't you?", "sp": ["W", "M"], "vocab": [["present", "thuyết trình"], ["opening day", "ngày khai mạc"]], "qs": [{"opts": ["A conference call.", "A nice present.", "Yes, on the opening day."], "a": "C", "type": "L2-tag", "vi": "Tuần sau bạn thuyết trình ở hội nghị đúng không? → Đúng, vào ngày khai mạc.", "ex": "Xác nhận kèm thông tin thêm (C).", "elim": "(A) lặp 'conference'. (B) 'present' nghĩa quà.", "tip": "present (v) thuyết trình / present (n) quà: bẫy đa nghĩa."}]}, {"part": 2, "q": "I can't find the file for the Lambert account.", "sp": ["M", "W"], "vocab": [["shared drive", "ổ đĩa dùng chung"], ["account", "khách hàng/hồ sơ khách hàng"]], "qs": [{"opts": ["Isn't it in the shared drive?", "I counted them twice.", "The file cabinet is new."], "a": "A", "type": "L2-stmt", "vi": "Tôi không tìm thấy hồ sơ khách hàng Lambert. → Không phải nó ở ổ đĩa chung sao?", "ex": "Phản hồi bằng câu hỏi gợi ý chỗ tìm (A).", "elim": "(B) gần âm 'account – counted'. (C) lặp 'file'.", "tip": "Câu trần thuật về việc không tìm thấy → đáp án gợi ý nơi tìm bằng câu hỏi phủ định."}]}, {"part": 2, "q": "How about meeting at the café across the street?", "sp": ["W", "M"], "vocab": [["How about...?", "Thế còn... thì sao? (gợi ý)"]], "qs": [{"opts": ["It's across from the bank.", "Sure, that's a nice place.", "About an hour."], "a": "B", "type": "L2-req", "vi": "Gặp nhau ở quán cà phê bên kia đường nhé? → Được, chỗ đó đẹp đấy.", "ex": "'How about...' là gợi ý, không hỏi 'thế nào' → đồng ý (B).", "elim": "(A) lặp 'across'. (C) trả lời How long.", "tip": "How about/What about + V-ing/N = gợi ý."}]}, {"part": 2, "q": "Do you want me to reserve a room, or will you do it?", "sp": ["M", "W"], "vocab": [["take care of", "lo liệu"]], "qs": [{"opts": ["Yes, I reserved it.", "The room is large.", "I'll take care of it."], "a": "C", "type": "L2-choice", "vi": "Tôi đặt phòng hay bạn đặt? → Tôi sẽ lo.", "ex": "Chọn phương án 2 (C).", "elim": "(A) Yes + quá khứ. (B) lặp 'room'.", "tip": "Câu lựa chọn giữa người (I or you) → 'I'll handle it / Could you?'."}]}, {"part": 2, "q": "Why hasn't the new printer been installed?", "sp": ["W", "M"], "vocab": [["install", "lắp đặt"], ["technician", "kỹ thuật viên"]], "qs": [{"opts": ["The technician is coming tomorrow.", "It prints in color.", "In the copy room."], "a": "A", "type": "L2-wh", "vi": "Sao máy in mới chưa được lắp? → Ngày mai thợ mới đến.", "ex": "Lý do ngầm (A).", "elim": "(B) lặp gốc 'print'. (C) Where.", "tip": "Why hasn't... → đáp án là lý do/kế hoạch."}]}, {"part": 2, "q": "The client meeting has been moved to the Seoul office.", "sp": ["M", "W"], "vocab": [["book a flight", "đặt vé máy bay"]], "qs": [{"opts": ["I moved last year.", "Then I'd better book a flight.", "A meeting with clients."], "a": "B", "type": "L2-stmt", "vi": "Cuộc họp với khách đã chuyển sang văn phòng Seoul. → Vậy tôi nên đặt vé máy bay.", "ex": "Phản ứng hệ quả hợp lý (B).", "elim": "(A) lặp 'moved'. (C) lặp 'meeting', 'client'.", "tip": "'Then...' cho câu trần thuật = mẫu đáp án đúng đáng tin cậy."}]}, {"part": 3, "convo": [["W", "OK, the annual sales conference is in six weeks. Where are we with the keynote speaker?"], ["M", "Dr. Feng confirmed this morning. She'll speak on the first day."], ["M2", "That's great news, but she's asked for a larger room. She expects a lot of questions and wants to do a live demonstration."], ["W", "Can the hotel give us the main hall?"], ["M2", "I'll call them this afternoon."], ["M", "And I'll update the program and send it to the printer."]], "vocab": [["keynote speaker", "diễn giả chính"], ["live demonstration", "trình diễn trực tiếp"], ["program", "chương trình (in)"]], "qs": [{"q": "What event are the speakers planning?", "opts": ["A product launch", "A trade fair", "A training course", "A sales conference"], "a": "D", "type": "L34-main", "vi": "Họ đang lên kế hoạch gì? → Hội nghị bán hàng.", "ex": "'the annual sales conference'.", "elim": "Không có sự kiện khác.", "tip": "Câu đầu nêu sự kiện."}, {"q": "What did Dr. Feng request?", "opts": ["A bigger room", "An earlier time slot", "A projector", "A list of attendees"], "a": "A", "type": "L34-detail", "vi": "Tiến sĩ Feng yêu cầu gì? → Phòng lớn hơn.", "ex": "'she's asked for a larger room'.", "elim": "(C) trình diễn trực tiếp không đồng nghĩa với yêu cầu máy chiếu.", "tip": "larger → bigger."}, {"q": "What will one of the men do this afternoon?", "opts": ["Print the program", "Call a hotel", "Meet Dr. Feng", "Cancel a session"], "a": "B", "type": "L34-next", "vi": "Một trong hai người đàn ông chiều nay sẽ làm gì? → Gọi khách sạn.", "ex": "'I'll call them (the hotel) this afternoon'.", "elim": "(A) người kia gửi chương trình cho nhà in, không gắn 'this afternoon'.", "tip": "Hội thoại 3 người: hai người cùng nói 'I'll...' → bám mốc thời gian trong câu hỏi."}]}, {"part": 3, "convo": [["M", "Ms. Ahmed, the new receptionist starts on Monday. Should I order her a laptop?"], ["W", "We have a few extra laptops in the storage room."], ["M", "Those are five years old."], ["W", "Hmm, you're right. Go ahead and order a new one, but get the model we bought for the design team. It comes with a three-year warranty."], ["M", "OK. I'll place the order today so it arrives in time."]], "vocab": [["warranty", "bảo hành"], ["place an order", "đặt hàng"], ["in time", "kịp lúc"]], "qs": [{"q": "Who is starting work on Monday?", "opts": ["A designer", "A technician", "A receptionist", "A manager"], "a": "C", "type": "L34-detail", "vi": "Ai bắt đầu làm vào thứ Hai? → Lễ tân mới.", "ex": "'the new receptionist starts on Monday'.", "elim": "(A) design team chỉ là nơi từng mua máy.", "tip": "Bẫy: nghề được nhắc phụ (design team)."}, {"q": "What does the man imply when he says, \"Those are five years old\"?", "opts": ["The extra laptops are outdated.", "The laptops are still under warranty.", "He bought them himself.", "The storage room is full."], "a": "A", "type": "L34-intent", "vi": "'Mấy cái đó 5 năm rồi' → Máy dự phòng đã lỗi thời.", "ex": "Phản bác gợi ý dùng máy cũ; người phụ nữ đồng ý mua máy mới.", "elim": "(B) ngược.", "tip": "Câu nêu sự thật ngắn = phản đối khéo một gợi ý."}, {"q": "Why does the woman recommend a specific model?", "opts": ["It is the cheapest.", "It is the lightest.", "It is in stock.", "It comes with an extended warranty."], "a": "D", "type": "L34-detail", "vi": "Vì sao cô gợi ý mẫu máy cụ thể? → Có bảo hành dài.", "ex": "'It comes with a three-year warranty'.", "elim": "Các lý do khác không nhắc.", "tip": "three-year warranty → extended warranty."}]}, {"part": 3, "convo": [["W", "Our meeting with the client in Taichung starts at ten thirty. Which train should we take?"], ["M", "The eight thirty would get us there with plenty of time."], ["W", "I'd rather leave a bit later. I have to drop off some documents at the post office first."], ["M", "OK, then let's take the next one after that. It still gets in before the meeting."], ["W", "Good. I'll buy the tickets online now."]], "graphic": {"title": "Trains to Taichung", "head": ["Train", "Departs", "Arrives"], "rows": [["101", "08:00", "09:05"], ["103", "08:30", "09:50"], ["105", "09:00", "10:05"], ["107", "09:30", "10:50"]]}, "vocab": [["drop off", "gửi, để lại"], ["get in", "đến nơi"], ["plenty of time", "dư dả thời gian"]], "qs": [{"q": "Why does the woman want to leave later?", "opts": ["To have breakfast", "To go to the post office", "To call the client", "To print some slides"], "a": "B", "type": "L34-detail", "vi": "Vì sao cô muốn đi muộn hơn? → Để đến bưu điện.", "ex": "'drop off some documents at the post office first'.", "elim": "Không có lý do khác.", "tip": "I'd rather... + lý do ngay sau."}, {"q": "Look at the graphic. Which train will the speakers take?", "opts": ["Train 101", "Train 103", "Train 105", "Train 107"], "a": "C", "type": "L34-graphic", "vi": "Họ sẽ đi chuyến nào? → Chuyến 105.", "ex": "Chuyến kế tiếp sau 8:30 là 9:00 (105), đến 10:05, trước giờ họp 10:30.", "elim": "(B) bị từ chối. (D) đến 10:50, trễ họp.", "tip": "Bẫy 'the next one after that': phải xác định 'that' là chuyến nào."}, {"q": "What will the woman do next?", "opts": ["Purchase tickets online", "Call a taxi", "Go to the station", "Print documents"], "a": "A", "type": "L34-next", "vi": "Người phụ nữ sẽ làm gì tiếp? → Mua vé online.", "ex": "'I'll buy the tickets online now'.", "elim": "Các việc khác không nhắc.", "tip": "buy → purchase."}]}, {"part": 4, "convo": [["N", "Good evening, and thank you all for coming to our annual awards dinner. This year, our company reached a milestone: we delivered over one million orders, a record for us. None of this would be possible without our warehouse and delivery teams, who worked extra shifts during the holiday season. Tonight's first award goes to someone who designed the new route-planning system that cut our delivery times by twenty percent. Now, she's going to say it was a team effort. Please welcome Hana Sato to the stage."]], "vocab": [["milestone", "cột mốc"], ["route-planning system", "hệ thống lập lộ trình"], ["team effort", "nỗ lực tập thể"]], "qs": [{"q": "What is the purpose of the event?", "opts": ["To launch a product", "To honor employees", "To welcome new staff", "To celebrate a store opening"], "a": "B", "type": "L34-main", "vi": "Mục đích sự kiện? → Vinh danh nhân viên.", "ex": "'annual awards dinner'.", "elim": "Không có ra mắt hay khai trương.", "tip": "awards ↔ honor/recognize."}, {"q": "What did the company achieve this year?", "opts": ["It opened a new warehouse.", "It expanded overseas.", "It won a government contract.", "It delivered a record number of orders."], "a": "D", "type": "L34-detail", "vi": "Năm nay công ty đạt được gì? → Giao số đơn kỷ lục.", "ex": "'delivered over one million orders, a record for us'.", "elim": "Không nhắc mở kho hay mở rộng.", "tip": "milestone/record → đáp án thành tích."}, {"q": "Why does the speaker say, \"she's going to say it was a team effort\"?", "opts": ["To suggest that Ms. Sato is modest", "To correct an earlier statement", "To introduce another team", "To explain a delay"], "a": "A", "type": "L34-intent", "vi": "Vì sao người nói nói 'cô ấy sẽ bảo đó là công sức cả đội'? → Ngụ ý cô Sato khiêm tốn.", "ex": "Dự đoán người nhận giải sẽ chia công cho cả nhóm → tính khiêm tốn.", "elim": "(B), (C), (D) không có căn cứ.", "tip": "Câu đoán trước lời người khác thường nói về tính cách của họ."}]}, {"part": 4, "convo": [["N", "This is Radio one-oh-one with your weekend event update. The Harborfest celebration kicks off this Friday. Because heavy rain is expected on Saturday, organizers have decided to switch Saturday's event with Sunday's, since Sunday's event can be held indoors at the exhibition center. All other events remain as scheduled. Free shuttle buses will run from Central Station every fifteen minutes. And remember, parking near the harbor will be very limited, so public transportation is strongly recommended."]], "graphic": {"title": "Harborfest Schedule", "head": ["Day", "Event", "Location"], "rows": [["Friday", "Opening concert", "Main Stage"], ["Saturday", "Food market", "Riverside Park"], ["Sunday", "Craft fair", "City Square"], ["Monday", "Closing parade", "Harbor Road"]]}, "vocab": [["kick off", "khởi động, bắt đầu"], ["switch", "hoán đổi"], ["as scheduled", "theo lịch"]], "qs": [{"q": "Look at the graphic. Which event will take place on Saturday?", "opts": ["Opening concert", "Food market", "Craft fair", "Closing parade"], "a": "C", "type": "L34-graphic", "vi": "Sự kiện nào diễn ra thứ Bảy? → Hội chợ thủ công.", "ex": "Sự kiện thứ Bảy và Chủ nhật hoán đổi → thứ Bảy là Craft fair.", "elim": "(B) bẫy: là lịch gốc.", "tip": "Câu biểu đồ có thay đổi lịch: đáp án KHÁC với bảng gốc."}, {"q": "What will be available from Central Station?", "opts": ["Parking passes", "A free shuttle service", "Discounted tickets", "Event maps"], "a": "B", "type": "L34-detail", "vi": "Ga trung tâm có gì? → Xe đưa đón miễn phí.", "ex": "'Free shuttle buses will run from Central Station'.", "elim": "(A) bãi đỗ rất hạn chế.", "tip": "shuttle buses → shuttle service."}, {"q": "What does the speaker recommend?", "opts": ["Arriving early", "Buying tickets in advance", "Bringing umbrellas", "Taking public transportation"], "a": "D", "type": "L34-do", "vi": "Người nói khuyên gì? → Đi phương tiện công cộng.", "ex": "'public transportation is strongly recommended'.", "elim": "(C) mưa nhưng không khuyên mang ô.", "tip": "recommended → recommend: khớp động từ trong câu hỏi."}]}], "reading": [{"part": 5, "qs": [{"q": "The new procedures are designed to make the approval process more ______.", "opts": ["efficiency", "efficiently", "efficiencies", "efficient"], "a": "D", "type": "R5-pos", "vi": "Quy trình mới nhằm giúp việc phê duyệt hiệu quả hơn.", "ex": "make + O + more + tính từ.", "elim": "(B) trạng từ; (A), (C) danh từ.", "tip": "more + ___ ở cuối cụm 'make sth' → tính từ."}, {"q": "Applicants must submit their portfolios no later ______ March 31.", "opts": ["than", "by", "until", "to"], "a": "A", "type": "R5-prep", "vi": "Ứng viên phải nộp hồ sơ năng lực không muộn hơn ngày 31/3.", "ex": "Cụm cố định 'no later than'.", "elim": "by/until không đi sau 'later'.", "tip": "no later than = by."}, {"q": "The board of directors ______ the merger proposal at its next meeting.", "opts": ["to discuss", "discussing", "will discuss", "discussion"], "a": "C", "type": "R5-verb", "vi": "Hội đồng quản trị sẽ thảo luận đề xuất sáp nhập ở cuộc họp tới.", "ex": "Câu thiếu động từ chính; 'next meeting' → tương lai.", "elim": "(A), (B) không phải động từ chính. (D) danh từ.", "tip": "Câu thiếu động từ → chỉ còn đáp án có động từ chia."}, {"q": "Ms. Romero has been working ______ on the annual report all week.", "opts": ["diligent", "diligence", "more diligent", "diligently"], "a": "D", "type": "R5-pos", "vi": "Cô Romero đã làm việc chăm chỉ với báo cáo thường niên cả tuần.", "ex": "Bổ nghĩa cho 'working' → trạng từ.", "elim": "Các đáp án còn lại là tính từ/danh từ.", "tip": "work/perform/respond + ADV."}, {"q": "______ receiving the invoice, please make payment within 30 days.", "opts": ["Upon", "Since", "While", "Until"], "a": "A", "type": "R5-prep", "vi": "Ngay khi nhận hóa đơn, vui lòng thanh toán trong vòng 30 ngày.", "ex": "Upon + V-ing = ngay khi.", "elim": "Since/Until sai nghĩa; While + V-ing = trong khi đang (không hợp).", "tip": "Upon/On + V-ing/N = ngay khi."}, {"q": "The renovation of the lobby is expected to be completed ______ the end of the month.", "opts": ["until", "by", "since", "for"], "a": "B", "type": "R5-prep", "vi": "Việc cải tạo sảnh dự kiến hoàn thành trước cuối tháng.", "ex": "Hoàn thành trước hạn → by.", "elim": "until sai vì 'complete' là hành động hoàn tất.", "tip": "be completed/finished/submitted + BY."}, {"q": "Only employees ______ have completed safety training may operate the machinery.", "opts": ["who", "whose", "which", "whoever"], "a": "A", "type": "R5-rel", "vi": "Chỉ nhân viên đã hoàn thành huấn luyện an toàn mới được vận hành máy.", "ex": "Người + động từ 'have completed' → who.", "elim": "(B) cần danh từ theo sau. (D) không đi sau danh từ.", "tip": "whoever = bất kỳ ai, không đứng sau danh từ."}, {"q": "The conference attracted a ______ number of participants this year.", "opts": ["remark", "remarkable", "remarkably", "remarking"], "a": "B", "type": "R5-pos", "vi": "Hội nghị năm nay thu hút số người tham gia đáng kể.", "ex": "Trước danh từ 'number' → tính từ.", "elim": "(C) trạng từ không bổ nghĩa cho danh từ.", "tip": "a + ___ + number of → tính từ (record, large, remarkable)."}, {"q": "Once the contract ______, the project can begin.", "opts": ["signs", "will sign", "is signed", "signing"], "a": "C", "type": "R5-verb", "vi": "Khi hợp đồng được ký, dự án có thể bắt đầu.", "ex": "Hợp đồng ĐƯỢC ký → bị động; mệnh đề Once dùng hiện tại.", "elim": "(A) chủ động sai nghĩa. (B) không dùng will sau Once.", "tip": "Hai bẫy trong một câu: bị động + không dùng 'will' sau once/when/if."}, {"q": "Mr. Tanaka could not attend the workshop, so he asked a colleague to take notes on ______ of him.", "opts": ["place", "behalf", "account", "part"], "a": "B", "type": "R5-vocab", "vi": "Ông Tanaka không dự hội thảo nên nhờ đồng nghiệp ghi chép thay mình.", "ex": "Cụm 'on behalf of' = thay mặt.", "elim": "'on account of' = vì; 'in place of' đúng nhưng cần 'in'.", "tip": "Cụm cố định: on behalf of, in place of, on account of, in charge of."}, {"q": "______ the price increase, demand for the product remained strong.", "opts": ["Although", "Unless", "Despite", "Because"], "a": "C", "type": "R5-conj", "vi": "Mặc dù tăng giá, nhu cầu sản phẩm vẫn mạnh.", "ex": "Cụm danh từ + nhượng bộ → Despite.", "elim": "(A), (B), (D) cần mệnh đề.", "tip": "Despite/Although xuất hiện ở gần như mọi đề Part 5."}]}, {"part": 6, "passages": [{"kind": "E-mail", "meta": "From: CloudDesk | To: Valued Clients | Subject: Version 5.0 is coming", "body": "Dear Valued Client,\n\nWe are writing to let you know that CloudDesk will release version 5.0 on September 15. This update includes a redesigned dashboard and an AI assistant that can {{0}} summarize meeting notes. {{1}}\n\nTo ensure a smooth transition, we will hold free online training sessions every Tuesday in September. Space is limited, so we encourage you to register {{2}}. Customers on our Premium plan will also receive one-on-one support {{3}} the first month after the update."}], "vocab": [["release", "phát hành"], ["smooth transition", "chuyển đổi suôn sẻ"], ["one-on-one support", "hỗ trợ trực tiếp từng người"]], "qs": [{"opts": ["automatic", "automatically", "automation", "automate"], "a": "B", "type": "R6-word", "vi": "...trợ lý AI có thể tự động tóm tắt ghi chú cuộc họp.", "ex": "Giữa 'can' và động từ 'summarize' → trạng từ.", "elim": "(D) tạo hai động từ liền nhau.", "tip": "modal + ___ + V → trạng từ."}, {"opts": ["The system will be unavailable for about two hours on the morning of the release.", "CloudDesk was founded in Singapore.", "Our office will move next year.", "Many employees enjoy remote work."], "a": "A", "type": "R6-sent", "vi": "Hệ thống sẽ ngừng khoảng hai giờ vào sáng ngày phát hành.", "ex": "Tiếp tục thông tin về đợt phát hành trước khi chuyển sang phần đào tạo.", "elim": "(B), (C), (D) không liên quan đến bản cập nhật.", "tip": "Thông báo cập nhật phần mềm thường kèm thời gian ngừng dịch vụ."}, {"opts": ["lately", "early", "previous", "recently"], "a": "B", "type": "R6-word", "vi": "...khuyến khích bạn đăng ký sớm.", "ex": "Chỗ ít → đăng ký sớm; 'early' là trạng từ.", "elim": "lately/recently = gần đây (quá khứ); previous là tính từ.", "tip": "lately ≠ late: bẫy hình thức."}, {"opts": ["while", "among", "during", "between"], "a": "C", "type": "R6-word", "vi": "...hỗ trợ trực tiếp trong tháng đầu sau cập nhật.", "ex": "during + cụm danh từ thời gian.", "elim": "while + mệnh đề; among/between không chỉ thời gian ở đây.", "tip": "During + N, While + S + V."}]}, {"part": 7, "passages": [{"kind": "Online chat discussion", "body": "Nadia Ali [9:30 A.M.]: The client from Osaka wants the product samples by Thursday instead of next Monday.\nCarl Brandt [9:31 A.M.]: Thursday? The packaging won't be ready until Friday.\nYuki Saito [9:33 A.M.]: We could send the samples in plain boxes and ship the branded packaging separately.\nNadia Ali [9:34 A.M.]: Good thinking. I'll check with the client to see if that's acceptable."}], "vocab": [["branded packaging", "bao bì có thương hiệu"], ["separately", "riêng biệt"], ["acceptable", "chấp nhận được"]], "qs": [{"q": "What is the problem?", "opts": ["A client wants items earlier than planned.", "A product is defective.", "A shipment has been lost.", "A price has changed."], "a": "A", "type": "R7-main", "vi": "Vấn đề là gì? → Khách hàng muốn nhận hàng sớm hơn dự kiến.", "ex": "Thursday thay vì next Monday.", "elim": "Không có lỗi sản phẩm hay mất hàng.", "tip": "instead of + mốc muộn hơn → deadline bị đẩy sớm."}, {"q": "At 9:31 A.M., what does Mr. Brandt imply when he writes, \"Thursday?\"", "opts": ["He did not read the message clearly.", "He thinks Thursday is a holiday.", "He is concerned the new date is not feasible.", "He prefers Thursday to Monday."], "a": "C", "type": "R7-intent", "vi": "'Thứ Năm á?' → Lo ngày mới không khả thi.", "ex": "Ngay sau: bao bì đến thứ Sáu mới xong.", "elim": "(A) hiểu sai câu hỏi ngược. (D) ngược nghĩa.", "tip": "Câu hỏi lặp lại một từ ('Thursday?') = ngạc nhiên/lo ngại."}]}, {"part": 7, "passages": [{"kind": "Memo", "title": "Office Recycling Update", "meta": "To: All Employees | From: Facilities", "body": "Beginning next month, our office will participate in the city's electronic waste program. [1] Old phones, chargers, cables, and batteries should no longer be placed in regular trash bins. [2] Instead, please bring them to the collection box located next to the elevators on the second floor. [3] The items will be picked up by a certified recycling company on the last Friday of each month. [4] Thank you for helping us reduce our environmental impact."}], "vocab": [["electronic waste", "rác thải điện tử"], ["collection box", "thùng thu gom"], ["certified", "được chứng nhận"]], "qs": [{"q": "What is the memo mainly about?", "opts": ["A new elevator", "How to discard electronic waste", "An office relocation", "A battery sale"], "a": "B", "type": "R7-main", "vi": "Bản ghi nhớ chủ yếu về? → Cách bỏ rác thải điện tử.", "ex": "Hướng dẫn đưa đồ điện tử vào thùng thu gom.", "elim": "(A) thang máy chỉ là mốc vị trí.", "tip": "Danh từ nơi chốn trong bài thường là bẫy câu chủ đề."}, {"q": "Where is the collection box located?", "opts": ["In the lobby", "At each desk", "In the parking garage", "Near the elevators on the second floor"], "a": "D", "type": "R7-detail", "vi": "Thùng thu gom ở đâu? → Cạnh thang máy tầng hai.", "ex": "'next to the elevators on the second floor'.", "elim": "Các vị trí khác không nhắc.", "tip": "next to → near."}, {"q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Doing so can cause fires and harm the environment.\"", "opts": ["[1]", "[2]", "[3]", "[4]"], "a": "B", "type": "R7-insert", "vi": "'Làm như vậy có thể gây cháy và hại môi trường' → vị trí [2].", "ex": "'Doing so' = bỏ pin vào thùng rác thường (câu ngay trước [2]).", "elim": "[3], [4] không có hành động tiêu cực để 'Doing so' chỉ tới.", "tip": "'Doing so / This' cần một hành động ở câu ngay trước."}]}, {"part": 7, "passages": [{"kind": "Program", "title": "Future of Retail Summit — Day 1 (Hall A)", "body": "9:00 Opening remarks — Lina Wong, Chair\n9:30 Keynote: AI in Customer Service — Dr. Omar Haddad\n11:00 Panel: Sustainable Packaging — moderated by Priya Shah\n1:30 Workshop: Data-Driven Pricing — Tom Becker\n3:30 Networking reception (Lobby)"}, {"kind": "E-mail", "meta": "From: Omar Haddad | To: Lina Wong | Date: May 2", "body": "Dear Ms. Wong,\n\nI regret to inform you that my flight from Dubai has been rescheduled, and I will not arrive until the afternoon of Day 1. Would it be possible to switch my session with one in the afternoon? I am happy to speak at any time after 1 P.M.\n\nI would also need a projector with an HDMI connection for my presentation."}, {"kind": "Notice", "title": "Program Change", "meta": "Posted May 4", "body": "Due to a speaker's travel schedule, the keynote and the workshop on Day 1 have exchanged time slots. All other sessions remain unchanged. Workshop participants are reminded to bring their own laptops."}], "vocab": [["regret to inform", "rất tiếc phải thông báo"], ["exchange time slots", "đổi khung giờ cho nhau"], ["moderate", "điều phối (thảo luận)"]], "qs": [{"q": "What is the purpose of Dr. Haddad's e-mail?", "opts": ["To cancel his presentation", "To ask about a hotel", "To propose a new topic", "To ask to move his session"], "a": "D", "type": "R7-main", "vi": "Mục đích email? → Xin đổi giờ trình bày.", "ex": "'switch my session with one in the afternoon'.", "elim": "(A) không hủy.", "tip": "Would it be possible to... = yêu cầu chính."}, {"q": "What does Dr. Haddad need for his presentation?", "opts": ["A projector", "A microphone", "A laptop", "Printed handouts"], "a": "A", "type": "R7-detail", "vi": "Ông cần gì cho bài trình bày? → Máy chiếu.", "ex": "'a projector with an HDMI connection'.", "elim": "(C) laptop là yêu cầu cho người dự workshop.", "tip": "Bẫy chéo văn bản: 'laptops' ở văn bản 3 dành cho đối tượng khác."}, {"q": "What time will Dr. Haddad most likely speak?", "opts": ["9:30", "11:00", "1:30", "3:30"], "a": "C", "type": "R7-cross", "vi": "Ông Haddad có lẽ phát biểu lúc mấy giờ? → 1:30.", "ex": "Keynote đổi giờ với workshop (1:30) → khớp 'sau 1 giờ chiều'.", "elim": "(A) giờ gốc. (D) là tiệc giao lưu.", "tip": "Câu ba văn bản: ghép thay đổi (văn bản 3) vào lịch gốc (văn bản 1)."}, {"q": "What is indicated about Tom Becker's session?", "opts": ["It has been canceled.", "It has moved to the  5:{name:"Hoàn thành câu",en:"Incomplete Sentences",dir:"Chọn từ/cụm từ đúng điền vào chỗ trống. Mục tiêu: ≤ 25 giây/câu."},
 6:{name:"Hoàn thành đoạn văn",en:"Text Completion",dir:"Điền từ, cụm từ hoặc cả câu vào đoạn văn. Đọc cả đoạn, không chỉ câu chứa chỗ trống."},
 7:{name:"Đọc hiểu",en:"Reading Comprehension",dir:"Đọc 1, 2 hoặc 3 văn bản và trả lời câu hỏi. Đọc câu hỏi trước, quét tìm từ khóa."}
};
const SPN = {M:"Nam",W:"Nữ",M2:"Nam 2",W2:"Nữ 2",N:"Đọc"};
const L = "ABCD";
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const freqDots=f=>`<span class="freq" title="Tần suất ước lượng">${[1,2,3].map(i=>`<i class="${i<=f?"on":""}"></i>`).join("")}</span>`;
const FREQ_TXT={3:"Rất cao",2:"Cao",1:"Trung bình"};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* number every question once */
TESTS.forEach(t=>{let n=0;["listening","reading"].forEach(sec=>t[sec].forEach(g=>{g.start=n+1;g.qs.forEach(q=>{q.n=++n;q.part=g.part;q.sec=sec})}))});
const allQs = t=>[...t.listening,...t.reading].flatMap(g=>g.qs);

/* ---------- speech ---------- */
const TTS = {
  ok: "speechSynthesis" in window, voices:[], map:null, rate:0.95, playing:null,
  load(){ if(!this.ok) return; this.voices = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==="en"); this.map=null; },
  build(){
    const v=this.voices; const fem=/female|samantha|zira|karen|moira|tessa|serena|victoria|susan|allison|ava|joanna|kendra|salli|libby|sonia|natasha|aria|jenny|emma|amy|fiona|catherine|hazel|google us english$/i;
    const mal=/(^|[^e])male|daniel|david|alex|fred|mark|george|guy|ryan|thomas|oliver|arthur|aaron|rishi|james|lee|tom|brian|matthew|google uk english male/i;
    const F=v.filter(x=>fem.test(x.name)), Mv=v.filter(x=>!fem.test(x.name)&&mal.test(x.name));
    const any=v[0]||null;
    const pick=(arr,i)=>arr.length?arr[i%arr.length]:any;
    this.map={W:{v:pick(F,0),p:F.length?1:1.2},W2:{v:pick(F,1),p:F.length>1?1:1.3},M:{v:pick(Mv,0),p:Mv.length?1:0.8},M2:{v:pick(Mv,1),p:Mv.length>1?1:0.7},N:{v:pick(Mv.length>2?Mv:F,2),p:1}};
  },
  play(seq,btn){
    if(!this.ok) return;
    if(this.playing){const was=this.playing.btn; this.stop(); if(was===btn) return;}
    if(!this.map) this.build();
    const me={btn,i:0,cancel:false}; this.playing=me; btn.dataset.on="1"; btn.querySelector("span").textContent="Dừng";
    const next=()=>{
      if(me.cancel) return;
      if(me.i>=seq.length){this.stop();return;}
      const [sp,txt]=seq[me.i++]; const u=new SpeechSynthesisUtterance(txt); const m=this.map[sp]||this.map.N;
      if(m.v){u.voice=m.v;u.lang=m.v.lang}else u.lang="en-US";
      u.pitch=m.p; u.rate=this.rate; u.onend=()=>setTimeout(next,450); u.onerror=()=>setTimeout(next,50);
      speechSynthesis.speak(u);
    };
    speechSynthesis.cancel(); setTimeout(next,80);
  },
  stop(){ if(this.playing){this.playing.cancel=true;const b=this.playing.btn;b.dataset.on="0";b.querySelector("span").textContent=b.dataset.label;} this.playing=null; if(this.ok) speechSynthesis.cancel(); }
};
if(TTS.ok){TTS.load(); speechSynthesis.onvoiceschanged=()=>TTS.load();}

function audioSeq(g){
  if(g.part===1){const q=g.qs[0];return [["N","Number "+q.n+". Look at the picture marked number "+q.n+" in your test book."],...q.opts.map((o,i)=>["N",L[i]+". "+o])];}
  if(g.part===2){const q=g.qs[0];const [a,b]=g.sp;return [["N","Number "+q.n+"."],[a,g.q],...q.opts.map((o,i)=>[b,L[i]+". "+o])];}
  const a=g.qs[0].n,b=g.qs[g.qs.length-1].n;
  const kind=g.part===3?"conversation":(/announce|attention|welcome/i.test(g.convo[0][1])?"announcement":"talk");
  const intro=g.part===3?("Questions "+a+" through "+b+" refer to the following conversation"+(g.graphic?" and graphic.":".")):("Questions "+a+" through "+b+" refer to the following "+kind+(g.graphic?" and graphic.":"."));
  return [["N",intro],...g.convo,...g.qs.map(q=>["N","Number "+q.n+". "+q.q.replace(/^Look at the graphic\. /,"Look at the graphic. ")])];
}
const PLAY_ICON='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';

/* ---------- routing ---------- */
const ROUTES=[...TESTS.map(t=>({h:"de-"+t.id,label:t.title})),{h:"ky-nang",label:"Kỹ năng nhận dạng"},{h:"dinh-huong",label:"Định hướng 2027"}];

}
function route(){
  TTS.stop(); clearInterval(window.__tick);
  const h=location.hash.slice(1); renderTabs(h.startsWith("t-")?"ky-nang":h);
  const m=h.match(/^de-(\d+)$/);
  if(m&&TESTS[+m[1]-1]) renderTest(TESTS[+m[1]-1]);
  else if(h==="ky-nang"||h.startsWith("t-")) renderSkills(h.startsWith("t-")?h:null);

  <section><h2>Cấu trúc mỗi mini test</h2>

  <tr><td>1</td><td>Mô tả tranh</td><td>6</td><td>2</td><td rowspan="4">≈ 20 phút (theo audio)</td></tr>

/* ---------- test ---------- */
function renderTest(t){
  const key="toeic-ans-"+t.id;
  let st=store.get(key,{a:{},done:false,t0:null,el:0});
  const save=()=>store.set(key,st);
  const qs=allQs(t);
  const app=$("#app");
  const groupHTML=g=>{
    const a=g.qs[0].n,b=g.qs[g.qs.length-1].n;
    let h=`<div class="group" id="g${a}">`;
    const isL=g.part<=4;
    h+=`<div class="group-head"><span class="qrange">${a===b?"Câu "+a:"Câu "+a+"–"+b}</span>${isL?`<button class="play" data-g="${a}" data-label="Nghe" data-on="0">${PLAY_ICON}<span>Nghe</span></button>`:""}</div>`;
    if(g.part===1) h+=`<div class="scene"><div class="cam" aria-hidden="true"></div><div><small>Ảnh (mô tả thay cho hình chụp)</small><p>${esc(g.scene)}</p></div></div>`;
    if(g.graphic) h+=`<div class="graphic"><table><caption>${esc(g.graphic.title)}</caption><thead><tr>${g.graphic.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${g.graphic.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    if(g.passages) h+=`<div class="docs">${g.passages.map(p=>{
        let body=esc(p.body).replace(/\{\{(\d)\}\}/g,(_,i)=>`<span class="blank">${g.qs[+i].n}</span>`).replace(/\[(\d)\]/g,'<span class="ins">[$1]</span>');
        return `<div class="doc"><div class="kind">${esc(p.kind)}</div>${p.title?`<div class="dtitle">${esc(p.title)}</div>`:""}${p.meta?`<div class="meta">${esc(p.meta)}</div>`:""}<div class="body">${body}</div></div>`}).join("")}</div>`;
    g.qs.forEach(q=>{
      const hideOpts=g.part<=2;
      h+=`<div class="q" id="q${q.n}"><div class="qline"><span class="qn">${q.n}.</span><div class="qtext ${g.part>=5?"text-en":""}">${q.q?esc(q.q):(g.part===6?"Chọn đáp án cho chỗ trống "+q.n+".":(g.part===1?"Chọn câu mô tả đúng nhất.":"Chọn lời đáp phù hợp nhất."))}</div></div>`;
      h+=`<div class="opts ${hideOpts?"inline":""}" data-q="${q.n}">${q.opts.map((o,i)=>`<button class="opt" data-q="${q.n}" data-l="${L[i]}" aria-label="Câu ${q.n} đáp án ${L[i]}"><span class="bub">${L[i]}</span>${hideOpts?`<span class="ot" data-reveal="${esc(o)}"></span>`:`<span class="ot">${esc(o)}</span>`}</button>`).join("")}</div>`;
      h+=`<div class="explain" data-ex="${q.n}" hidden></div></div>`;
    });
    if(g.vocab) h+=`<div class="gvocab" data-vocab hidden><span class="lab">Từ vựng trọng tâm</span><ul>${g.vocab.map(([e,v])=>`<li><b>${esc(e)}</b>: ${esc(v)}</li>`).join("")}</ul></div>`;
    if(isL){
      let lines;
      if(g.part===1) lines=g.qs[0].opts.map((o,i)=>["N",`(${L[i]}) ${o}`]);
      else if(g.part===2) lines=[[g.sp[0],g.q],...g.qs[0].opts.map((o,i)=>[g.sp[1],`(${L[i]}) ${o}`])];
      else lines=g.convo;
      h+=`<details class="tr" data-tr><summary>Lời thoại (transcript)</summary><div class="script text-en">${lines.map(([s,x])=>`<div><span class="sp">${SPN[s]}</span><span>${esc(x)}</span></div>`).join("")}</div></details>`;
    }
    return h+"</div>";
  };
  const sectionHTML=(sec,title,eb)=>{let h=`<div class="section-h"><h2>${title}</h2><span class="eyebrow">${eb}</span></div>`;let lp=0;
    t[sec].forEach(g=>{if(g.part!==lp){lp=g.part;h+=`<div class="part-h"><h3><span class="pn">PART ${g.part}</span>${PARTS[g.part].name} · ${PARTS[g.part].en}</h3><p>${PARTS[g.part].dir}</p></div>`;}h+=groupHTML(g)});return h;};
  app.innerHTML=`
   <div class="eyebrow">${t.title} · ${esc(t.theme)}</div>
   <h1>Mini test ${t.id}: 50 câu Nghe + Đọc</h1>
   <div class="toolbar">
     <label>Tốc độ đọc <input type="range" id="rate" min="0.75" max="1.15" step="0.05" value="${TTS.rate}"><span id="rateV" class="timer">${TTS.rate.toFixed(2)}×</span></label>
     <span>Thời gian: <span class="timer" id="clock">00:00</span></span>
     ${TTS.ok?"":'<span class="voicewarn">Trình duyệt này không hỗ trợ đọc giọng. Hãy dùng phần lời thoại.</span>'}
   </div>
   <div id="result"></div>
   <div class="layout">
     <div id="booklet" class="${st.done?"done":""}">${sectionHTML("listening","Listening","Phần Nghe · câu 1–25")}${sectionHTML("reading","Reading","Phần Đọc · câu 26–50")}</div>
     <aside class="sheet" id="sheet">
       <h3>Phiếu trả lời <span id="cnt"></span></h3>
       <button class="sheetToggle" id="stg" type="button">Mở phiếu</button>
       <div class="omr-label">Listening 1–25</div><div class="omr" id="omrL"></div>
       <div class="omr-label">Reading 26–50</div><div class="omr" id="omrR"></div>
       <div id="sheetActions"></div>
     </aside>
   </div>`;
  /* omr */
  const omr=n=>`<button type="button" data-go="${n}">${n}</button>`;
  $("#omrL").innerHTML=qs.filter(q=>q.n<=25).map(q=>omr(q.n)).join("");
  $("#omrR").innerHTML=qs.filter(q=>q.n>25).map(q=>omr(q.n)).join("");
  const paint=()=>{
    document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",st.a[b.dataset.q]===b.dataset.l));
    document.querySelectorAll("[data-go]").forEach(b=>{const q=qs[b.dataset.go-1];b.className="";
      if(st.done) b.className=st.a[q.n]===q.a?"ok":"bad"; else if(st.a[q.n]) b.className="f";});
    $("#cnt").textContent=Object.keys(st.a).length+"/50";
    if(st.done) revealAll();
    actions();
  };
  const actions=()=>{
    const box=$("#sheetActions");
    if(st.done){box.innerHTML=`<button class="btn ghost" id="retry" type="button">Làm lại đề này</button>`;$("#retry").onclick=()=>{st={a:{},done:false,t0:null,el:0};save();route();};return;}
    const missing=50-Object.keys(st.a).length;
    box.innerHTML=`<button class="btn primary" id="submit" type="button">Nộp bài</button><div id="cf"></div>`;
    $("#submit").onclick=()=>{
      if(missing>0){$("#cf").innerHTML=`<div class="confirm">Còn ${missing} câu chưa chọn. Câu bỏ trống tính là sai.<div class="row"><button class="btn primary" id="yes" type="button">Vẫn nộp</button><button class="btn ghost" id="no" type="button">Làm tiếp</button></div></div>`;
        $("#yes").onclick=submit;$("#no").onclick=()=>$("#cf").innerHTML="";}
      else submit();
    };
  };
  const revealAll=()=>{
    $("#booklet").classList.add("done");
    qs.forEach(q=>{
      document.querySelectorAll(`.opt[data-q="${q.n}"]`).forEach(b=>{b.classList.toggle("right",b.dataset.l===q.a);b.classList.toggle("wrong",b.dataset.l!==q.a);
        const ot=b.querySelector("[data-reveal]");if(ot) ot.textContent=ot.dataset.reveal;});
      const ok=st.a[q.n]===q.a, ty=TYPES[q.type];
      const ex=document.querySelector(`[data-ex="${q.n}"]`);ex.hidden=false;
      ex.innerHTML=`<p><span class="verdict ${ok?"ok":"bad"}">${ok?"Đúng":(st.a[q.n]?"Sai · bạn chọn "+st.a[q.n]:"Bỏ trống")}</span>Đáp án <b>${q.a}</b> <a class="chip" href="#t-${q.type}">${ty?ty.name:q.type}</a>${ty?freqDots(ty.freq)+`<span class="flabel">Tần suất ${FREQ_TXT[ty.freq].toLowerCase()}</span>`:""}</p>${q.vi?`<p><span class="lab">Dịch</span>${esc(q.vi)}</p>`:""}<p><span class="lab">Căn cứ</span>${esc(q.ex)}</p>${q.elim?`<p><span class="lab">Loại trừ</span>${esc(q.elim)}</p>`:""}<p class="tip"><b>Nhận dạng:</b> ${esc(q.tip)}</p>`;
    });
    document.querySelectorAll("[data-tr]").forEach(d=>d.open=true);
    document.querySelectorAll("[data-vocab]").forEach(d=>d.hidden=false);
  };
  const submit=()=>{st.done=true;save();
    const l=qs.filter(q=>q.n<=25&&st.a[q.n]===q.a).length, r=qs.filter(q=>q.n>25&&st.a[q.n]===q.a).length;
    store.set("toeic-res-"+t.id,{l,r});paint();showResult();
    $("#result").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});};
  const est=(c,sec)=>{const p=c/25;const v=sec==="L"?Math.round((p*470+20)/5)*5:Math.round((p*475+5)/5)*5;return Math.max(5,Math.min(495,v));};
  const showResult=()=>{
    if(!st.done){$("#result").innerHTML="";return;}
    const l=qs.filter(q=>q.n<=25&&st.a[q.n]===q.a).length, r=qs.filter(q=>q.n>25&&st.a[q.n]===q.a).length;
    const by={};qs.forEach(q=>{(by[q.type]=by[q.type]||{c:0,n:0}).n++;if(st.a[q.n]===q.a)by[q.type].c++;});
    const pri=([k,v])=>(1-v.c/v.n)*((TYPES[k]&&TYPES[k].freq)||1);
    const rows=Object.entries(by).sort((a,b)=>pri(b)-pri(a)||a[1].c/a[1].n-b[1].c/b[1].n).map(([k,v])=>{const p=Math.round(v.c/v.n*100);const ty=TYPES[k];
      return `<tr><td><a class="chip" href="#t-${k}">${ty?ty.name:k}</a></td><td>${ty?freqDots(ty.freq):""}</td><td class="timer">${v.c}/${v.n}</td><td><div class="bar"><i class="${p<60?"low":p<80?"mid":""}" style="width:${p}%"></i></div></td></tr>`}).join("");
    $("#result").innerHTML=`<div class="result"><div class="eyebrow">Kết quả</div><h2>${l+r}/50 câu đúng</h2>
     <div class="scores"><div class="score"><div class="lab">Listening</div><div class="big">${l}/25</div><div class="est">Ước lượng thô ≈ ${est(l,"L")}/495</div></div>
     <div class="score"><div class="lab">Reading</div><div class="big">${r}/25</div><div class="est">Ước lượng thô ≈ ${est(r,"R")}/495</div></div>
     <div class="score"><div class="lab">Tổng ước lượng</div><div class="big">≈ ${est(l,"L")+est(r,"R")}</div><div class="est">sai số lớn, chỉ để tham khảo</div></div></div>
     <h3>Thứ tự ưu tiên ôn tập</h3><p class="note">Xếp theo mức sai × tần suất ra đề: dạng ở trên cùng vừa sai nhiều vừa ra nhiều, nên ôn trước.</p>
     <div style="overflow-x:auto"><table class="typeTable"><thead><tr><th>Dạng</th><th>Tần suất</th><th>Đúng</th><th>Tỉ lệ</th></tr></thead><tbody>${rows}</tbody></table></div>
     <p class="note">Điểm quy đổi chỉ là ước lượng tuyến tính từ 25 câu; điểm thật của ETS dùng bảng quy đổi riêng cho từng đề. Bấm vào tên dạng để xem cách nhận dạng.</p></div>`;
  };
  /* events */
  app.onclick=e=>{
    const o=e.target.closest(".opt");
    if(o&&!st.done){const n=o.dataset.q;st.a[n]=st.a[n]===o.dataset.l?undefined:o.dataset.l;if(!st.a[n])delete st.a[n];
      if(!st.t0) st.t0=Date.now()-st.el*1000; save(); paint(); return;}
    const go=e.target.closest("[data-go]");
    if(go){$("#q"+go.dataset.go).scrollIntoView({block:"center"});$("#sheet").classList.remove("open");return;}
    const p=e.target.closest(".play");
    if(p){const g=[...t.listening].find(x=>x.qs[0].n==p.dataset.g);if(!st.t0&&!st.done){st.t0=Date.now();save();}TTS.play(audioSeq(g),p);return;}
  };
  $("#stg").onclick=()=>{const s=$("#sheet");s.classList.toggle("open");$("#stg").textContent=s.classList.contains("open")?"Đóng phiếu":"Mở phiếu";};
  $("#rate").oninput=e=>{TTS.rate=+e.target.value;$("#rateV").textContent=TTS.rate.toFixed(2)+"×";};
  const clock=()=>{let s=st.el;if(st.t0&&!st.done){s=Math.floor((Date.now()-st.t0)/1000);st.el=s;}
    $("#clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
  window.__tick=setInterval(()=>{if(!$("#clock")) return;clock();if(st.t0&&!st.done&&st.el%10===0) save();},1000);
  clock(); paint(); showResult();
}

/* ---------- skills ---------- */
function renderSkills(anchor){
  const counts={};TESTS.forEach(t=>allQs(t).forEach(q=>counts[q.type]=(counts[q.type]||0)+1));
  const byPart={};Object.entries(TYPES).forEach(([k,v])=>(byPart[v.part]=byPart[v.part]||[]).push([k,v]));
  const order=[["L1","Part 1"],["L2","Part 2"],["L34","Part 3 & 4"],["R5","Part 5"],["R6","Part 6"],["R7","Part 7"]];
  $("#app").innerHTML=`<div class="guide">
   <div class="eyebrow">Kỹ năng nhận dạng câu hỏi</div>
   <h1>Nhìn dấu hiệu, đoán dạng, chọn chiến thuật</h1>
   <p class="lede">Mỗi câu trong 10 đề được gắn một dạng. Nắm được dạng là biết cần nghe/đọc gì trước khi audio chạy hoặc trước khi đọc đoạn văn. Mỗi thẻ ghi tần suất ra đề ước lượng trên đề thật 200 câu.</p>
   <section><h2>Bảng tần suất: học cái gì trước</h2>
   <div class="tablewrap"><table><thead><tr><th>Dạng</th><th>Part</th><th>Tần suất</th><th>Số câu/đề thật (ước lượng)</th></tr></thead><tbody>
   ${Object.entries(TYPES).filter(([k,v])=>v.freq===3).map(([k,v])=>`<tr><td><a class="chip" href="#t-${k}">${v.name}</a></td><td>${v.part.replace("L34","L3–4").replace(/^L/,"P").replace(/^R/,"P")}</td><td>${freqDots(3)}</td><td class="timer">${v.share}</td></tr>`).join("")}
   </tbody></table></div>
   <p class="note" style="margin-top:8px">Đây là các dạng ở mức "rất cao". Số câu là ước lượng dựa trên cấu trúc đề ETS (ví dụ Part 3–4 cố định khoảng 5 câu biểu đồ và 5 câu ý định, Part 7 cố định 2 câu chèn câu và 2 câu ý định tin nhắn), không phải số liệu ETS công bố.</p></section>
   ${order.map(([p,title])=>`<section><h2>${title}${p==="L34"?"":" · "+PARTS[p.slice(1)].name}</h2>${(byPart[p]||[]).map(([k,v])=>`
     <div class="tcard" id="t-${k}"><h3>${v.name}<span class="cnt">${counts[k]||0} câu trong bộ đề</span></h3>
     <dl><dt>Tần suất</dt><dd>${freqDots(v.freq)}<b>${FREQ_TXT[v.freq]}</b> · khoảng ${v.share} câu ở đề thật (ước lượng)</dd><dt>Dấu hiệu</dt><dd>${v.sign}</dd><dt>Chiến thuật</dt><dd>${v.how}</dd><dt>Bẫy thường gặp</dt><dd>${v.trap}</dd>${v.trend?`<dt>Xu hướng 2027</dt><dd>${v.trend}</dd>`:""}</dl></div>`).join("")}</section>`).join("")}
  </div>`;
  if(anchor){const el=document.getElementById(anchor);if(el) setTimeout(()=>el.scrollIntoView({block:"start"}),30);}
}
