 the city,\" said director Amina Yusuf. The project cost $380,000, half of which was covered by a government grant. Ms. Yusuf added that the savings will be used to extend the clinic's opening hours on weekends."}], "qs": [{"q": "What is the article mainly about?", "opts": ["A clinic's use of renewable energy", "A new government health policy", "The opening of a new clinic", "A shortage of electricity"], "a": "A", "type": "R7-main", "ex": "Tiêu đề + câu đầu: phòng khám chạy hoàn toàn bằng năng lượng tái tạo.", "tip": "Tiêu đề bài báo gần như là đáp án câu chủ đề."}, {"q": "What is indicated about the project?", "opts": ["It took two years to complete.", "It cost $220,000.", "It was opposed by residents.", "It was partly funded by a grant."], "a": "D", "type": "R7-detail", "ex": "'half of which was covered by a government grant'.", "tip": "Bẫy số: 220 là số tấm pin, không phải chi phí."}, {"q": "The word \"extend\" in paragraph 2, line 4, is closest in meaning to", "opts": ["stretch", "lengthen", "offer", "reach"], "a": "B", "type": "R7-syn", "ex": "extend opening hours = kéo dài giờ mở cửa → lengthen.", "tip": "'stretch' là nghĩa vật lý, không hợp với giờ giấc."}]}, {"part": 7, "passages": [{"kind": "Job posting", "title": "Job Opening: Quality Assurance Technician", "meta": "Kestrel Manufacturing, Taichung Plant", "body": "Responsibilities: inspect finished products, record test results, and report defects to supervisors.\n\nRequirements: degree in engineering or a related field; at least two years of experience in quality control; ability to work rotating shifts.\n\nPreferred: knowledge of ISO 9001 standards; Mandarin and English.\n\nApply by May 20 by sending a résumé and cover letter to hr@kestrel-mfg.com."}, {"kind": "E-mail", "meta": "From: Daniel Ruiz | To: hr@kestrel-mfg.com | Date: May 18", "body": "Dear Hiring Manager,\n\nI am applying for the Quality Assurance Technician position. I hold a degree in mechanical engineering and have worked for three years as a quality inspector at Lumo Plastics, where I helped the company earn ISO 9001 certification. I am fluent in English and am currently taking Mandarin classes.\n\nAlthough I have mainly worked day shifts, I am happy to work rotating shifts. My résumé and cover letter are attached."}], "qs": [{"q": "What is NOT listed as a responsibility of the position?", "opts": ["Inspecting products", "Recording results", "Training new staff", "Reporting defects"], "a": "C", "type": "R7-not", "ex": "Mô tả công việc không nhắc đào tạo nhân viên mới.", "tip": "Câu NOT: đối chiếu từng mục trong danh sách."}, {"q": "What is suggested about Mr. Ruiz?", "opts": ["He applied after the deadline.", "He meets the experience requirement.", "He currently works at Kestrel.", "He speaks Mandarin fluently."], "a": "B", "type": "R7-cross", "ex": "Yêu cầu ≥ 2 năm; anh có 3 năm → đạt. Nộp 18/5 trước hạn 20/5.", "tip": "So sánh yêu cầu (văn bản 1) với hồ sơ (văn bản 2)."}, {"q": "Which preferred qualification does Mr. Ruiz have?", "opts": ["Knowledge of ISO 9001 standards", "Fluency in Mandarin", "A degree in chemistry", "Management experience"], "a": "A", "type": "R7-cross", "ex": "Anh giúp công ty cũ đạt chứng nhận ISO 9001; tiếng Trung mới đang học.", "tip": "'currently taking classes' ≠ fluent."}, {"q": "In the e-mail, the word \"hold\" in paragraph 1, line 1, is closest in meaning to", "opts": ["grip", "delay", "possess", "host"], "a": "C", "type": "R7-syn", "ex": "hold a degree = có bằng → possess.", "tip": "Thay đáp án vào câu: 'I possess a degree' giữ nguyên nghĩa."}, {"q": "What does Mr. Ruiz indicate about work shifts?", "opts": ["He prefers night shifts.", "He can work only during the day.", "He wants a part-time position.", "He is willing to work varying hours."], "a": "D", "type": "R7-detail", "ex": "'happy to work rotating shifts' → sẵn sàng làm ca luân phiên.", "tip": "rotating shifts → varying hours."}]}]}, {"id": 4, "title": "Đề 4", "theme": "Bán lẻ, thương mại điện tử & tài chính", "listening": [{"part": 1, "scene": "Một người đàn ông mặc tạp dề cửa hàng đang xếp các hộp sản phẩm lên kệ trong một cửa hàng tiện lợi.", "sp": "N", "qs": [{"opts": ["He's paying at the counter.", "He's pushing a shopping cart.", "He's arranging items on a shelf.", "He's opening a cash register."], "a": "C", "type": "L1-person", "ex": "(C) 'arranging items on a shelf' = sắp xếp hàng lên kệ. Các đáp án còn lại dùng từ liên quan đến cửa hàng nhưng sai hành động.", "tip": "Bẫy 'từ cùng chủ đề': counter, cart, cash register đều liên quan cửa hàng nhưng không xuất hiện trong ảnh."}]}, {"part": 1, "scene": "Nhiều xe đạp được dựng thành một hàng dài ở bãi đỗ trước một tòa nhà; có vài cây xanh, không có người.", "sp": "N", "qs": [{"opts": ["People are riding bicycles on the road.", "Some bicycles have been lined up outside a building.", "A man is repairing a tire.", "Trees are being planted."], "a": "B", "type": "L1-scene", "ex": "(B) 'have been lined up' = đã được xếp hàng. (A), (C) có người; (D) 'being planted' cần người.", "tip": "Ảnh vật: line up / arrange / stack / display + bị động hoàn thành là dạng đáp án kinh điển."}]}, {"part": 2, "q": "How much does express shipping cost?", "sp": ["W", "M"], "qs": [{"opts": ["An extra ten dollars.", "It ships tomorrow.", "Very express."], "a": "A", "type": "L2-wh", "ex": "How much → số tiền (A).", "tip": "How much (giá) ↔ con số + đơn vị tiền."}]}, {"part": 2, "q": "Where can I find the return policy?", "sp": ["M", "W"], "qs": [{"opts": ["Return it by Friday.", "It's at the bottom of the receipt.", "Yes, I found it."], "a": "B", "type": "L2-wh", "ex": "Where → vị trí (B). (A) lặp 'return'.", "tip": "Where: chờ giới từ chỉ vị trí (at, on, in, next to, at the bottom of)."}]}, {"part": 2, "q": "Has the quarterly sales report been finalized?", "sp": ["W", "M"], "qs": [{"opts": ["Sales went up.", "Twice a year.", "Ms. Liu is reviewing it now."], "a": "C", "type": "L2-yn", "ex": "Hỏi báo cáo xong chưa → 'Cô Liu đang xem lại' = chưa xong (C).", "tip": "Đáp án 'I don't know / Ask X / X is working on it' rất hay đúng với câu Yes/No."}]}, {"part": 2, "q": "Why don't we offer free delivery for orders over fifty dollars?", "sp": ["M", "W"], "qs": [{"opts": ["That could boost our online sales.", "Fifty dollars each.", "He delivered it."], "a": "A", "type": "L2-req", "ex": "Gợi ý → đánh giá lợi ích (A).", "tip": "Why don't we = gợi ý → đồng tình/phản đối, không giải thích lý do."}]}, {"part": 2, "q": "Are you paying by credit card or with a mobile app?", "sp": ["W", "M"], "qs": [{"opts": ["Yes, I'm paying.", "I'll use the app.", "A new card reader."], "a": "B", "type": "L2-choice", "ex": "Chọn một phương án (B).", "tip": "Câu lựa chọn: loại Yes/No ngay."}]}, {"part": 2, "q": "Our online store crashed again last night.", "sp": ["M", "W"], "qs": [{"opts": ["At the store.", "Last night's game.", "Did you let IT know?"], "a": "C", "type": "L2-stmt", "ex": "Báo sự cố → hỏi lại 'Bạn báo IT chưa?' (C).", "tip": "Đáp án đúng cho câu trần thuật có thể là một CÂU HỎI ngược."}]}, {"part": 2, "q": "When will the spring collection be available?", "sp": ["W", "M"], "qs": [{"opts": ["In early March.", "The collection agency.", "It's available in blue."], "a": "A", "type": "L2-wh", "ex": "When → thời gian (A). (B), (C) lặp từ.", "tip": "Nghe từ để hỏi trước, rồi mới nghe đáp án."}]}, {"part": 2, "q": "You haven't approved the budget yet, have you?", "sp": ["M", "W"], "qs": [{"opts": ["The budget office.", "Not yet. I need the final numbers.", "It was approved by him."], "a": "B", "type": "L2-tag", "ex": "Hỏi đuôi → 'Chưa, tôi cần số liệu cuối' (B). (C) lặp 'approved' và sai chủ thể.", "tip": "Not yet / Not until... là cách trả lời phổ biến cho câu hỏi tiến độ."}]}, {"part": 3, "convo": [["W", "Hi, I bought a pair of wireless earbuds from your Web site, but the left one doesn't charge."], ["M", "I'm sorry to hear that. Could you tell me the order number?"], ["W", "It's TW-58210. I received them on Monday."], ["M", "Thanks. Since it's within thirty days, you can either get a replacement or a full refund."], ["W", "I'd rather have a new pair. I use them every day for my commute."], ["M", "OK. I'll e-mail you a prepaid shipping label. Just send the earbuds back, and we'll ship the new pair as soon as we receive them."]], "qs": [{"q": "What problem does the woman report?", "opts": ["She received the wrong color.", "Her order arrived late.", "She was charged twice.", "An item does not work properly."], "a": "D", "type": "L34-main", "ex": "'the left one doesn't charge' → sản phẩm lỗi.", "tip": "doesn't work / broken / damaged → defective / not working properly."}, {"q": "What does the woman decide to do?", "opts": ["Request a refund", "Exchange the item", "Buy a different model", "Visit a store"], "a": "B", "type": "L34-detail", "ex": "'I'd rather have a new pair' → đổi hàng.", "tip": "I'd rather / I'd prefer → quyết định của nhân vật."}, {"q": "What will the man send the woman?", "opts": ["A discount coupon", "A receipt", "A shipping label", "A new pair of earbuds immediately"], "a": "C", "type": "L34-next", "ex": "'I'll e-mail you a prepaid shipping label'. (D) sai vì chỉ gửi hàng mới SAU khi nhận lại hàng cũ.", "tip": "Cẩn thận đáp án đúng một phần nhưng sai điều kiện thời gian."}]}, {"part": 3, "convo": [["M", "Good morning. I'd like to open a business account for my bakery."], ["W", "Certainly. Do you have your business registration certificate with you?"], ["M", "Yes, here it is. I'd also like to know about your mobile payment service. A lot of my customers want to pay with their phones."], ["W", "We can set that up today. There's no monthly fee for the first six months."], ["M", "That's great. Business has been slow since the road construction started, so I'm trying to keep costs down."]], "qs": [{"q": "Where does the conversation most likely take place?", "opts": ["At a bank", "At a bakery", "At a construction site", "At a phone store"], "a": "A", "type": "L34-who", "ex": "'open a business account' → ngân hàng.", "tip": "Bẫy: bakery là doanh nghiệp của người nói, không phải nơi diễn ra hội thoại."}, {"q": "What does the man ask about?", "opts": ["A loan", "Road construction", "A payment service", "Opening hours"], "a": "C", "type": "L34-detail", "ex": "'I'd also like to know about your mobile payment service'.", "tip": "I'd like to know about... = hỏi về."}, {"q": "What does the man imply about his business?", "opts": ["It is moving to a new location.", "It is hiring new staff.", "It opened recently.", "It has had fewer customers recently."], "a": "D", "type": "L34-intent", "ex": "'Business has been slow since the road construction started' → ít khách hơn.", "tip": "Câu hỏi imply: suy luận một bước từ lời nói, không lặp từ nguyên văn."}]}, {"part": 3, "convo": [["W", "I'm putting together our order for office supplies. The total right now is a hundred and eighty dollars."], ["M", "If we add the new printer ink cartridges we need, it'll go over two hundred."], ["W", "Good point. That would give us a bigger discount. I'll add them."], ["M", "Also, are we members of that store?"], ["W", "Not yet. But the membership is free, so I'll sign up before I place the order."]], "graphic": {"title": "Office Supplies Sale", "head": ["Order total", "Discount"], "rows": [["$50–$99", "10% off"], ["$100–$199", "15% off"], ["$200 or more", "20% off"], ["Members", "Free shipping"]]}, "qs": [{"q": "What are the speakers discussing?", "opts": ["A company event", "An order of supplies", "A job opening", "A repair service"], "a": "B", "type": "L34-main", "ex": "'our order for office supplies'.", "tip": "Chủ đề ở câu đầu."}, {"q": "Look at the graphic. What discount will the speakers most likely receive?", "opts": ["10%", "15%", "20%", "25%"], "a": "C", "type": "L34-graphic", "ex": "Thêm mực in → vượt $200 → giảm 20%. Bẫy: 180 đô ban đầu ứng với 15%.", "tip": "Câu biểu đồ hay có BẪY THAY ĐỔI: con số ban đầu khác con số cuối cùng."}, {"q": "What will the woman do before placing the order?", "opts": ["Become a member", "Compare prices", "Call the store", "Ask for approval"], "a": "A", "type": "L34-next", "ex": "'I'll sign up before I place the order'.", "tip": "sign up = register = become a member."}]}, {"part": 4, "convo": [["N", "In business news, online retailer ShopNest announced yesterday that it will open its first physical store in Taipei next spring. The store will let customers try products before ordering them online, and items will be delivered to their homes within two hours. Company spokesperson Ivy Chang said the decision was based on customer surveys showing that many shoppers want to see products in person. ShopNest plans to hire about one hundred twenty employees for the new location. Coming up after the break, we'll have the weekend weather forecast."]], "qs": [{"q": "What is the news report mainly about?", "opts": ["A company merger", "A company opening a physical store", "A new shopping app", "A price reduction"], "a": "B", "type": "L34-main", "ex": "'will open its first physical store in Taipei'.", "tip": "Tin kinh doanh: câu thứ nhất là chủ đề."}, {"q": "According to the speaker, why did ShopNest make the decision?", "opts": ["To reduce costs", "To compete with rivals", "To follow a government rule", "Because of survey results"], "a": "D", "type": "L34-detail", "ex": "'based on customer surveys'.", "tip": "based on / due to / as a result of → lý do."}, {"q": "What will listeners hear next?", "opts": ["A weather forecast", "An interview", "Traffic news", "An advertisement"], "a": "A", "type": "L34-next", "ex": "'Coming up after the break, we'll have the weekend weather forecast'.", "tip": "Bản tin radio: câu cuối 'Coming up / Stay tuned' báo nội dung tiếp theo."}]}, {"part": 4, "convo": [["N", "OK, let's look at last quarter's sales by channel. As you can see, our Web site is still our biggest source of revenue. But I want to focus on this channel here, the one that accounts for only five percent. Our competitors are making a lot of money through it, so we've hired a marketing agency to create short videos for us. They'll start next month. I'd like each department head to suggest two products to feature in the videos. Please send me your ideas by Wednesday."]], "graphic": {"title": "Sales by Channel (Last Quarter)", "head": ["Channel", "Share"], "rows": [["Web site", "45%"], ["Mobile app", "30%"], ["Physical stores", "20%"], ["Social media", "5%"]]}, "qs": [{"q": "Look at the graphic. Which channel does the speaker want to focus on?", "opts": ["Web site", "Mobile app", "Physical stores", "Social media"], "a": "D", "type": "L34-graphic", "ex": "Kênh chiếm 5% → Social media.", "tip": "Người nói dùng con số (5%) thay vì tên → đáp án là tên kênh."}, {"q": "What has the company recently done?", "opts": ["Opened a new store", "Lowered its prices", "Hired an outside firm", "Launched an app"], "a": "C", "type": "L34-detail", "ex": "'we've hired a marketing agency'.", "tip": "agency → outside firm (paraphrase)."}, {"q": "What are department heads asked to do?", "opts": ["Make videos", "Recommend products", "Attend a training", "Review a budget"], "a": "B", "type": "L34-do", "ex": "'suggest two products to feature in the videos'.", "tip": "I'd like X to... = yêu cầu X làm gì."}]}], "reading": [{"part": 5, "qs": [{"q": "Customers can track the ______ of their orders through our mobile app.", "opts": ["status", "statue", "state", "station"], "a": "A", "type": "R5-vocab", "ex": "track the status = theo dõi tình trạng đơn hàng.", "tip": "Từ vựng hình thức gần giống: status/statue/state – chọn theo collocation."}, {"q": "The store manager ______ the staff schedule every Friday afternoon.", "opts": ["post", "posts", "posting", "to post"], "a": "B", "type": "R5-verb", "ex": "Chủ ngữ số ít + thói quen (every Friday) → posts.", "tip": "Câu thiếu động từ chính → loại V-ing, to V. Chia theo chủ ngữ."}, {"q": "Our refund policy applies only to items returned ______ their original packaging.", "opts": ["on", "at", "in", "by"], "a": "C", "type": "R5-prep", "ex": "in original packaging = trong bao bì gốc.", "tip": "Học cụm cố định: in stock, in person, in advance, in original packaging."}, {"q": "Ms. Yamamoto's proposal was approved because it was the most ______ of all the submissions.", "opts": ["economy", "economically", "economize", "economical"], "a": "D", "type": "R5-pos", "ex": "the most + tính từ → economical (tiết kiệm).", "tip": "Sau 'the most' hoặc 'be' → tính từ."}, {"q": "______ you need help choosing a product, our staff will be happy to assist.", "opts": ["If", "Unless", "Despite", "Whether"], "a": "A", "type": "R5-conj", "ex": "Nghĩa điều kiện: 'Nếu bạn cần giúp' → If.", "tip": "Unless = if not → kiểm tra nghĩa phủ định."}, {"q": "The accounting department will process all invoices ______ within five business days.", "opts": ["prompt", "promptly", "prompted", "promptness"], "a": "B", "type": "R5-pos", "ex": "Bổ nghĩa cho động từ 'process' → trạng từ.", "tip": "Câu đã đủ S + V + O → chỗ trống thường là trạng từ."}, {"q": "Neither the manager nor the employees ______ aware of the price change.", "opts": ["was", "is", "were", "being"], "a": "C", "type": "R5-verb", "ex": "Neither A nor B: động từ chia theo B (the employees – số nhiều) → were.", "tip": "either/neither... or/nor: chia theo chủ ngữ GẦN động từ nhất."}, {"q": "The new loyalty program has attracted ______ members than expected.", "opts": ["many", "more", "most", "much"], "a": "B", "type": "R5-comp", "ex": "Có 'than' → so sánh hơn 'more'.", "tip": "Thấy than → so sánh hơn."}, {"q": "Please keep the receipt, ______ you will need it for any exchange.", "opts": ["as", "despite", "so that", "unless"], "a": "A", "type": "R5-conj", "ex": "'as' = vì (nêu lý do). 'so that' sai nghĩa (để mà).", "tip": "as/since/because = vì; so that/in order that = để."}, {"q": "The company's financial results will be announced ______ after the board meeting.", "opts": ["short", "shorten", "shortage", "shortly"], "a": "D", "type": "R5-pos", "ex": "shortly after = ngay sau khi.", "tip": "Cụm hay gặp: shortly after/before, soon after, right after."}, {"q": "The warehouse ______ we rent in Tainan has enough space for our holiday inventory.", "opts": ["who", "whose", "what", "which"], "a": "D", "type": "R5-rel", "ex": "Thay cho vật (warehouse), làm tân ngữ của 'rent' → which.", "tip": "Vật + S + V → which/that (có thể lược bỏ)."}]}, {"part": 6, "passages": [{"kind": "E-mail", "meta": "From: Urban Threads | To: Valued Customers | Subject: Introducing Threads Plus", "body": "Dear Customer,\n\nThank you for shopping at Urban Threads. We are excited to announce the launch of our new membership program, Threads Plus. {{0}} a small annual fee of $25, members will receive free shipping on all orders, early access to sales, and a birthday gift. {{1}}\n\nExisting customers who join before June 30 will also {{2}} a $10 voucher. To sign up, simply log in to your account and click on \"Membership.\" We look forward to serving you {{3}}."}], "qs": [{"opts": ["At", "For", "By", "With"], "a": "B", "type": "R6-word", "ex": "for a fee = với mức phí.", "tip": "for + số tiền = đổi lấy / với giá."}, {"opts": ["Our flagship store will close for renovations.", "Shipping costs have increased this year.", "We are hiring sales associates.", "In addition, members will earn double points on every purchase."], "a": "D", "type": "R6-sent", "ex": "Câu trước liệt kê quyền lợi → 'In addition' bổ sung quyền lợi khác.", "tip": "In addition / Also / Moreover → câu bổ sung cùng loại thông tin với câu trước."}, {"opts": ["receive", "receiving", "received", "receipt"], "a": "A", "type": "R6-word", "ex": "will + V nguyên mẫu (also chen giữa).", "tip": "Trạng từ (also, still) chen giữa không thay đổi dạng động từ."}, {"opts": ["soon", "further", "again", "before"], "a": "C", "type": "R6-word", "ex": "Khách đã mua sắm trước đó → 'phục vụ bạn lần nữa'.", "tip": "Câu kết email: We look forward to serving you again / hearing from you."}]}, {"part": 7, "passages": [{"kind": "E-mail", "meta": "From: Billing Department, Clearwave Mobile | To: Jun-ho Park | Subject: Your payment", "body": "Dear Mr. Park,\n\nWe noticed that your automatic payment for October could not be processed because the credit card on file expired on September 30. To avoid service interruption, please update your payment information by November 10. You can do this easily through the Clearwave app under \"Account Settings.\"\n\nIf you have already updated your information, please disregard this message."}], "qs": [{"q": "Why was the e-mail sent?", "opts": ["To advertise a new plan", "To confirm an order", "To notify a customer of a payment problem", "To change a billing date"], "a": "C", "type": "R7-main", "ex": "Thanh toán tự động không xử lý được vì thẻ hết hạn.", "tip": "Câu đầu email chứa lý do gửi."}, {"q": "What is Mr. Park asked to do?", "opts": ["Update his card information", "Visit a store", "Call customer service", "Pay a late fee"], "a": "A", "type": "R7-detail", "ex": "'please update your payment information by November 10'.", "tip": "Câu yêu cầu bắt đầu bằng please."}]}, {"part": 7, "passages": [{"kind": "Article", "title": "Second-Hand Goes Mainstream", "body": "Resale platforms are no longer just for bargain hunters. [1] According to a recent survey by Retail Insight, 62 percent of shoppers under 35 bought at least one used item online last year. [2] Popular categories include clothing, electronics, and furniture. Many consumers say they choose second-hand products to save money and reduce waste. [3] Major brands have noticed the trend: some now buy back their own used products and resell them through official programs. [4]"}], "qs": [{"q": "What is the article mainly about?", "opts": ["Trends in furniture design", "The popularity of second-hand shopping", "Online banking", "A market research company"], "a": "B", "type": "R7-main", "ex": "Toàn bài nói về xu hướng mua đồ cũ trở nên phổ biến.", "tip": "Đừng chọn chi tiết phụ (Retail Insight) làm chủ đề."}, {"q": "What is NOT mentioned as a popular category?", "opts": ["Books", "Clothing", "Electronics", "Furniture"], "a": "A", "type": "R7-not", "ex": "Bài liệt kê clothing, electronics, furniture; không có books.", "tip": "Câu NOT: tìm câu liệt kê trong bài rồi đối chiếu."}, {"q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"This allows them to keep control over quality and pricing.\"", "opts": ["[1]", "[2]", "[3]", "[4]"], "a": "D", "type": "R7-insert", "ex": "'them' = các thương hiệu lớn; 'This' = việc mua lại và bán lại → đặt sau câu cuối, vị trí [4].", "tip": "Đại từ (this, them, they) trong câu chèn phải có danh từ để chỉ tới ở câu ngay trước."}]}, {"part": 7, "passages": [{"kind": "Order confirmation", "title": "HomeNest Online — Order #HN-77231", "meta": "Date: October 3 | Customer: Laura Bianchi", "body": "Oak Bookshelf (Model B-12) × 1 ........ $189\nDesk Lamp (Warm White) × 2 ........ $58\nStorage Basket (Set of 3) × 1 ........ $35\nSubtotal ........ $282\nShipping ........ FREE (orders over $250)\nEstimated delivery: October 8–10\n\nNote: Large furniture items are delivered by our partner company, SwiftMove, and require a signature upon delivery."}, {"kind": "E-mail", "meta": "From: Laura Bianchi | To: HomeNest Customer Service | Date: October 11", "body": "Hello,\n\nI received the lamps and baskets on October 8, but the bookshelf still hasn't arrived. I was home all day on October 9 and 10, waiting for the delivery. Could you check the status with your delivery partner?\n\nAlso, I noticed that one of the lamps gives off a cool white light instead of warm white. I would like to exchange it."}], "qs": [{"q": "What is indicated about the order?", "opts": ["It was paid for in cash.", "It was placed on October 8.", "It qualified for free shipping.", "It included three lamps."], "a": "C", "type": "R7-detail", "ex": "Tổng $282 > $250 → miễn phí vận chuyển.", "tip": "Bẫy số: × 2 đèn, không phải 3; ngày đặt là 3/10."}, {"q": "Which item has not been delivered?", "opts": ["The bookshelf", "The desk lamps", "The storage baskets", "The signature form"], "a": "A", "type": "R7-detail", "ex": "'the bookshelf still hasn't arrived'.", "tip": "still hasn't / not yet → món chưa đến."}, {"q": "Which company is most likely responsible for delivering the missing item?", "opts": ["HomeNest Online", "SwiftMove", "Retail Insight", "Clearwave Mobile"], "a": "B", "type": "R7-cross", "ex": "Văn bản 1: đồ nội thất lớn do SwiftMove giao; văn bản 2: kệ sách chưa đến.", "tip": "Liên kết: 'large furniture' (văn bản 1) ↔ bookshelf (văn bản 2)."}, {"q": "What problem does Ms. Bianchi mention about a lamp?", "opts": ["It is broken.", "It is too heavy.", "It is missing a cord.", "Its light is different from what she ordered."], "a": "D", "type": "R7-detail", "ex": "Đặt Warm White nhưng nhận ánh sáng cool white.", "tip": "So sánh thông tin đặt hàng (văn bản 1) và thực tế (văn bản 2)."}, {"q": "In the e-mail, the phrase \"gives off\" in paragraph 2, line 1, is closest in meaning to", "opts": ["returns", "donates", "produces", "receives"], "a": "C", "type": "R7-syn", "ex": "give off light = phát ra ánh sáng → produces.", "tip": "Cụm động từ (phrasal verb) phải hiểu theo ngữ cảnh, không dịch từng chữ."}]}]}, {"id": 5, "title": "Đề 5", "theme": "Định hướng 2027: AI, làm việc hybrid & xanh", "listening": [{"part": 1, "scene": "Một người phụ nữ đeo tai nghe, ngồi tại bàn làm việc ở nhà và nói chuyện qua cuộc họp video trên laptop.", "sp": "N", "qs": [{"opts": ["She's adjusting a lamp.", "She's taking part in a video meeting.", "She's plugging in a printer.", "She's putting on headphones."], "a": "B", "type": "L1-person", "ex": "(B) 'taking part in a video meeting' = tham gia họp video. (D) bẫy: cô ĐANG ĐEO tai nghe, không phải đang đeo vào.", "tip": "Ảnh làm việc từ xa đang tăng: học các cụm video call, headset, webcam, home office."}]}, {"part": 1, "scene": "Hai chiếc ô tô điện đang cắm dây sạc tại các trụ sạc trong một bãi đỗ ngoài trời; không thấy người.", "sp": "N", "qs": [{"opts": ["Drivers are waiting in line.", "A car is being repaired in a garage.", "The parking lot is completely empty.", "Some vehicles are connected to charging stations."], "a": "D", "type": "L1-scene", "ex": "(D) mô tả trạng thái: xe đang nối với trụ sạc. (C) sai vì có xe; (A) không có người.", "tip": "Từ tuyệt đối (completely, all, every) trong Part 1 thường là bẫy."}]}, {"part": 2, "q": "Who set up the new AI scheduling tool?", "sp": ["W", "M"], "qs": [{"opts": ["At the next meeting.", "Someone from IT.", "It's a useful tool."], "a": "B", "type": "L2-wh", "ex": "Who → 'Ai đó bên IT' (B).", "tip": "Đáp án Who có thể mơ hồ (someone from..., I think it was...)."}]}, {"part": 2, "q": "How often do we have to come into the office?", "sp": ["M", "W"], "qs": [{"opts": ["Twice a week, on Tuesdays and Thursdays.", "It's often crowded.", "By subway."], "a": "A", "type": "L2-wh", "ex": "How often → tần suất (A). (B) lặp 'often'; (C) trả lời How (phương tiện).", "tip": "How often ↔ once/twice a week, every day, monthly."}]}, {"part": 2, "q": "Would you mind reviewing the chatbot's answers before we launch it?", "sp": ["W", "M"], "qs": [{"opts": ["It was launched yesterday.", "A review of the menu.", "Not at all. Send them over."], "a": "C", "type": "L2-req", "ex": "'Would you mind...?' → đồng ý = 'Not at all' (không phiền) (C).", "tip": "Would you mind...? → 'Not at all / No problem' nghĩa là ĐỒNG Ý."}]}, {"part": 2, "q": "Where are the charging cables for the company cars?", "sp": ["M", "W"], "qs": [{"opts": ["About two hours.", "Check the cabinet by the entrance.", "Yes, they're electric."], "a": "B", "type": "L2-wh", "ex": "Where → chỉ chỗ tìm (B).", "tip": "Đáp án Where dạng mệnh lệnh: 'Check...', 'Try...', 'Ask...'."}]}, {"part": 2, "q": "Shouldn't we update the privacy policy before the launch?", "sp": ["W", "M"], "qs": [{"opts": ["Legal is already working on it.", "The launch party was fun.", "A private room."], "a": "A", "type": "L2-tag", "ex": "Câu gợi ý dạng phủ định → (A) 'Bộ phận pháp lý đang làm rồi'. (C) bẫy 'privacy – private'.", "tip": "Shouldn't we...? = gợi ý; đáp án hay là 'already working on it'."}]}, {"part": 2, "q": "I can't log in to the new project platform.", "sp": ["M", "W"], "qs": [{"opts": ["A large platform.", "Log in at nine.", "Have you tried resetting your password?"], "a": "C", "type": "L2-stmt", "ex": "Báo lỗi → gợi ý cách khắc phục bằng câu hỏi (C).", "tip": "Câu trần thuật về sự cố → giải pháp / hỏi lại / chuyển người hỗ trợ."}]}, {"part": 2, "q": "Do you want the summary in a report or in a slide deck?", "sp": ["W", "M"], "qs": [{"opts": ["Yes, I want it.", "Slides would be easier to share.", "A deck of cards."], "a": "B", "type": "L2-choice", "ex": "Chọn slide và nêu lý do (B). (C) bẫy 'deck'.", "tip": "Câu lựa chọn: đáp án có thể diễn đạt lại lựa chọn (slide deck → slides)."}]}, {"part": 2, "q": "The client wants to move the deadline up by a week.", "sp": ["M", "W"], "qs": [{"opts": ["Up on the fourth floor.", "A week's vacation.", "Then we'll need extra help."], "a": "C", "type": "L2-stmt", "ex": "Hạn chót bị dời SỚM hơn → cần thêm người (C).", "tip": "move up = dời sớm hơn; push back = dời muộn hơn."}]}, {"part": 3, "convo": [["W", "So, we've been testing the AI writing assistant for a month. What do you both think?"], ["M", "It's saved me a lot of time on routine e-mails. I'd say about an hour a day."], ["M2", "Same here. But sometimes it gets product specifications wrong, so I always double-check."], ["W", "That's a good point. Before we roll it out company-wide, let's create a short guide on how to review its output."], ["M", "I can draft that. I'll have it ready by next Monday."]], "qs": [{"q": "What are the speakers mainly discussing?", "opts": ["A hiring plan", "A product launch", "A training trip", "An AI tool they have tested"], "a": "D", "type": "L3 "Contacting a manager", "Checking a different floor"], "a": "D", "type": "L34-do", "ex": "'Have you tried the fifth floor?'", "tip": "Have you tried...? = gợi ý."}]}, {"part": 3, "convo": [["M", "Hi, I'd like to rent an electric car for a business trip this weekend."], ["W", "Sure. How far will you be driving?"], ["M", "About four hundred fifty kilometers round trip. I'd rather not stop to recharge."], ["W", "Then this model would suit you. It's the cheapest one that covers that distance."], ["M", "Great. Do you offer a corporate discount?"], ["W", "Yes, if your company has an account with us. Let me look up your company name."]], "graphic": {"title": "EV Rentals", "head": ["Model", "Range", "Daily rate"], "rows": [["Volt Mini", "250 km", "$45"], ["Volt City", "350 km", "$60"], ["Volt Tour", "500 km", "$80"], ["Volt Max", "650 km", "$110"]]}, "qs": [{"q": "Why is the man renting a car?", "opts": ["For a family vacation", "For a business trip", "Because he is moving", "Because his car is being repaired"], "a": "B", "type": "L34-main", "ex": "'for a business trip this weekend'.", "tip": "Mục đích ở câu đầu."}, {"q": "Look at the graphic. How much will the man most likely pay per day?", "opts": ["$45", "$60", "$80", "$110"], "a": "C", "type": "L34-graphic", "ex": "Cần ≥ 450 km, rẻ nhất → Volt Tour (500 km) → $80.", "tip": "Biểu đồ + điều kiện 'cheapest that...' → lọc theo điều kiện rồi chọn giá thấp nhất."}, {"q": "What will the woman do next?", "opts": ["Look up corporate account information", "Charge the vehicle", "Print a contract", "Show the man the car"], "a": "A", "type": "L34-next", "ex": "'Let me look up your company name'.", "tip": "Let me... = hành động ngay sau đó."}]}, {"part": 4, "convo": [["N", "Welcome to Smart Business Weekly. Today's guest is Dr. Nadia Rahman, who studies how companies use artificial intelligence. According to her latest research, small businesses that adopted AI tools for customer service cut response times by sixty percent. However, ải, xe điện, đi tàu → các biện pháp bền vững.", "tip": "Đáp án chủ đề thường là từ khái quát (sustainability measures) bao trùm các chi tiết."}, {"q": "What will happen in December?", "opts": ["New cars will arrive.", "The travel policy will be reviewed.", "Charging stations will be installed.", "A train line will open."], "a": "C", "type": "L34-detail", "ex": "'charging stations will be installed… this December'. Bẫy: xe điện thay từ January.", "tip": "Bài có 2 mốc thời gian → ghép đúng sự kiện với mốc."}, {"q": "Why does the speaker say, \"I realize some of you travel a lot for work\"?", "opts": ["To ask for volunteers", "To praise employees", "To cancel some trips", "To acknowledge a possible inconvenience"], "a": "D", "type": "L34-intent", "ex": "Thừa nhận chính sách mới có thể bất tiện → đưa ra hỗ trợ (nâng hạng vé).", "tip": "'I realize / I know / I understand' + 'That's why...' = thừa nhận vấn đề rồi đưa giải pháp."}]}], "reading": [{"part": 5, "qs": [{"q": "The software company plans to ______ its AI assistant into all of its products by 2027.", "opts": ["integrate", "integration", "integral", "integrated"], "a": "A", "type": "R5-pos", "ex": "plan to + V nguyên mẫu.", "tip": "to + V nguyên mẫu (plan to, decide to, aim to)."}, {"q": "Employees working remotely must ______ to the company's data security guidelines.", "opts": ["follow", "obey", "adhere", "comply"], "a": "C", "type": "R5-vocab", "ex": "adhere TO; comply WITH; follow/obey không cần giới từ.", "tip": "Từ vựng + giới từ đi sau là chìa khóa: adhere to, comply with, conform to."}, {"q": "The number of electric vehicles on the road ______ rapidly over the past five years.", "opts": ["grow", "has grown", "have grown", "growing"], "a": "B", "type": "R5-verb", "ex": "'The number of' → số ít; 'over the past five years' → HTHT → has grown.", "tip": "The number of + N số nhiều → động từ số ít; A number of → số nhiều."}, {"q": "______ the chatbot handles routine questions, our staff can focus on complex cases.", "opts": ["Now that", "In case of", "Rather than", "Even"], "a": "A", "type": "R5-conj", "ex": "Now that = vì giờ đây; theo sau là mệnh đề.", "tip": "Liên từ ít gặp nhưng hay thi: now that, provided that, given that, as long as."}, {"q": "The board found Ms. Duarte's presentation on hybrid work highly ______.", "opts": ["inform", "information", "informative", "informatively"], "a": "C", "type": "R5-pos", "ex": "find + O + tính từ; 'highly' bổ nghĩa cho tính từ.", "tip": "find/keep/make + tân ngữ + TÍNH TỪ."}, {"q": "All personal data collected by the app is stored ______ and deleted after 90 days.", "opts": ["secure", "security", "secured", "securely"], "a": "D", "type": "R5-pos", "ex": "Bổ nghĩa cho động từ 'is stored' → trạng từ.", "tip": "be + V3 + ___ → trạng từ."}, {"q": "The startup received funding from several investors, ______ of whom specialize in green technology.", "opts": ["most", "much", "they", "which"], "a": "A", "type": "R5-rel", "ex": "Cấu trúc 'most/some/all of whom' trong mệnh đề quan hệ.", "tip": "Sau dấu phẩy + ___ of whom/which → chọn lượng từ (most, some, many, all)."}, {"q": "Customers ______ subscriptions renew automatically will be notified one week in advance.", "opts": ["who", "whose", "which", "whom"], "a": "B", "type": "R5-rel", "ex": "Sau chỗ trống là danh từ 'subscriptions' → whose.", "tip": "Mẫu lặp lại nhiều đề: ___ + N + V → whose."}, {"q": "If the pilot program ______ successful, it will be expanded to all regional offices.", "opts": ["will prove", "proved", "proving", "proves"], "a": "D", "type": "R5-verb", "ex": "Điều kiện loại 1: If + hiện tại đơn, will + V.", "tip": "Mệnh đề If/when/as soon as (tương lai) → dùng hiện tại đơn."}, {"q": "The new office layout is designed to encourage ______ between departments.", "opts": ["collaborate", "collaborative", "collaboration", "collaboratively"], "a": "C", "type": "R5-pos", "ex": "encourage + danh từ (tân ngữ) → collaboration.", "tip": "Động từ + ___ + giới từ → danh từ."}, {"q": "Applicants are expected to be familiar ______ cloud-based project management tools.", "opts": ["to", "with", "for", "at"], "a": "B", "type": "R5-prep", "ex": "be familiar with = quen thuộc với.", "tip": "Tính từ + giới từ: familiar with, responsible for, eligible for, aware of."}]}, {"part": 6, "passages": [{"kind": "Article", "title": "Riverside City to Launch E-Scooter Program", "body": "Riverside City will introduce a shared electric scooter program next month. Residents will be able to rent scooters through a mobile app for $0.20 per minute. {{0}}\n\nThe city {{1}} 500 scooters at 60 locations across downtown. Officials hope the program will reduce traffic congestion and {{2}} air quality. {{3}} the first two months, riders will receive their first ten minutes free."}], "qs": [{"opts": ["Riders must be at least 18 years old and wear a helmet.", "The city hall was built in 1950.", "Bus fares have not changed in ten years.", "Many residents enjoy jogging along the river."], "a": "A", "type": "R6-sent", "ex": "Câu trước nói về cách thuê xe → câu tiếp nêu điều kiện người thuê.", "tip": "Câu điền phải cùng chủ đề hẹp (người thuê xe), không chỉ cùng chủ đề rộng (thành phố)."}, {"opts": ["placing", "will place", "has been placed", "to place"], "a": "B", "type": "R6-word", "ex": "Chương trình bắt đầu tháng sau → tương lai; chủ ngữ 'The city' chủ động.", "tip": "Part 6: xác định thì dựa vào ngữ cảnh cả đoạn (next month)."}, {"opts": ["improvement", "improving", "improve", "improved"], "a": "C", "type": "R6-word", "ex": "Song hành với 'reduce' sau 'will' → improve.", "tip": "and nối 2 động từ cùng dạng."}, {"opts": ["While", "Since", "Until", "During"], "a": "D", "type": "R6-word", "ex": "During + cụm danh từ (the first two months).", "tip": "During + N; While + mệnh đề."}]}, {"part": 7, "passages": [{"kind": "Online chat discussion", "body": "Olivia Grant [10:02 A.M.]: The client approved the new app design!\nBen Torres [10:03 A.M.]: Great news. Do they still want the launch on March 1?\nOlivia Grant [10:04 A.M.]: Actually, they asked if we could do February 15.\nMina Cho [10:05 A.M.]: That's tight. The payment feature still needs testing.\nBen Torres [10:06 A.M.]: I can move two developers from the Web site project to help.\nOlivia Grant [10:07 A.M.]: Perfect. I'll tell the client we'll confirm the date by Friday."}], "qs": [{"q": "What is mainly being discussed?", "opts": ["Hiring new developers", "The timing of a product launch", "A problem with a Web site", "A client complaint"], "a": "B", "type": "R7-main", "ex": "Khách hàng muốn ra mắt sớm hơn (15/2 thay vì 1/3).", "tip": "Chat nhiều người: tìm vấn đề mà mọi người cùng phản hồi."}, {"q": "At 10:05 A.M., what does Ms. Cho most likely mean when she writes, \"That's tight\"?", "opts": ["The office space is small.", "The budget is limited.", "The design is excellent.", "The new deadline may be hard to meet."], "a": "D", "type": "R7-intent", "ex": "Ngay sau: tính năng thanh toán còn phải thử → lịch mới khó kịp.", "tip": "Câu ý định ngắn (That's tight / Tell me about it / I'm on it) → đọc ngữ cảnh 2 tin trước và sau."}]}, {"part": 7, "passages": [{"kind": "Memo", "title": "Updated Hybrid Work Policy", "meta": "To: All staff | From: Kenji Ito, HR Director", "body": "Effective February 1, all employees will be required to work in the office at least three days per week, up from two. [1] This change follows feedback from team leaders who said in-person collaboration has improved project outcomes. [2] Employees may choose which three days, but Wednesday will be a required office day for everyone so that teams can hold weekly planning meetings. [3] Requests for exceptions, such as for medical reasons, should be submitted to HR. [4]"}], "qs": [{"q": "What is the purpose of the memo?", "opts": ["To introduce a new director", "To schedule a meeting", "To announce a policy update", "To request feedback"], "a": "C", "type": "R7-main", "ex": "Thay đổi số ngày làm việc tại văn phòng.", "tip": "Effective + ngày → thông báo thay đổi chính sách."}, {"q": "What is indicated about Wednesdays?", "opts": ["All employees must be in the office.", "Planning meetings will be held online.", "The office will close early.", "Employees may work from home."], "a": "A", "type": "R7-detail", "ex": "'Wednesday will be a required office day for everyone'.", "tip": "Tìm từ khóa Wednesday trong bài."}, {"q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Each request will be reviewed on a case-by-case basis.\"", "opts": ["[1]", "[2]", "[3]", "[4]"], "a": "D", "type": "R7-insert", "ex": "'Each request' tiếp nối 'Requests for exceptions' → vị trí [4].", "tip": "Danh từ lặp lại (request) là manh mối mạnh nhất."}]}, {"part": 7, "passages": [{"kind": "Product page", "title": "CleanAir Pro Smart Purifier — $249", "body": "• Covers rooms up to 40 m²\n• Connects to the CleanAir app to show real-time air quality\n• Filter replacement recommended every 6 months ($35)\n• 2-year warranty\n• Free delivery within 3 days"}, {"kind": "Customer review", "meta": "Grace Liu | March 2 | ★★★☆☆", "body": "The purifier works well in my 35 m² living room, and I love checking the air quality on my phone. However, after only four months, the app started showing a \"Replace Filter\" warning. That seems too early. Also, the device arrived five days after I ordered it."}, {"kind": "E-mail", "meta": "From: CleanAir Customer Care | To: Grace Liu | Date: March 4", "body": "Dear Ms. Liu,\n\nThank you for your review. Filter life depends on air conditions; in areas with high pollution, filters may need replacing sooner. We are sorry that your delivery took longer than promised. As an apology, we will send you a replacement filter at no cost. It should arrive within 3 business days."}], "qs": [{"q": "What is indicated about the CleanAir Pro?", "opts": ["It has a one-year warranty.", "It can be used with a mobile app.", "It covers rooms up to 50 m².", "It costs $35."], "a": "B", "type": "R7-detail", "ex": "'Connects to the CleanAir app'.", "tip": "Bẫy số: $35 là giá lõi lọc, không phải máy."}, {"q": "Why was Ms. Liu disappointed?", "opts": ["The device was noisy.", "Her room was too large.", "A filter warning appeared earlier than expected.", "The app did not work."], "a": "C", "type": "R7-detail", "ex": "Cảnh báo thay lọc sau 4 tháng (khuyến nghị 6 tháng).", "tip": "Tín hiệu: However, too early."}, {"q": "What promise did CleanAir fail to keep?", "opts": ["Delivery within three days", "A two-year warranty", "Coverage of 40 m²", "Real-time air quality updates"], "a": "A", "type": "R7-cross", "ex": "Trang sản phẩm hứa giao trong 3 ngày; đánh giá: giao sau 5 ngày.", "tip": "Câu ba văn bản: lời hứa ở văn bản 1 ↔ thực tế ở văn bản 2."}, {"q": "According to the e-mail, why might filters need to be replaced early?", "opts": ["Incorrect installation", "The size of the room", "A defective product", "Poor air quality in the area"], "a": "D", "type": "R7-detail", "ex": "'in areas with high pollution, filters may need replacing sooner'.", "tip": "high pollution → poor air quality (paraphrase)."}, {"q": "What will Ms. Liu receive?", "opts": ["A full refund", "A free filter", "A new device", "A discount coupon"], "a": "B", "type": "R7-detail", "ex": "'we will send you a replacement filter at no cost'.", "tip": "at no cost = free = complimentary."}]}]}, {"id": 6, "title": "Đề 6", "theme": "Nhân sự & tuyển dụng", "focus": true, "listening": [{"part": 1, "scene": "Một người đàn ông đang treo áo khoác lên móc gắn tường gần cửa ra vào văn phòng.", "sp": "N", "vocab": [["hang (a jacket) on a hook", "treo (áo) lên móc"], ["button a coat", "cài cúc áo"], ["sweep the floor", "quét sàn"]], "qs": [{"opts": ["He's buttoning his coat.", "He's hanging a jacket on a hook.", "He's opening a door.", "He's sweeping the floor."], "a": "B", "type": "L1-person", "vi": "(B) Anh ấy đang treo áo khoác lên móc.", "ex": "Động từ 'hanging' khớp đúng hành động trong ảnh; 'jacket' và 'hook' cũng khớp vật thể.", "elim": "(A) cài cúc là hành động khác dù cùng chủ đề áo. (C) chỉ đứng gần cửa, không mở cửa. (D) không có hành động quét.", "tip": "Ảnh một người chiếm khoảng 4/6 câu Part 1. Trước khi nghe, tự nói thầm động từ chính bằng tiếng Anh (hanging, holding, typing...)."}]}, {"part": 1, "scene": "Văn phòng không người: nhiều màn hình máy tính đặt trên các bàn làm việc kê sát nhau, ghế đã được đẩy sát vào bàn.", "sp": "N", "vocab": [["monitor", "màn hình"], ["stack", "chồng lên, xếp chồng"], ["be placed on", "được đặt trên"]], "qs": [{"opts": ["Workers are typing on keyboards.", "Chairs are being stacked.", "A computer is being repaired.", "Some monitors have been placed on desks."], "a": "D", "type": "L1-scene", "vi": "(D) Vài màn hình đã được đặt trên bàn.", "ex": "Ảnh không người → câu bị động hoàn thành 'have been placed' mô tả trạng thái là dạng đúng điển hình.", "elim": "(A) có 'workers' trong khi ảnh không người. (B), (C) 'are being + V3' cần người đang thực hiện.", "tip": "Ảnh không người: gạch ngay câu có chủ ngữ là người và câu 'being + V3'; thường chỉ còn 1–2 đáp án."}]}, {"part": 2, "q": "Where should I send my job application?", "sp": ["W", "M"], "vocab": [["job application", "đơn xin việc"], ["apply (for)", "nộp đơn"]], "qs": [{"opts": ["To the HR manager's e-mail address.", "I applied last week.", "A full-time position."], "a": "A", "type": "L2-wh", "vi": "Tôi nên gửi đơn xin việc đến đâu? → Gửi đến địa chỉ email của trưởng phòng nhân sự.", "ex": "Where (gửi đến đâu) → (A) chỉ nơi nhận.", "elim": "(B) lặp gốc 'apply', trả lời thời gian. (C) nói về loại công việc.", "tip": "Where không chỉ hỏi địa điểm vật lý: còn hỏi gửi đến đâu, tìm ở đâu → đáp án có thể là người/email/website."}]}, {"part": 2, "q": "When does the new employee orientation start?", "sp": ["M", "W"], "vocab": [["orientation", "buổi định hướng cho nhân viên mới"]], "qs": [{"opts": ["In the training room.", "Right after lunch.", "Three new employees."], "a": "B", "type": "L2-wh", "vi": "Buổi định hướng cho nhân viên mới bắt đầu khi nào? → Ngay sau bữa trưa.", "ex": "When → mốc thời gian (B), dù không có giờ cụ thể.", "elim": "(A) trả lời Where. (C) lặp 'new employee', trả lời How many.", "tip": "Đáp án When thường gián tiếp: right after lunch, as soon as..., not until..., once the manager arrives."}]}, {"part": 2, "q": "Who's interviewing the candidates tomorrow?", "sp": ["W", "M"], "vocab": [["candidate", "ứng viên"], ["department head", "trưởng bộ phận"]], "qs": [{"opts": ["The candidates are very qualified.", "Tomorrow morning.", "Ms. Nakamura and the department head."], "a": "C", "type": "L2-wh", "vi": "Ai sẽ phỏng vấn ứng viên ngày mai? → Cô Nakamura và trưởng bộ phận.", "ex": "Who → tên người/chức danh (C).", "elim": "(A) lặp 'candidates'. (B) lặp 'tomorrow', trả lời When.", "tip": "Who/When dễ nhầm vì đều có 'tomorrow' trong câu hỏi → nghe chắc từ để hỏi đầu câu."}]}, {"part": 2, "q": "I heard the company is opening a branch in Kaohsiung.", "sp": ["M", "W"], "vocab": [["branch", "chi nhánh; cành cây"]], "qs": [{"opts": ["A tree branch fell yesterday.", "Yes, they announced it this morning.", "I'll open the window."], "a": "B", "type": "L2-stmt", "vi": "Tôi nghe nói công ty sắp mở chi nhánh ở Cao Hùng. → Đúng vậy, họ đã thông báo sáng nay.", "ex": "Câu trần thuật chia sẻ tin → (B) xác nhận và bổ sung thông tin.", "elim": "(A) 'branch' nghĩa cành cây (bẫy đồng âm khác nghĩa). (C) lặp gốc 'open'.", "tip": "Bẫy từ đa nghĩa (branch, charge, check, order) xuất hiện rất đều trong Part 2."}]}, {"part": 2, "q": "Can you tell me how many people signed up for the workshop?", "sp": ["W", "M"], "vocab": [["sign up for", "đăng ký"], ["so far", "cho đến giờ"]], "qs": [{"opts": ["About thirty so far.", "Sign here, please.", "It's a three-hour workshop."], "a": "A", "type": "L2-indirect", "vi": "Bạn cho tôi biết bao nhiêu người đã đăng ký hội thảo? → Khoảng 30 người cho đến giờ.", "ex": "Câu hỏi gián tiếp, trọng tâm là 'how many' → (A) đưa ra con số.", "elim": "(B) lặp 'sign'. (C) con số nhưng nói về thời lượng, không phải số người.", "tip": "Câu gián tiếp: bỏ 'Can you tell me', giữ lại phần 'how many people...' để xác định loại thông tin cần."}]}, {"part": 2, "q": "Would you rather hold the interviews in person or online?", "sp": ["M", "W"], "vocab": [["in person", "trực tiếp"], ["overseas applicants", "ứng viên ở nước ngoài"]], "qs": [{"opts": ["Yes, I'd rather.", "In the meeting.", "Online would be more convenient for overseas applicants."], "a": "C", "type": "L2-choice", "vi": "Bạn muốn phỏng vấn trực tiếp hay trực tuyến? → Trực tuyến tiện hơn cho ứng viên ở nước ngoài.", "ex": "Chọn một phương án và nêu lý do (C).", "elim": "(A) Yes không trả lời câu lựa chọn. (B) trả lời Where.", "tip": "Câu lựa chọn chiếm khoảng 2–3 câu/25 câu Part 2; đáp án nhắc lại MỘT trong hai lựa chọn rất thường đúng."}]}, {"part": 2, "q": "Why don't you apply for the team leader position?", "sp": ["W", "M"], "vocab": [["team leader", "trưởng nhóm"], ["experience", "kinh nghiệm"]], "qs": [{"opts": ["Because I applied.", "I'm not sure I have enough experience.", "The position is on the left."], "a": "B", "type": "L2-req", "vi": "Sao bạn không ứng tuyển vị trí trưởng nhóm? → Tôi không chắc mình đủ kinh nghiệm.", "ex": "'Why don't you...?' là lời gợi ý → (B) phản hồi do dự kèm lý do.", "elim": "(A) bẫy Because cho câu gợi ý. (C) 'position' theo nghĩa vị trí không gian.", "tip": "Câu gợi ý: đáp án có thể là đồng ý (Good idea), từ chối khéo (I'm not sure...), hoặc đặt điều kiện."}]}, {"part": 2, "q": "The payroll system will be down for maintenance tonight.", "sp": ["M", "W"], "vocab": [["payroll", "bảng lương, hệ thống trả lương"], ["be down", "ngừng hoạt động"], ["timesheet", "bảng chấm công"]], "qs": [{"opts": ["Then I'd better submit my timesheet now.", "Payroll is on the second floor.", "It was down the hall."], "a": "A", "type": "L2-stmt", "vi": "Tối nay hệ thống tính lương sẽ ngừng để bảo trì. → Vậy tôi nên nộp bảng chấm công ngay bây giờ.", "ex": "Phản ứng hợp lý trước thông báo hệ thống ngừng: làm việc cần làm trước (A).", "elim": "(B) lặp 'payroll', trả lời Where. (C) 'down' nghĩa 'cuối hành lang'.", "tip": "Đáp án bắt đầu bằng 'Then...' / 'In that case...' rất hay đúng với câu trần thuật báo tin."}]}, {"part": 3, "convo": [["W", "Hi, this is Monica from Delvin Software's HR department. I'm calling to schedule a second interview for the marketing analyst position."], ["M", "Oh, great. Thank you for calling."], ["W", "We'd like you to meet our marketing director. Are you available this Thursday at ten?"], ["M", "Unfortunately, I'm traveling for a family event until Thursday evening. Would Friday work?"], ["W", "Let me check her calendar. Yes, Friday at eleven is open. Please bring a portfolio of your past campaigns."], ["M", "Sure, I'll bring it."]], "vocab": [["schedule an interview", "sắp xếp buổi phỏng vấn"], ["portfolio", "hồ sơ năng lực, tập sản phẩm"], ["campaign", "chiến dịch"]], "qs": [{"q": "Why is the woman calling?", "opts": ["To offer a job", "To arrange an interview", "To cancel a meeting", "To request a reference"], "a": "B", "type": "L34-main", "vi": "Vì sao người phụ nữ gọi điện? → Để sắp xếp một buổi phỏng vấn.", "ex": "'I'm calling to schedule a second interview' → schedule = arrange.", "elim": "(A) chưa mời làm việc, mới vòng 2. (C), (D) không được nhắc.", "tip": "'I'm calling to/about...' là câu chìa khóa cho câu hỏi mục đích cuộc gọi."}, {"q": "Why can't the man come on Thursday?", "opts": ["He has another interview.", "He is sick.", "He will be out of town.", "He is working late."], "a": "C", "type": "L34-detail", "vi": "Vì sao người đàn ông không đến được hôm thứ Năm? → Anh ấy sẽ đi xa.", "ex": "'traveling for a family event until Thursday evening' → out of town.", "elim": "(A), (B), (D) không có căn cứ.", "tip": "Lý do từ chối thường đi sau 'Unfortunately / I'm afraid'."}, {"q": "What is the man asked to bring?", "opts": ["A portfolio of past work", "An ID card", "A reference letter", "A signed contract"], "a": "A", "type": "L34-do", "vi": "Người đàn ông được yêu cầu mang gì? → Tập hồ sơ các công việc đã làm.", "ex": "'bring a portfolio of your past campaigns'.", "elim": "Các giấy tờ khác không được nhắc.", "tip": "Câu yêu cầu ở cuối hội thoại: Please bring / Please send / Don't forget."}]}, {"part": 3, "convo": [["M", "So, about the leadership training next month. We have budget for twelve participants."], ["W", "We nominated fifteen people from our team."], ["M2", "That's what I was afraid of."], ["W", "Could we split it into two sessions?"], ["M", "The trainer charges per session, so that would cost more. But we could ask the finance department for extra money."], ["M2", "I'll draft the request today and send it to finance."]], "vocab": [["nominate", "đề cử"], ["participant", "người tham gia"], ["charge per session", "tính phí theo buổi"], ["draft a request", "soạn đề nghị"]], "qs": [{"q": "What are the speakers discussing?", "opts": ["A hiring plan", "A product launch", "A budget report", "A training program"], "a": "D", "type": "L34-main", "vi": "Họ đang thảo luận điều gì? → Một chương trình đào tạo.", "ex": "Câu đầu: 'the leadership training next month'.", "elim": "(C) 'budget' chỉ là chi tiết, không phải chủ đề.", "tip": "Hội thoại 3 người: chủ đề vẫn ở câu đầu, giống hội thoại 2 người."}, {"q": "What does the man mean when he says, \"That's what I was afraid of\"?", "opts": ["He expected there would be too many participants.", "He is nervous about speaking in public.", "He dislikes the trainer.", "He forgot the date of the training."], "a": "A", "type": "L34-intent", "vi": "Ý của 'Đó là điều tôi lo sợ' → Anh ấy đã đoán trước sẽ có quá nhiều người tham gia.", "ex": "Đáp lại '15 người' khi ngân sách chỉ cho 12 → điều anh lo đã xảy ra.", "elim": "(B), (C), (D) hiểu sai ngữ cảnh.", "tip": "Câu ý định = phản ứng với câu ngay trước. Ghi nhanh con số/sự việc ở câu trước."}, {"q": "What will one of the men do today?", "opts": ["Contact the trainer", "Prepare a funding request", "Reduce the list of participants", "Book a training room"], "a": "B", "type": "L34-next", "vi": "Một trong hai người đàn ông sẽ làm gì hôm nay? → Soạn đề nghị xin thêm kinh phí.", "ex": "'I'll draft the request today and send it to finance'.", "elim": "(A) trainer chỉ được nhắc về giá. (C) không ai đề xuất cắt bớt.", "tip": "draft a request ≈ prepare a request; extra money ≈ funding."}]}, {"part": 3, "convo": [["W", "Hi Raj, I'm looking at today's interview schedule. The candidate scheduled for ten o'clock just called to say his train is delayed."], ["M", "Oh no. Can we move him to the afternoon?"], ["W", "There's an open slot at two. I'll call him back to confirm."], ["M", "Good. And could you print copies of the candidates' résumés for the interview panel?"], ["W", "Sure, I'll do that now."]], "graphic": {"title": "Interview Schedule", "head": ["Time", "Candidate"], "rows": [["9:00", "Ana Silva"], ["10:00", "Ben Cole"], ["11:00", "Chloe Park"], ["1:00", "David Ito"]]}, "vocab": [["open slot", "khung giờ trống"], ["interview panel", "hội đồng phỏng vấn"], ["résumé", "sơ yếu lý lịch"]], "qs": [{"q": "Look at the graphic. Whose interview will be rescheduled?", "opts": ["Ana Silva's", "Ben Cole's", "Chloe Park's", "David Ito's"], "a": "B", "type": "L34-graphic", "vi": "Phỏng vấn của ai sẽ được dời lịch? → Ben Cole.", "ex": "Ứng viên lúc 10 giờ ('his train') → Ben Cole.", "elim": "Chỉ ứng viên 10:00 được nhắc tới.", "tip": "Người nói nhắc giờ (cột trái) → đáp án là tên (cột phải). Chú ý cả đại từ his/her."}, {"q": "Why will the interview be rescheduled?", "opts": ["The interviewer is busy.", "The room is unavailable.", "A train has been delayed.", "The candidate is ill."], "a": "C", "type": "L34-detail", "vi": "Vì sao phỏng vấn bị dời? → Một chuyến tàu bị trễ.", "ex": "'his train is delayed'.", "elim": "Các lý do khác không xuất hiện.", "tip": "Câu hỏi chi tiết theo đúng thứ tự thông tin trong bài."}, {"q": "What does the man ask the woman to do?", "opts": ["Call a candidate", "Book a room", "Update the schedule online", "Print some résumés"], "a": "D", "type": "L34-do", "vi": "Người đàn ông nhờ người phụ nữ làm gì? → In vài bản sơ yếu lý lịch.", "ex": "'could you print copies of the candidates' résumés'.", "elim": "(A) là việc cô TỰ đề nghị làm, không phải anh nhờ.", "tip": "Phân biệt 'ai nhờ ai': câu hỏi nói 'the man asks the woman' → nghe câu 'Could you...' của người đàn ông."}]}, {"part": 4, "convo": [["N", "Hello, this is Paulo Mendes from Human Resources. I'm calling all new employees about health insurance enrollment. You must choose a plan by October thirty-first. Otherwise, you'll be placed in the basic plan automatically. Information about the three available plans is in the employee handbook, on page twelve. If you have questions, I'll be holding an information session in the cafeteria this Wednesday at noon. Lunch will be provided."]], "vocab": [["enrollment", "sự đăng ký"], ["otherwise", "nếu không thì"], ["employee handbook", "sổ tay nhân viên"], ["be provided", "được cung cấp"]], "qs": [{"q": "What is the message mainly about?", "opts": ["Insurance enrollment", "A payroll change", "A cafeteria menu", "A training course"], "a": "A", "type": "L34-main", "vi": "Tin nhắn chủ yếu về điều gì? → Việc đăng ký bảo hiểm.", "ex": "'calling all new employees about health insurance enrollment'.", "elim": "(C) cafeteria chỉ là nơi tổ chức buổi giải đáp.", "tip": "'I'm calling about...' trong tin nhắn thoại = chủ đề."}, {"q": "What will happen if employees do not choose a plan by October 31?", "opts": ["They will pay a fee.", "They must attend a session.", "They will be assigned a default plan.", "They will lose their benefits."], "a": "C", "type": "L34-detail", "vi": "Nếu không chọn gói trước 31/10 thì sao? → Sẽ được xếp vào gói mặc định.", "ex": "'placed in the basic plan automatically' → default plan.", "elim": "(D) sai: vẫn có gói cơ bản.", "tip": "'Otherwise...' báo hậu quả → câu hỏi 'What will happen if...not...'."}, {"q": "What is mentioned about the session on Wednesday?", "opts": ["It will be held online.", "It is mandatory.", "It will take place in the HR office.", "A meal will be provided."], "a": "D", "type": "L34-detail", "vi": "Buổi giải đáp thứ Tư có gì đáng chú ý? → Có cung cấp bữa ăn.", "ex": "'Lunch will be provided'.", "elim": "(C) tổ chức ở cafeteria. (B) không bắt buộc ('If you have questions').", "tip": "lunch → a meal (paraphrase khái quát hóa)."}]}, {"part": 4, "convo": [["N", "Thanks for joining. Last month we sent out an employee survey, and the results are on the screen. Not surprisingly, flexible hours came out on top, and we're already working on a policy for that. Today, though, I want to talk about the option that came in second. Several of you mentioned that your laptops are over five years old. So, we've set aside money to replace them starting in January. Now, I know January sounds far away. But the supplier needs time to prepare two hundred devices."]], "graphic": {"title": "Survey: What would most improve your work life?", "head": ["Option", "Votes"], "rows": [["Flexible hours", "38%"], ["Better equipment", "27%"], ["More training", "21%"], ["Free snacks", "14%"]]}, "vocab": [["come out on top", "đứng đầu"], ["set aside money", "dành riêng một khoản tiền"], ["supplier", "nhà cung cấp"]], "qs": [{"q": "Look at the graphic. Which option will the speaker focus on?", "opts": ["Flexible hours", "Better equipment", "More training", "Free snacks"], "a": "B", "type": "L34-graphic", "vi": "Người nói sẽ tập trung vào lựa chọn nào? → Thiết bị tốt hơn.", "ex": "'the option that came in second' → 27% → Better equipment.", "elim": "(A) đứng đầu nhưng chỉ được nhắc lướt qua.", "tip": "Biểu đồ dạng xếp hạng: nghe từ thứ tự (top, second, lowest) và đối chiếu."}, {"q": "What will begin in January?", "opts": ["New training courses", "A flexible-hours policy", "Replacing computers", "A second survey"], "a": "C", "type": "L34-detail", "vi": "Điều gì bắt đầu vào tháng Một? → Thay máy tính.", "ex": "'replace them (laptops) starting in January'.", "elim": "(B) chính sách giờ linh hoạt đang soạn, không có mốc tháng Một.", "tip": "laptops → computers; replace → replacing."}, {"q": "Why does the speaker say, \"I know January sounds far away\"?", "opts": ["To acknowledge a possible concern", "To correct a date", "To ask for volunteers", "To announce a holiday"], "a": "A", "type": "L34-intent", "vi": "Vì sao người nói nói 'Tôi biết tháng Một nghe còn xa'? → Để thừa nhận một băn khoăn có thể có.", "ex": "Sau đó giải thích lý do (nhà cung cấp cần thời gian) → thừa nhận người nghe có thể muốn sớm hơn.", "elim": "Không sửa ngày, không xin tình nguyện viên.", "tip": "Mẫu 'I know... But...' = thừa nhận rồi giải thích. Rất hay ra ở Part 4."}]}], "reading": [{"part": 5, "qs": [{"q": "Ms. Ortega was hired because of her ______ experience in international recruitment.", "opts": ["extend", "extensive", "extensively", "extension"], "a": "B", "type": "R5-pos", "vi": "Cô Ortega được tuyển nhờ kinh nghiệm sâu rộng trong tuyển dụng quốc tế.", "ex": "Giữa tính từ sở hữu 'her' và danh từ 'experience' cần tính từ → extensive.", "elim": "(A) động từ, (C) trạng từ, (D) danh từ (không ghép 'extension experience').", "tip": "Từ loại là dạng nhiều nhất Part 5 (khoảng 8–10/30 câu). Chỉ cần nhìn 2 từ hai bên chỗ trống."}, {"q": "The ______ of the new HR software took longer than expected.", "opts": ["implement", "implemented", "implementation", "implementable"], "a": "C", "type": "R5-pos", "vi": "Việc triển khai phần mềm nhân sự mới mất nhiều thời gian hơn dự kiến.", "ex": "Sau 'The' và trước 'of' cần danh từ → implementation.", "elim": "(A) động từ; (B), (D) tính từ/phân từ.", "tip": "Cấu trúc 'The ___ of' gần như chắc chắn cần danh từ (đuôi -tion, -ment, -ance)."}, {"q": "Candidates who respond ______ to interview invitations make a good impression.", "opts": ["prompt", "promptness", "prompted", "promptly"], "a": "D", "type": "R5-pos", "vi": "Ứng viên phản hồi nhanh chóng lời mời phỏng vấn sẽ tạo ấn tượng tốt.", "ex": "Bổ nghĩa cho động từ 'respond' → trạng từ promptly.", "elim": "(A) tính từ, (B) danh từ, (C) động từ quá khứ.", "tip": "Nội động từ (respond, arrive, work) + ___ + giới từ → trạng từ."}, {"q": "Employees are ______ for reimbursement of job-related training costs.", "opts": ["eligible", "eligibility", "eligibly", "elect"], "a": "A", "type": "R5-pos", "vi": "Nhân viên đủ điều kiện được hoàn trả chi phí đào tạo liên quan đến công việc.", "ex": "Sau 'are' cần tính từ; cụm 'be eligible for'.", "elim": "(B) danh từ, (C) trạng từ, (D) động từ.", "tip": "Cụm tính từ + giới từ tần suất cao: eligible for, responsible for, available to, familiar with."}, {"q": "Since joining the company in 2020, Mr. Lee ______ three major software projects.", "opts": ["leads", "has led", "is leading", "will lead"], "a": "B", "type": "R5-verb", "vi": "Từ khi vào công ty năm 2020, anh Lee đã dẫn dắt ba dự án phần mềm lớn.", "ex": "'Since + mốc quá khứ' → hiện tại hoàn thành.", "elim": "(A), (C), (D) không dùng với since.", "tip": "Since / for / over the past / so far / recently → has/have V3."}, {"q": "The results of the employee survey ______ at next Monday's meeting.", "opts": ["will share", "sharing", "will be shared", "shared"], "a": "C", "type": "R5-verb", "vi": "Kết quả khảo sát nhân viên sẽ được chia sẻ tại cuộc họp thứ Hai tới.", "ex": "Kết quả ĐƯỢC chia sẻ (không có tân ngữ sau chỗ trống) + tương lai → will be shared.", "elim": "(A) chủ động thiếu tân ngữ. (B) không phải động từ chính. (D) sai thì.", "tip": "Hai câu hỏi cho động từ: chủ động hay bị động? Thì nào? Trả lời đủ 2 câu là chọn được."}, {"q": "Please submit your vacation requests ______ least two weeks in advance.", "opts": ["in", "at", "on", "by"], "a": "B", "type": "R5-prep", "vi": "Vui lòng nộp đơn xin nghỉ phép trước ít nhất hai tuần.", "ex": "Cụm cố định 'at least'.", "elim": "Các giới từ khác không tạo cụm với 'least'.", "tip": "Cụm giới từ cố định: at least, in advance, on time, in charge of, by the end of."}, {"q": "______ the hiring manager is on leave, interviews will be conducted by her assistant.", "opts": ["Despite", "Because", "During", "Due to"], "a": "B", "type": "R5-conj", "vi": "Vì quản lý tuyển dụng đang nghỉ phép nên phỏng vấn sẽ do trợ lý của cô ấy tiến hành.", "ex": "Sau chỗ trống là mệnh đề (S + V) và nghĩa nguyên nhân → Because.", "elim": "(A), (C), (D) là giới từ, phải đi với danh từ.", "tip": "Bẫy kinh điển: Because (+ mệnh đề) vs Due to/Because of (+ danh từ)."}, {"q": "______ his lack of management experience, Mr. Kim was promoted to supervisor.", "opts": ["Although", "However", "In spite of", "Even if"], "a": "C", "type": "R5-conj", "vi": "Mặc dù thiếu kinh nghiệm quản lý, anh Kim vẫn được thăng chức giám sát.", "ex": "Sau chỗ trống là cụm danh từ + nghĩa nhượng bộ → In spite of.", "elim": "(A), (D) cần mệnh đề. (B) là trạng từ nối, không đứng trước cụm danh từ như vậy.", "tip": "Nhượng bộ: Although/Even though + mệnh đề; Despite/In spite of + danh từ."}, {"q": "The company offers a competitive salary and a generous benefits ______.", "opts": ["package", "parcel", "bundle", "box"], "a": "A", "type": "R5-vocab", "vi": "Công ty đưa ra mức lương cạnh tranh và gói phúc lợi hậu hĩnh.", "ex": "Collocation 'benefits package' = gói phúc lợi.", "elim": "parcel/box là kiện hàng; bundle không đi với benefits trong ngữ cảnh tuyển dụng.", "tip": "Cụm tuyển dụng hay gặp: benefits package, job opening, probationary period, competitive salary."}, {"q": "Each department manager must review ______ team's performance reports before the end of the quarter.", "opts": ["they", "them", "himself", "his or her"], "a": "D", "type": "R5-pron", "vi": "Mỗi trưởng phòng phải xem xét báo cáo hiệu suất của nhóm mình trước cuối quý.", "ex": "Trước danh từ 'team's' cần tính từ sở hữu, chủ ngữ số ít 'Each manager' → his or her.", "elim": "(A) chủ ngữ, (B) tân ngữ, (C) phản thân.", "tip": "Trước danh từ → tính từ sở hữu (my, your, his or her, its, their)."}]}, {"part": 6, "passages": [{"kind": "Letter", "meta": "Brightline Solutions | To: Ms. Anna Varga", "body": "Dear Ms. Varga,\n\nWe are pleased to offer you the position of Customer Success Specialist at Brightline Solutions. Your starting salary will be $52,000 per year, and you will be {{0}} for our full benefits package after a 60-day probationary period. {{1}}\n\nPlease sign the enclosed contract and return it to us {{2}} November 15. If you have any questions, do not hesitate to contact me directly. We look forward to {{3}} you to the team."}], "vocab": [["probationary period", "thời gian thử việc"], ["enclosed", "được gửi kèm"], ["do not hesitate to", "đừng ngần ngại"]], "qs": [{"opts": ["eligible", "available", "capable", "responsible"], "a": "A", "type": "R6-word", "vi": "...bạn sẽ đủ điều kiện hưởng toàn bộ gói phúc lợi...", "ex": "'be eligible for' + quyền lợi.", "elim": "available to/for (có sẵn), capable of, responsible for (chịu trách nhiệm) không hợp nghĩa.", "tip": "Cùng một cụm có thể ra ở cả Part 5 và Part 6: học thuộc eligible for."}, {"opts": ["Our office is located near the subway station.", "We received many applications this year.", "Customer satisfaction is our top priority.", "Your first day will be Monday, December 1, beginning with an orientation session."], "a": "D", "type": "R6-sent", "vi": "Ngày làm việc đầu tiên của bạn là thứ Hai, 1/12, bắt đầu bằng buổi định hướng.", "ex": "Thư mời nhận việc: sau lương và phúc lợi là ngày bắt đầu, rồi mới đến yêu cầu ký hợp đồng.", "elim": "(A), (B), (C) đúng ngữ pháp nhưng không nối mạch thông tin về điều kiện làm việc của Ms. Varga.", "tip": "Câu đúng thường có chủ ngữ 'You/Your' hướng tới người nhận thư."}, {"opts": ["until", "by", "since", "within"], "a": "B", "type": "R6-word", "vi": "...gửi lại cho chúng tôi trước ngày 15/11.", "ex": "Hạn chót cho hành động 1 lần (return) → by.", "elim": "until dùng cho hành động kéo dài; since với HTHT; within + khoảng thời gian.", "tip": "by vs until là cặp ra nhiều nhất trong nhóm giới từ thời gian."}, {"opts": ["welcome", "welcoming", "welcomed", "be welcomed"], "a": "B", "type": "R6-word", "vi": "Chúng tôi mong được chào đón bạn gia nhập đội.", "ex": "look forward to + V-ing ('to' là giới từ).", "elim": "(A), (D) dạng nguyên mẫu sai. (C) quá khứ.", "tip": "to là giới từ trong: look forward to, be committed to, be dedicated to, object to → + V-ing."}]}, {"part": 7, "passages": [{"kind": "Text-message chain", "body": "Lena Fischer [4:40 P.M.]: Hi Marco, are you still at the office? Our new hire, Tomás, starts tomorrow, and his laptop isn't set up yet.\nMarco Rossi [4:42 P.M.]: I'm on my way out, but I can stay for another half hour.\nLena Fischer [4:43 P.M.]: That would be a huge help. His account details are in the onboarding folder.\nMarco Rossi [4:45 P.M.]: Got it. I'll leave the laptop on his desk when it's ready."}], "vocab": [["new hire", "nhân viên mới"], ["set up", "cài đặt"], ["onboarding", "quy trình tiếp nhận nhân viên mới"]], "qs": [{"q": "Who most likely is Mr. Rossi?", "opts": ["A new employee", "An IT technician", "A hiring manager", "A security guard"], "a": "B", "type": "R7-infer", "vi": "Ông Rossi có lẽ là ai? → Kỹ thuật viên IT.", "ex": "Được nhờ cài đặt máy tính và tài khoản cho nhân viên mới → làm IT.", "elim": "(A) nhân viên mới là Tomás. (C), (D) không phù hợp công việc cài đặt.", "tip": "Câu 'Who most likely' → suy từ việc người đó được nhờ làm."}, {"q": "At 4:42 P.M., what does Mr. Rossi mean when he writes, \"I'm on my way out\"?", "opts": ["He was about to leave the office.", "He forgot the laptop.", "He is outside the building.", "He disagrees with the request."], "a": "A", "type": "R7-intent", "vi": "'Tôi đang chuẩn bị về' → Anh ấy sắp rời văn phòng.", "ex": "Ngay sau đó: 'but I can stay for another half hour' → vốn định về.", "elim": "(C) hiểu theo nghĩa đen 'đã ở ngoài'. (D) anh đồng ý giúp.", "tip": "Câu ý định + 'but...' ngay sau: phần sau 'but' cho biết người đó vẫn sẽ hợp tác."}]}, {"part": 7, "passages": [{"kind": "Company newsletter", "title": "Mentorship Program Expands", "body": "After a successful pilot last spring, Arcway Logistics is expanding its mentorship program to all departments. Under the program, each new employee is paired with an experienced colleague for six months. Mentors meet with their mentees at least twice a month to discuss career goals, answer questions about company procedures, and provide feedback.\n\nAccording to HR Director Joy Adeyemi, 85 percent of participants in the pilot said the program helped them settle into their roles faster. Employees interested in serving as mentors should complete the online form by March 3. Mentors will receive a one-day training session and an additional day of paid leave each year."}], "vocab": [["pilot", "thử nghiệm"], ["be paired with", "được ghép cặp với"], ["settle into a role", "quen việc"], ["paid leave", "nghỉ phép có lương"]], "qs": [{"q": "What is the article mainly about?", "opts": ["The appointment of a new HR director", "A logistics contract", "The wider use of a mentoring program", "A training schedule for managers"], "a": "C", "type": "R7-main", "vi": "Bài báo chủ yếu nói về? → Mở rộng chương trình cố vấn.", "ex": "Tiêu đề + câu đầu: mở rộng chương trình ra toàn bộ phòng ban.", "elim": "(A) giám đốc nhân sự chỉ được trích lời.", "tip": "expand → wider use (paraphrase)."}, {"q": "What is NOT mentioned as something mentors do?", "opts": ["Discuss career goals", "Explain company procedures", "Provide feedback", "Evaluate salaries"], "a": "D", "type": "R7-not", "vi": "Điều gì KHÔNG được nhắc là việc của người cố vấn? → Đánh giá lương.", "ex": "Bài liệt kê: career goals, procedures, feedback.", "elim": "(A)–(C) đều có trong câu liệt kê.", "tip": "Câu NOT với danh sách: tìm câu có 3 mục nối bằng dấu phẩy + 'and'."}, {"q": "What will mentors receive?", "opts": ["A bonus", "A promotion", "An extra day off", "A company car"], "a": "C", "type": "R7-detail", "vi": "Người cố vấn sẽ nhận được gì? → Thêm một ngày nghỉ.", "ex": "'an additional day of paid leave each year'.", "elim": "Các phần thưởng khác không được nhắc.", "tip": "paid leave → day off (paraphrase)."}]}, {"part": 7, "passages": [{"kind": "Job advertisement", "title": "Bilingual Customer Support Agent — Kestra Travel (Remote)", "body": "Requirements: fluency in English and either Japanese or Korean; at least one year of customer service experience; a reliable home internet connection.\n\nShifts: Morning (6 A.M.–2 P.M.) | Afternoon (2 P.M.–10 P.M.) | Night (10 P.M.–6 A.M.)\nThe night shift pays an additional $3 per hour.\n\nSend your résumé to jobs@kestratravel.com by June 10."}, {"kind": "E-mail", "meta": "From: Hye-jin Seo | To: jobs@kestratravel.com | Date: June 6", "body": "Dear Hiring Team,\n\nI am applying for the Bilingual Customer Support Agent position. I am a native Korean speaker and have been working in English as a hotel receptionist for two years.\n\nAs I am currently taking evening classes, I would only be available for shifts that end before 6 P.M. or start at 10 P.M. or later."}, {"kind": "E-mail", "meta": "From: Kestra Travel Recruiting | To: Hye-jin Seo | Date: June 12", "body": "Dear Ms. Seo,\n\nThank you for your application. We would like to invite you to an online interview on June 18 at 9 A.M. Seoul time. As your availability matches our greatest need, we would like to discuss the position that includes additional hourly pay. Please confirm by replying to this e-mail."}], "vocab": [["fluency", "sự lưu loát"], ["reliable", "ổn định, đáng tin cậy"], ["availability", "thời gian rảnh có thể làm"]], "qs": [{"q": "What is a requirement for the position?", "opts": ["A university degree", "Fluency in three languages", "Two years of experience", "A stable internet connection"], "a": "D", "type": "R7-detail", "vi": "Yêu cầu của vị trí là gì? → Kết nối internet ổn định.", "ex": "'a reliable home internet connection' → reliable = stable.", "elim": "(B) chỉ cần 2 ngôn ngữ. (C) chỉ cần 1 năm.", "tip": "Bẫy số: đề nhắc '2 năm' ở email ứng viên, không phải yêu cầu."}, {"q": "What is suggested about Ms. Seo?", "opts": ["She meets the language requirement.", "She has applied after the deadline.", "She works for Kestra Travel.", "She prefers the afternoon shift."], "a": "A", "type": "R7-cross", "vi": "Có thể suy ra gì về cô Seo? → Cô đáp ứng yêu cầu ngôn ngữ.", "ex": "Yêu cầu: English + Japanese/Korean; cô nói tiếng Hàn bản ngữ và làm việc bằng tiếng Anh.", "elim": "(B) nộp 6/6, trước hạn 10/6. (D) cô không làm được ca chiều.", "tip": "Câu suggested ở bài nhiều văn bản thường cần ghép yêu cầu (văn bản 1) với hồ sơ (văn bản 2)."}, {"q": "Which shift will most likely be discussed at the interview?", "opts": ["Morning", "Afternoon", "Night", "Weekend"], "a": "C", "type": "R7-cross", "vi": "Ca nào nhiều khả năng sẽ được bàn trong phỏng vấn? → Ca đêm.", "ex": "Văn bản 3: vị trí có thêm tiền theo giờ → văn bản 1: ca đêm (+$3/giờ). Văn bản 2: cô làm được ca bắt đầu từ 10 giờ tối.", "elim": "(A) cô làm được nhưng không có phụ cấp thêm.", "tip": "Câu ba văn bản: dịch 'the position that includes additional hourly pay' ngược về bảng ca ở văn bản 1."}, {"q": "Why can't Ms. Seo work the afternoon shift?", "opts": ["She has another job.", "She takes classes in the evening.", "She lives far from the office.", "Her internet connection is unreliable."], "a": "B", "type": "R7-detail", "vi": "Vì sao cô Seo không làm ca chiều? → Cô học buổi tối.", "ex": "'currently taking evening classes' → ca 2 giờ chiều đến 10 giờ tối trùng giờ học.", "elim": "(A) cô từng làm lễ tân nhưng không nói là còn làm.", "tip": "Câu Why: tìm 'As / Because / since' trong văn bản."}, {"q": "What is Ms. Seo asked to do?", "opts": ["Send her résumé again", "Take a language test", "Reply to confirm the interview", "Call the recruiting office"], "a": "C", "type": "R7-detail", "vi": "Cô Seo được yêu cầu làm gì? → Trả lời email để xác nhận buổi phỏng vấn.", "ex": "'Please confirm by replying to this e-mail'.", "elim": "Các hành động khác không được yêu cầu.", "tip": "Yêu cầu nằm ở câu Please cuối email."}]}]}, {"id": 7, "title": "Đề 7", "theme": "Marketing, bán hàng & sự kiện", "focus": true, "listening": [{"part": 1, "scene": "Một người phụ nữ đứng cạnh màn chiếu, đưa tay chỉ vào một biểu đồ cột; vài người ngồi quanh bàn họp nhìn theo.", "sp": "N", "vocab": [["point at", "chỉ vào"], ["hand out", "phát (tài liệu)"], ["projector", "máy chiếu"]], "qs": [{"opts": ["She's pointing at a chart on a screen.", "She's turning off a projector.", "People are leaving the room.", "She's handing out documents."], "a": "A", "type": "L1-person", "vi": "(A) Cô ấy đang chỉ vào biểu đồ trên màn hình.", "ex": "Động từ 'pointing at' và vật 'chart on a screen' đều khớp.", "elim": "(B) không tắt máy chiếu. (C) mọi người đang ngồi. (D) không phát tài liệu.", "tip": "Ảnh thuyết trình/họp rất phổ biến: pointing at, giving a presentation, looking at a screen, seated around a table."}]}, {"part": 1, "scene": "Một gian hàng hội chợ không người: sản phẩm được xếp ngay ngắn trên các kệ, phía trên treo một tấm biển lớn.", "sp": "N", "vocab": [["booth", "gian hàng"], ["merchandise", "hàng hóa"], ["be arranged", "được sắp xếp"]], "qs": [{"opts": ["A vendor is setting up a booth.", "Visitors are walking through an exhibition.", "Some products have been arranged on shelves.", "A sign is being hung."], "a": "C", "type": "L1-scene", "vi": "(C) Một số sản phẩm đã được sắp xếp trên kệ.", "ex": "Bị động hoàn thành mô tả trạng thái hàng đã xếp sẵn.", "elim": "(A), (B) có người. (D) 'is being hung' cần người đang treo.", "tip": "Ghi nhớ bộ động từ trạng thái: arranged, displayed, stacked, lined up, placed, left."}]}, {"part": 2, "q": "When is the marketing campaign going to launch?", "sp": ["W", "M"], "vocab": [["launch", "ra mắt"], ["final approval", "phê duyệt cuối cùng"]], "qs": [{"opts": ["Not until we get final approval.", "At the campaign office.", "Lunch is at noon."], "a": "A", "type": "L2-wh", "vi": "Khi nào chiến dịch marketing ra mắt? → Chưa đâu, phải đợi phê duyệt cuối cùng.", "ex": "When → 'Not until...' là cách trả lời thời gian gián tiếp.", "elim": "(B) trả lời Where, lặp 'campaign'. (C) bẫy gần âm 'launch – lunch'.", "tip": "'Not until...' là đáp án đúng rất hay gặp cho câu When."}]}, {"part": 2, "q": "Where are the brochures for the trade show?", "sp": ["M", "W"], "vocab": [["brochure", "tờ quảng cáo"], ["trade show", "hội chợ thương mại"]], "qs": [{"opts": ["Yes, it was a great show.", "Kevin packed them in the van.", "Around two hundred copies."], "a": "B", "type": "L2-wh", "vi": "Tờ quảng cáo cho hội chợ ở đâu? → Kevin đã đóng chúng vào xe tải.", "ex": "Where → (B) cho biết vị trí gián tiếp.", "elim": "(A) Yes cho câu WH, lặp 'show'. (C) trả lời How many.", "tip": "Đáp án Where có thể dùng tên người: 'Kevin has them', 'Ask Kevin'."}]}, {"part": 2, "q": "Who's in charge of the social media accounts?", "sp": ["W", "M"], "vocab": [["be in charge of", "phụ trách"], ["specialist", "chuyên viên"]], "qs": [{"opts": ["Mostly on weekends.", "The charge was too high.", "We hired a new specialist for that."], "a": "C", "type": "L2-wh", "vi": "Ai phụ trách các tài khoản mạng xã hội? → Chúng tôi đã thuê một chuyên viên mới cho việc đó.", "ex": "Who → (C) chỉ người.", "elim": "(A) trả lời When. (B) 'charge' nghĩa phí (bẫy đa nghĩa).", "tip": "charge: phí / sạc / phụ trách → bẫy kinh điển."}]}, {"part": 2, "q": "Didn't the client approve the new logo?", "sp": ["M", "W"], "vocab": [["approve", "phê duyệt"]], "qs": [{"opts": ["She wants a few more changes.", "It's a nice log cabin.", "I can prove it."], "a": "A", "type": "L2-tag", "vi": "Khách hàng chưa duyệt logo mới à? → Cô ấy muốn sửa thêm vài chỗ.", "ex": "Trả lời ngầm 'chưa duyệt' bằng lý do (A).", "elim": "(B) gần âm 'logo – log'. (C) gần âm 'approve – prove'.", "tip": "Câu phủ định có 2 bẫy
